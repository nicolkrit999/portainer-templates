services:
  stirling-pdf:
    container_name: stirling-pdf
    image: ghcr.io/stirling-tools/stirling-pdf
    mem_limit: 4g
    cpus: 4.0
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${DOCKER_CONFIG_DIR}/stirling-pdf/data:/usr/share/tessdata:rw
      - ${DOCKER_CONFIG_DIR}/stirling-pdf/config:/configs:rw
      - ${DOCKER_CONFIG_DIR}/stirling-pdf/logs:/logs:rw
      # RAM-backed, disposable JVM scratch dir - Stirling-PDF's Spring Boot
      # process uses the system temp dir (defaults to /tmp) for scratch
      # files during merge/split/OCR/convert operations. Moved off the
      # container's disk-backed writable overlay into RAM. Bounded at 1GiB
      # so it can't grow unbounded and pressure host memory; mode 1777
      # (world-writable + sticky) so the non-root container user can write
      # to it regardless of configured UID/GID, since tmpfs mounts default
      # to root ownership. Contents never touch disk and are wiped on
      # container stop/recreate.
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 1073741824
          mode: 1777
    environment:
     PUID: 1000
     PGID: 10
     DOCKER_ENABLE_SECURITY: true
     SECURITY_ENABLELOGIN: true
     SECURITY_INITIALLOGIN_USERNAME: "${STIRLING_PDF_USERNAME}"
     SECURITY_INITIALLOGIN_PASSWORD: "${STIRLING_PDF_PASSWORD}"
     INSTALL_BOOK_AND_ADVANCED_HTML_OPS: false
     SECURITY_CSRFDISABLED: true
     SYSTEM_DEFAULTLOCALE: it_CH
     UI_APPNAME: kritPDF
     UI_HOMEDESCRIPTION: kritPDF
     UI_APPNAMENAVBAR: Bober
     SYSTEM_MAXFILESIZE: 5000
     METRICS_ENABLED: true
     SYSTEM_GOOGLEVISIBILITY: false
    restart: unless-stopped
    ports:
      - "${STIRLING_PDF_HOST_PORT}:8080"
    networks:
      - cloudflare_web_services
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.stirling-pdf.rule: "Host(`${STIRLING_PDF_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.stirling-pdf.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.stirling-pdf.tls: "true"
      traefik.http.routers.stirling-pdf.service: "stirling-pdf"
      traefik.http.routers.stirling-pdf.middlewares: "hsts-headers@docker"
      traefik.http.routers.stirling-pdf-tailnet.rule: "Host(`${STIRLING_PDF_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.stirling-pdf-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.stirling-pdf-tailnet.tls: "true"
      traefik.http.routers.stirling-pdf-tailnet.service: "stirling-pdf"
      traefik.http.routers.stirling-pdf-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.stirling-pdf.loadbalancer.server.port: "8080"
      traefik.docker.network: "traefik-proxy"

networks:
  cloudflare_web_services:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
