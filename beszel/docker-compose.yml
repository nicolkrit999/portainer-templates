services:
  beszel:
    container_name: beszel
    image: henrygd/beszel:latest
    volumes:
      - ${DOCKER_CONFIG_DIR}/beszel:/beszel_data:rw
    ports:
      - "8096:8090"
    environment:
      - PORT=8090
    restart: always
    labels:
      traefik.enable: "true"
      traefik.http.routers.beszel.rule: "Host(`${BESZEL_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.beszel.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.beszel.tls: "true"
      traefik.http.routers.beszel.service: "beszel"
      traefik.http.routers.beszel.middlewares: "hsts-headers@docker"
      traefik.http.routers.beszel-tailnet.rule: "Host(`${BESZEL_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.beszel-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.beszel-tailnet.tls: "true"
      traefik.http.routers.beszel-tailnet.service: "beszel"
      traefik.http.routers.beszel-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.beszel.loadbalancer.server.port: "8090"
      traefik.docker.network: "traefik-proxy"
    networks:
      - beszel_backend_network
      - traefik_proxy_network

  beszel-agent:
    image: henrygd/beszel-agent
    container_name: Beszel-Agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKER_CONFIG_DIR}/beszel/agent:/var/lib/beszel-agent:rw
    environment:
      TOKEN: "${BESZEL_AGENT_TOKEN}"
      HUB_URL: "${BESZEL_HUB_URL}"
      LISTEN: "45876"
      KEY: "${BESZEL_AGENT_KEY}"
      FILESYSTEM: "${BESZEL_FILESYSTEM}"
    restart: unless-stopped
    networks:
      - beszel_backend_network

networks:
  beszel_backend_network:
    name: beszel-backend
    internal: true
    ipam:
      config:
        - subnet: "${BESZEL_BACKEND_SUBNET:-172.16.97.0/28}"
          gateway: "${BESZEL_BACKEND_GATEWAY:-172.16.97.1}"
          ip_range: "${BESZEL_BACKEND_IP_RANGE:-172.16.97.8/29}"
  traefik_proxy_network:
    name: traefik-proxy
    external: true
