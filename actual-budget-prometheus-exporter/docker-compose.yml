services:
  actual-budget-prometheus-exporter:
    image: docker.io/sakowicz/actual-budget-prometheus-exporter:1.3.2
    container_name: actual-budget-prometheus-exporter
    restart: unless-stopped
    environment:
      ACTUAL_SERVER_URL: "http://ActualBudget:5006"
      ACTUAL_PASSWORD: "${ACTUAL_PASSWORD:?set ACTUAL_PASSWORD}"
      ACTUAL_BUDGET_ID_1: "${ACTUAL_BUDGET_ID_1:?set ACTUAL_BUDGET_ID_1}"
      ACTUAL_BUDGET_NAME_1: "${ACTUAL_BUDGET_NAME_1:-budget}"
      ACTUAL_BUDGET_ID_2: "${ACTUAL_BUDGET_ID_2:?set ACTUAL_BUDGET_ID_2}"
      ACTUAL_BUDGET_NAME_2: "${ACTUAL_BUDGET_NAME_2:?set ACTUAL_BUDGET_NAME_2}"
      TZ: "${TZ}"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3001 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - actual_backend_network
      - monitoring_network

networks:
  actual_backend_network:
    name: actual-backend
    external: true
  monitoring_network:
    name: monitoring-net
    external: true
