services:
  pocket-id:
    container_name: pocket-id
    image: ghcr.io/pocket-id/pocket-id:v1
    restart: unless-stopped

    environment:
      APP_URL: ${APP_URL}
      TRUST_PROXY: ${TRUST_PROXY}
      PUID: ${PUID}
      PGID: ${PGID}

    ports:
      - "1411:1411"

    volumes:
      - ${DOCKER_CONFIG_DIR}/pocket-id:/app/data:rw

    healthcheck:
      test: [ "CMD", "/app/pocket-id", "healthcheck" ]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s

    networks:
      - cloudflare_web_network
      - traefik_proxy_network

    labels:
      traefik.enable: "true"
      traefik.http.routers.pocket-id.rule: "Host(`${POCKET_ID_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.pocket-id.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.pocket-id.tls: "true"
      traefik.http.routers.pocket-id.service: "pocket-id"
      traefik.http.routers.pocket-id.middlewares: "hsts-headers@docker"
      traefik.http.services.pocket-id.loadbalancer.server.port: "1411"
      traefik.docker.network: "traefik-proxy"

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
