services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    # WHY THIS ENTRYPOINT OVERRIDE EXISTS: AdGuard Home's DNS listener bind
    # address (`dns.bind_hosts` in the persisted AdGuardHome.yaml) is
    # config-file-only - there is no environment variable or post-setup UI
    # toggle for it, it's normally set once by the first-run setup wizard
    # and then never revisited. This repo's `tailscale-adguard` stack runs
    # a socat DNS relay (`tailscale-adguard-dns-relay`) that targets
    # `adguard:53` over the `traefik-proxy` Docker network (this
    # container's dynamically-assigned IP there, e.g. 172.27.0.63) so a
    # Tailscale identity can reach AdGuard's DNS server - but the wizard only ever
    # bound `dns.bind_hosts` to this container's macvlan LAN IP
    # (${ADGUARD_STATIC_IP}), so AdGuard refuses the relay's connection
    # (confirmed live: `socat[...] W connect(5, AF=2 172.27.0.63:53, 16):
    # Connection refused`). Since this repo's convention is git-tracked,
    # declarative fixes rather than one-off manual container edits (which
    # a future stack redeploy or container recreate would silently lose),
    # this entrypoint wraps the real binary with a patch that adds
    # `0.0.0.0` as a new first entry under the top-level `dns:` section's
    # `bind_hosts:` key.
    #
    # Two hard-won design points, both confirmed live on 2026-09-07 after
    # an earlier version of this script actually corrupted the live config
    # and put AdGuard into a crash loop - do not simplify either away:
    #
    # 1. The new list item's indentation is taken from the EXISTING first
    #    `bind_hosts` item's own leading whitespace (captured via `IND=`),
    #    never hardcoded. A hardcoded indent that doesn't exactly match the
    #    sibling item's column causes YAML to treat the two lines as one
    #    continued scalar (`0.0.0.0 - 192.168.1.96` as a single malformed
    #    string) instead of two list entries - this is exactly what
    #    happened and crashed AdGuard with a config parse error.
    # 2. The whole patch is gated behind a persistent marker file
    #    (`.bind_hosts_patched`, in the same bind-mounted conf volume) that
    #    is only ever written AFTER a patch attempt completes - so the
    #    mutation can run AT MOST ONCE per volume lifetime, not on every
    #    container start/restart. `restart: always` plus a patch that reran
    #    every restart meant any latent bug would compound with each crash
    #    cycle, which is exactly what happened before this was added.
    #
    # The awk logic still tracks whether it's inside the top-level `dns:`
    # block so it only matches THAT section's `bind_hosts:` key, never any
    # other `bind_hosts:`-like line elsewhere in the file. If `bind_hosts:`
    # isn't found at all under `dns:` (format drift, e.g. flow-style
    # `bind_hosts: []`), a WARN is printed to stderr (visible via
    # `docker logs adguard`) but startup is never blocked, and the marker
    # is still written so a permanently-unmatched pattern doesn't retry
    # every single restart. The image's default CMD is NOT preserved
    # automatically by overriding `entrypoint:` (a separate confirmed
    # Docker/Compose gotcha - see the `command:` comment below) - "$@"
    # only carries the args explicitly restored via `command:`.
    entrypoint: ["sh", "-c", "CONF=/opt/adguardhome/conf/AdGuardHome.yaml; MARKER=/opt/adguardhome/conf/.bind_hosts_patched; if [ -f \"$$CONF\" ] && [ ! -f \"$$MARKER\" ]; then IND=`awk '/^[^[:space:]]/{in_dns=($0 ~ /^dns:[[:space:]]*$/)} in_dns && /^[[:space:]]*bind_hosts:[[:space:]]*$/{getline nx; match(nx, /^[[:space:]]*/); print substr(nx, RSTART, RLENGTH); exit}' \"$$CONF\"`; ALREADY=`awk '/^[^[:space:]]/{in_dns=($0 ~ /^dns:[[:space:]]*$/)} in_dns && /^[[:space:]]*bind_hosts:[[:space:]]*$/{getline nx; print nx; exit}' \"$$CONF\" | grep -c '0\\.0\\.0\\.0' || true`; if [ -n \"$$IND\" ] && [ \"$$ALREADY\" = \"0\" ]; then awk -v ind=\"$$IND\" '/^[^[:space:]]/{in_dns=($0 ~ /^dns:[[:space:]]*$/)} {print} in_dns && !done && /^[[:space:]]*bind_hosts:[[:space:]]*$/{print ind \"- 0.0.0.0\"; done=1}' \"$$CONF\" > \"$$CONF.tmp\" && mv \"$$CONF.tmp\" \"$$CONF\"; fi; if [ -z \"$$IND\" ]; then echo \"WARN: dns.bind_hosts not found in $$CONF - AdGuard may only be reachable on 127.0.0.1, check AdGuardHome.yaml format\" >&2; fi; touch \"$$MARKER\"; fi; exec /opt/adguardhome/AdGuardHome \"$@\"", "sh"]
    # Docker/Compose gotcha (confirmed live, 2026-09-07): overriding
    # `entrypoint:` WITHOUT also setting `command:` silently clears the
    # image's default CMD to null - it is NOT preserved and passed through
    # via "$@" as might be assumed. Without this, AdGuardHome launched with
    # zero flags (no `-c`/`-w`), couldn't find its real config at the
    # default path, and silently reverted to first-run setup mode (only
    # port 3000, no DNS on 53/80 at all). This `command:` restores the
    # image's actual original default args (`docker inspect` on the
    # upstream image before any override: Cmd =
    # ["--no-check-update", "-c", "/opt/adguardhome/conf/AdGuardHome.yaml",
    # "-w", "/opt/adguardhome/work"]) so they reach the binary via "$@"
    # exactly as before this entrypoint override was ever added.
    command: ["--no-check-update", "-c", "/opt/adguardhome/conf/AdGuardHome.yaml", "-w", "/opt/adguardhome/work"]
    networks:
      adguard_net:
        ipv4_address: ${ADGUARD_STATIC_IP}
        priority: 100
      traefik_proxy_network:

    labels:
      traefik.enable: "true"
      traefik.http.routers.adguard.rule: "Host(`${ADGUARD_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.adguard.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.adguard.tls: "true"
      traefik.http.routers.adguard.service: "adguard"
      traefik.http.routers.adguard.middlewares: "hsts-headers@docker"
      traefik.http.routers.adguard-tailnet.rule: "Host(`${ADGUARD_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.adguard-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.adguard-tailnet.tls: "true"
      traefik.http.routers.adguard-tailnet.service: "adguard"
      traefik.http.routers.adguard-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.adguard.loadbalancer.server.port: "80"
      traefik.docker.network: "traefik-proxy"

    volumes:
      - ${VOLUME_DATA}/adguard/work:/opt/adguardhome/work
      - ${VOLUME_CONFIG}/adguard/conf:/opt/adguardhome/conf
    restart: always
    healthcheck:
      # Port 3000 only exists during the one-time first-run setup wizard;
      # once setup completes (config persists in the conf volume) the web
      # UI moves permanently to port 80 and 3000 goes away. This check
      # tolerates both states so it doesn't start failing forever after
      # first boot.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:80/ || wget -q -O - http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Docker cannot create two separate macvlan networks bound to the same
  # parent interface/subnet - `traefik-private-forwarder` already owns a
  # live macvlan network on this exact LAN subnet/gateway
  # (parent bridge0, 192.168.1.0/24 / .1), so adguard must join that
  # existing network as external instead of defining its own (which fails
  # at deploy time with "failed to allocate gateway: Address already in
  # use"). Same external-network-reuse pattern already used below for
  # `traefik_proxy_network`. Any future service needing its own static
  # macvlan LAN IP must join this same network the same way.
  adguard_net:
    external: true
    name: traefik-private-forwarder_traefik_forwarder_net
  traefik_proxy_network:
    name: traefik-proxy
    external: true
