services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    networks:
      adguard_net:
        ipv4_address: ${ADGUARD_STATIC_IP}
        priority: 100
      traefik_proxy_network:

    labels:
      traefik.enable: "true"
      traefik.http.routers.adguard.rule: "Host(`${ADGUARD_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.adguard.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.adguard.tls: "true"
      traefik.http.routers.adguard.service: "adguard"
      traefik.http.routers.adguard.middlewares: "hsts-headers@docker"
      traefik.http.routers.adguard-tailnet.rule: "Host(`${ADGUARD_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.adguard-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.adguard-tailnet.tls: "true"
      traefik.http.routers.adguard-tailnet.service: "adguard"
      traefik.http.routers.adguard-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.adguard.loadbalancer.server.port: "80"
      traefik.docker.network: "traefik-proxy"

    volumes:
      - ${VOLUME_DATA}/adguard/work:/opt/adguardhome/work
      - ${VOLUME_CONFIG}/adguard/conf:/opt/adguardhome/conf
    restart: always
    healthcheck:
      # Port 3000 only exists during the one-time first-run setup wizard;
      # once setup completes (config persists in the conf volume) the web
      # UI moves permanently to port 80 and 3000 goes away. This check
      # tolerates both states so it doesn't start failing forever after
      # first boot.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:80/ || wget -q -O - http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  adguard_net:
    driver: macvlan
    driver_opts:
      parent: ${LAN_INTERFACE}
    ipam:
      config:
        - subnet: ${LAN_SUBNET}
          gateway: ${LAN_GATEWAY}
          ip_range: ${ADGUARD_STATIC_IP}/32
  traefik_proxy_network:
    name: traefik-proxy
    external: true
