services:
  adguard:
    image: adguard/adguardhome
    container_name: adguard
    cap_add:
      - NET_ADMIN
    networks:
      adguard_net:
        ipv4_address: ${ADGUARD_STATIC_IP}
        priority: 100
      cloudflare-web:
        priority: 1000
      traefik_proxy_network:

    labels:
      traefik.enable: "true"
      traefik.http.routers.adguard.rule: "Host(`${ADGUARD_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.adguard.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.adguard.tls: "true"
      traefik.http.routers.adguard.tls.certresolver: "cf_dns"
      traefik.http.routers.adguard.service: "adguard"
      traefik.http.services.adguard.loadbalancer.server.port: "80"
      traefik.docker.network: "traefik-proxy"

    volumes:
      - ${DOCKER_CONFIG_DIR}/adguard/work:/opt/adguardhome/work
      - ${DOCKER_CONFIG_DIR}/adguard/conf:/opt/adguardhome/conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  adguard_net:
    driver: macvlan
    driver_opts:
      parent: ${LAN_INTERFACE}
    ipam:
      config:
        - subnet: ${LAN_SUBNET}
          gateway: ${LAN_GATEWAY}
          ip_range: ${ADGUARD_STATIC_IP}/32
  cloudflare-web:
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
