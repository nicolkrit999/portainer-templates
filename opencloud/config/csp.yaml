# Default Content-Security-Policy for OpenCloud's web UI.
# Mirrors oCIS/OpenCloud's documented default CSP shape: allow self plus the
# instance's own OC_URL origin for the directives the web UI actually needs.
# Tighten further once the web UI's real external asset needs (if any) are known.
directives:
  default-src:
    - "'self'"
  script-src:
    - "'self'"
    - "'unsafe-inline'"
  style-src:
    - "'self'"
    - "'unsafe-inline'"
  img-src:
    - "'self'"
    - "data:"
    - "blob:"
  font-src:
    - "'self'"
    - "data:"
  connect-src:
    - "'self'"
  media-src:
    - "'self'"
  object-src:
    - "'none'"
  frame-ancestors:
    - "'self'"
