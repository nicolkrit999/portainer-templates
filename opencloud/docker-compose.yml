services:
  opencloud:
    image: "${OC_DOCKER_IMAGE:-opencloudeu/opencloud-rolling}:${OC_DOCKER_TAG:-8.1.0}"
    container_name: "opencloud"
    # University file storage - important but not core infra, matches this
    # repo's "high but not highest" tier (same as vikunja/paperlessngx/homebox).
    cpu_shares: 2048
    mem_limit: 4g
    user: "${PUID}:${PGID}"
    entrypoint: ["/bin/sh"]
    command: ["-c", "opencloud init || true; opencloud server"]
    restart: always
    depends_on:
      fix-permissions:
        condition: service_completed_successfully
    environment:
      OC_URL: "https://${OPENCLOUD_SUBDOMAIN:-opencloud}.${DOMAIN}"
      OC_LOG_LEVEL: "${LOG_LEVEL:-info}"
      OC_LOG_COLOR: "false"
      OC_LOG_PRETTY: "false"
      PROXY_TLS: "false"
      OC_INSECURE: "false"
      # Basic auth accepts the real account password on every endpoint and is
      # documented upstream as for tests/development only. The desktop and
      # mobile apps use OIDC against the built-in IdP; WebDAV clients that
      # cannot (rclone, davfs2) can use per-user app tokens as the password.
      PROXY_ENABLE_BASIC_AUTH: "${OPENCLOUD_ENABLE_BASIC_AUTH:-false}"
      # App tokens (account settings > App Tokens) work as the password of a WebDAV mount
      # (username + token) without accepting the real account password on every endpoint.
      PROXY_ENABLE_APP_AUTH: "true"
      IDM_CREATE_DEMO_USERS: "false"
      IDM_ADMIN_PASSWORD: "${OPENCLOUD_ADMIN_PASSWORD}"
      # SMTP - Gmail relay via an app password (requires 2FA enabled on the
      # Google account: https://myaccount.google.com/apppasswords)
      NOTIFICATIONS_SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      NOTIFICATIONS_SMTP_PORT: "${SMTP_PORT:-587}"
      NOTIFICATIONS_SMTP_SENDER: "${SMTP_SENDER}"
      NOTIFICATIONS_SMTP_USERNAME: "${SMTP_USERNAME}"
      NOTIFICATIONS_SMTP_PASSWORD: "${SMTP_PASSWORD}"
      NOTIFICATIONS_SMTP_INSECURE: "false"
      NOTIFICATIONS_SMTP_AUTHENTICATION: "login"
      NOTIFICATIONS_SMTP_ENCRYPTION: "starttls"
      FRONTEND_ARCHIVER_MAX_SIZE: "10000000000"
      FRONTEND_CHECK_FOR_UPDATES: "true"
      PROXY_CSP_CONFIG_FILE_LOCATION: "/etc/opencloud/csp.yaml"
      OC_PASSWORD_POLICY_BANNED_PASSWORDS_LIST: "banned-password-list.txt"
      OC_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD: "true"
      OC_SHARING_PUBLIC_WRITEABLE_SHARE_MUST_HAVE_PASSWORD: "true"
      OC_PASSWORD_POLICY_DISABLED: "false"
      OC_PASSWORD_POLICY_MIN_CHARACTERS: "8"
      OC_PASSWORD_POLICY_MIN_LOWERCASE_CHARACTERS: "1"
      OC_PASSWORD_POLICY_MIN_UPPERCASE_CHARACTERS: "1"
      OC_PASSWORD_POLICY_MIN_DIGITS: "1"
      OC_PASSWORD_POLICY_MIN_SPECIAL_CHARACTERS: "1"
      TZ: "${TZ}"
    volumes:
      - "${DOCKER_CONFIG_DIR}/opencloud/config:/etc/opencloud"
      - "${DOCKER_DATA_DIR}/opencloud/data:/var/lib/opencloud"
      # Extra web apps (draw.io, calculator, etc.) - extract each app's
      # zip into its own subfolder here, e.g. .../apps/draw-io/manifest.json.
      # Per OpenCloud's own docs, apps in this directory auto-appear with no
      # enable-list needed; a plain `docker restart opencloud` (no recreate)
      # picks up newly-added apps.
      - "${DOCKER_DATA_DIR}/opencloud/apps:/var/lib/opencloud/web/assets/apps"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9200/status.php"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    # The proxy verifies OIDC tokens by fetching the discovery document from the public issuer URL
    # (OC_URL), so the container must reach its own public hostname. This pins that name to the
    # public Traefik's fixed address on public-opencloud: the call stays inside the host, needs no
    # public DNS or router hairpin NAT, and the certificate is the publicly valid one.
    # Keep PUBLIC_OPENCLOUD_PROXY_IP equal to the value in the traefik-public stack.
    extra_hosts:
      - "${OPENCLOUD_SUBDOMAIN:-opencloud}.${DOMAIN}:${PUBLIC_OPENCLOUD_PROXY_IP:-172.16.86.2}"
    networks:
      - traefik_proxy_network
      - public_opencloud_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.opencloud-private.rule: "Host(`${OPENCLOUD_SUBDOMAIN:-opencloud}.${DOMAIN}`)"
      traefik.http.routers.opencloud-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.opencloud-private.tls: "true"
      traefik.http.routers.opencloud-private.service: "opencloud-private"
      traefik.http.routers.opencloud-private.middlewares: "hsts-headers@docker"
      traefik.http.services.opencloud-private.loadbalancer.server.port: "9200"
      traefik.http.routers.opencloud-tailnet.rule: "Host(`${OPENCLOUD_SUBDOMAIN:-opencloud}.${DOMAIN}`)"
      traefik.http.routers.opencloud-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.opencloud-tailnet.tls: "true"
      traefik.http.routers.opencloud-tailnet.service: "opencloud-private"
      traefik.http.routers.opencloud-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.docker.network: "traefik-proxy"

  # Static OpenCloud config content is embedded as base64 below (decode with
  # `echo '<blob>' | base64 -d`) rather than bind-mounted from a sibling
  # ./config/ file - Portainer runs compose inside its own container, so a
  # relative bind source resolves to a path that does not exist on the NAS and
  # Docker creates an empty directory there (see
  # .claude/rules/gotchas/portainer-relative-bind-mounts.md). To change
  # csp.yaml/apps.yaml/banned-password-list.txt, edit the plaintext, re-run
  # `base64 -w0 <file>`, and replace the matching blob below.
  fix-permissions:
    image: alpine:3.24
    container_name: "opencloud-init"
    restart: "no"
    user: root
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    command: "sh -c \"echo 'Seeding OpenCloud static config...' && echo '' | base64 -d > /fix/config/csp.yaml && echo '' | base64 -d > /fix/config/apps.yaml && echo 'IyBPcHQtaW4gYmFubmVkLXBhc3N3b3JkIGxpc3QgZm9yIE9DX1BBU1NXT1JEX1BPTElDWV9CQU5ORURfUEFTU1dPUkRTX0xJU1QuCiMgRW1wdHkgYnkgZGVmYXVsdCAtIGFkZCBvbmUgYmFubmVkIHBhc3N3b3JkIHBlciBsaW5lIHRvIGVuYWJsZSB0aGlzIGNoZWNrLgo=' | base64 -d > /fix/config/banned-password-list.txt && echo 'Fixing OpenCloud config/data permissions...' && find /fix/config /fix/data /fix/apps ! -user ${PUID} -exec chown -h ${PUID}:${PGID} {} + && find /fix/config /fix/data /fix/apps ! -group ${PGID} -exec chown -h ${PUID}:${PGID} {} + && echo 'Permissions fixed. Exiting.'\""
    volumes:
      - "${DOCKER_CONFIG_DIR}/opencloud/config:/fix/config"
      - "${DOCKER_DATA_DIR}/opencloud/data:/fix/data"
      - "${DOCKER_DATA_DIR}/opencloud/apps:/fix/apps"

networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
  # Backend network of the public Traefik; the traefik-public stack must be deployed first.
  public_opencloud_network:
    name: public-opencloud
    external: true
