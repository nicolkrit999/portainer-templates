services:
  kavita:
    image: jvmilazz0/kavita:latest
    container_name: kavita
    volumes:
      - ${DOCKER_DATA_DIR}/kavita/manga:/manga
      - ${DOCKER_DATA_DIR}/kavita/comics:/comics
      - ${DOCKER_DATA_DIR}/kavita/books:/books
      - ${DOCKER_DATA_DIR}/kavita/data:/kavita/config
    environment:
      - TZ=${TZ}
    restart: unless-stopped
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.kavita.rule: "Host(`${KAVITA_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.kavita.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.kavita.tls: "true"
      traefik.http.routers.kavita.service: "kavita"
      traefik.http.routers.kavita.middlewares: "hsts-headers@docker"
      traefik.http.services.kavita.loadbalancer.server.port: "5000"
      traefik.docker.network: "traefik-proxy"

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
