services:
  icorsi-sync:
    build: .
    image: icorsi-sync:local
    pull_policy: build          # locally built image - never try to pull from a registry
    container_name: icorsi-sync
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # NOTE: every value is quoted on purpose - Portainer's stack deployer rejects
      # unquoted YAML booleans/numbers with an opaque "[object Object]" UI error.
      TZ: "${TZ}"
      PUID: "${PUID:-1000}"                                # host uid the container drops to (owns /data)
      PGID: "${PGID:-1000}"
      ICORSI_BASE_URL: "https://www.icorsi.ch"
      ICORSI_TOKEN: "${ICORSI_TOKEN:-}"                     # secret: Moodle WS token (bootstrap only)
      ICORSI_PRIVATETOKEN: "${ICORSI_PRIVATETOKEN:-}"       # secret: enables headless auto-renewal (bootstrap only)
      ICORSI_SESSION_COOKIE: "${ICORSI_SESSION_COOKIE:-}"   # secret: session-based renewal fallback (bootstrap only)
      ICORSI_USERID: "${ICORSI_USERID:-}"                   # your Moodle userid (auto-discovered if empty)
      OPENCLOUD_WEBDAV_URL: "${OPENCLOUD_WEBDAV_URL}"       # e.g. http://opencloud:9200/dav/spaces/<space-id>
      OPENCLOUD_USER: "${OPENCLOUD_USER}"
      OPENCLOUD_APP_PASSWORD: "${OPENCLOUD_APP_PASSWORD}"   # secret (OpenCloud app password)
      OPENCLOUD_HOST_HEADER: "${OPENCLOUD_HOST_HEADER:-}"   # optional trusted domain, e.g. opencloud.${DOMAIN}
      OPENCLOUD_BASE_PATH: "${OPENCLOUD_BASE_PATH}"         # e.g. 1-year/2025-2026 (relative to the space root)
      SUBFOLDER: "${SUBFOLDER:-_icorsi}"
      INCLUDE_URL_LINKS: "${INCLUDE_URL_LINKS:-true}"      # save url modules as .txt
      SAVE_SECTION_INFO: "${SAVE_SECTION_INFO:-true}"      # labels + section intros -> _info.md
      SAVE_FORUMS: "${SAVE_FORUMS:-true}"                  # forums/announcements -> .md (read-only)
      EXCLUDE_MODULES: "${EXCLUDE_MODULES:-}"              # optional opt-out filter; empty = fetch from all types
      PRUNE_ORPHANS: "${PRUNE_ORPHANS:-false}"            # delete files no longer in the course (one current copy; to trash)
      PRUNE_MAX_ORPHAN_FRACTION: "${PRUNE_MAX_ORPHAN_FRACTION:-0.8}"   # refuse a course's prune if more than this share of its files would be deleted
      RECON_MAX_PASSES: "${RECON_MAX_PASSES:-5}"          # reconcile passes that retry still-missing files
      ICORSI_CONCURRENCY: "${ICORSI_CONCURRENCY:-4}"      # parallel per-file transfers within a course
      SYNC_INTERVAL_SECONDS: "${SYNC_INTERVAL_SECONDS:-21600}"   # 6h
      RUN_ON_START: "${RUN_ON_START:-true}"
      DRY_RUN: "${DRY_RUN:-false}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"       # secret, optional
      HEARTBEAT_URL: "${HEARTBEAT_URL:-}"                   # optional: GET after each successful run (uptime-kuma/healthchecks.io)
      AUTH_HANDOFF_DIR: "/auth"                             # request/result handoff with icorsi-auth (automatic re-login)
    volumes:
      - ${VOLUME_CONFIG}/icorsi-sync/data:/data
      - ${VOLUME_CONFIG}/icorsi-sync/auth:/auth
    networks:
      - cloudflare_web_network
    healthcheck:
      # unhealthy if state.json's last_run is older than 2x the sync interval (i.e. a run was missed)
      test: ["CMD", "python", "-c", "import json,time,os,sys; d=json.load(open('/data/state.json')); t=time.mktime(time.strptime(d['last_run'],'%Y-%m-%d %H:%M:%S')); iv=int(os.environ.get('SYNC_INTERVAL_SECONDS','21600')) or 21600; sys.exit(0 if time.time()-t < 2*iv else 1)"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 15m
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # automatic re-login sidecar - security boundary documented in README "Automatic re-login"
  icorsi-auth:
    build: ./auth
    image: icorsi-auth:local
    pull_policy: build
    container_name: icorsi-auth
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777   # HOME + Chromium's throwaway profile; /dev/shm is not used (--disable-dev-shm-usage)
    mem_limit: 768m                 # headless Chromium; the tmpfs /tmp counts against it
    environment:
      TZ: "${TZ}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      AUTH_HANDOFF_DIR: "/auth"
      AUTH_STATE_DIR: "/state"
      ICORSI_MS_USERNAME: "${ICORSI_MS_USERNAME:-}"         # your SUPSI Microsoft e-mail
      ICORSI_MS_PASSWORD: "${ICORSI_MS_PASSWORD:-}"         # secret: your SUPSI Microsoft password
      ICORSI_MS_TOTP_SECRET: "${ICORSI_MS_TOTP_SECRET:-}"   # secret: base32 seed of your authenticator-app TOTP (spaces/lowercase OK)
    volumes:
      - ${VOLUME_CONFIG}/icorsi-sync/auth:/auth
      - ${VOLUME_CONFIG}/icorsi-sync/auth-state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import time,sys; sys.exit(0 if time.time()-int(open('/auth/heartbeat').read())<60 else 1)"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
