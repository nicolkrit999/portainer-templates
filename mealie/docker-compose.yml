services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.30.0
    container_name: mealie
    restart: unless-stopped
    cpu_shares: 2048
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - ${DOCKER_DATA_DIR}/mealie/mealie_data:/app/data/
    environment:
      ALLOW_SIGNUP: "false"
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
      MAX_WORKERS: "1"
      WEB_CONCURRENCY: "1"
      BASE_URL: "https://${MEALIE_SUBDOMAIN}.${DOMAIN}"
      HOST_IP: "${MEALIE_TRUSTED_PROXIES:-172.27.0.0/16,172.16.83.0/28}"
      OIDC_AUTH_ENABLED: "true"
      OIDC_SIGNUP_ENABLED: "true"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET}"
      OIDC_USER_CLAIM: "preferred_username"
      OIDC_PROVIDER_NAME: "Pocket ID"
      OIDC_CONFIGURATION_URL: "${OIDC_CONFIGURATION_URL}"
    networks:
      - traefik_proxy_network
      - public_mealie_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.mealie-family.rule: "Host(`${MEALIE_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.mealie-family.entrypoints: "${TRAEFIK_ENTRYPOINT_1}"
      traefik.http.routers.mealie-family.tls: "true"
      traefik.http.routers.mealie-family.service: "mealie"
      traefik.http.routers.mealie-family.middlewares: "hsts-headers@docker"
      traefik.http.routers.mealie-guest.rule: "Host(`${MEALIE_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.mealie-guest.entrypoints: "${TRAEFIK_ENTRYPOINT_2}"
      traefik.http.routers.mealie-guest.tls: "true"
      traefik.http.routers.mealie-guest.service: "mealie"
      traefik.http.routers.mealie-guest.middlewares: "hsts-headers@docker"
      traefik.http.services.mealie.loadbalancer.server.port: "9000"
      traefik.http.routers.mealie-private.rule: "Host(`${MEALIE_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.mealie-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.mealie-private.tls: "true"
      traefik.http.routers.mealie-private.service: "mealie-private"
      traefik.http.routers.mealie-private.middlewares: "hsts-headers@docker"
      traefik.http.services.mealie-private.loadbalancer.server.port: "9000"
      traefik.docker.network: "traefik-proxy"

networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
  # Backend network of the public Traefik; the traefik-public stack must be deployed first.
  public_mealie_network:
    name: public-mealie
    external: true
