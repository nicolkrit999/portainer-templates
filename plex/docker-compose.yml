services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    cpu_shares: 2048
    cpus: 4.0
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    ports:
      - "${PLEX_HOST_PORT}:32400"
    volumes:
      - ${DOCKER_CONFIG_DIR}/plex/config:/config
      - ${DOCKER_DATA_DIR}/jellyfin/tv-shows:/tv
      - ${DOCKER_DATA_DIR}/jellyfin/movies:/movie
    networks:
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.plex-private.rule: "Host(`${PLEX_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.plex-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.plex-private.tls: "true"
      traefik.http.routers.plex-private.service: "plex-private"
      traefik.http.routers.plex-private.middlewares: "hsts-headers@docker"
      traefik.http.routers.plex-tailnet.rule: "Host(`${PLEX_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.plex-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.plex-tailnet.tls: "true"
      traefik.http.routers.plex-tailnet.service: "plex-private"
      traefik.http.routers.plex-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.plex-private.loadbalancer.server.port: "32400"
      traefik.docker.network: "traefik-proxy"
    restart: unless-stopped

networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
