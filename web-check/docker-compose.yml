services:
  webcheck:
    container_name: Web-Check
    image: lissy93/web-check
    mem_limit: 4g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.webcheck.rule: "Host(`${WEB_CHECK_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.webcheck.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.webcheck.tls: "true"
      traefik.http.routers.webcheck.tls.certresolver: "cf_dns"
      traefik.http.routers.webcheck.service: "webcheck"
      traefik.http.routers.webcheck.middlewares: "hsts-headers@docker"
      traefik.http.services.webcheck.loadbalancer.server.port: "3000"
      traefik.docker.network: "traefik-proxy"

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
