services:
  navidrome:
    container_name: navidrome
    image: deluan/navidrome:0.64.2
    user: "${PUID}:${PGID}"
    mem_limit: 6g
    cpu_shares: 2048
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    volumes:
      - ${DOCKER_CONFIG_DIR}/navidrome:/data:rw
      - ${DOCKER_CONFIG_DIR}/navidrome/music-root:/music:rw

      # Music locations, put as many as needed
      - ${MUSIC_DIR_1}:/music/user1:ro
      - ${MUSIC_DIR_2}:/music/user2:ro
      - ${MUSIC_DIR_3}:/music/user3:ro

      - ${DOCKER_CONFIG_DIR}/navidrome/empty-library-fallback:/empty:rw
      - ${DOCKER_CONFIG_DIR}/navidrome/cache:/var/cache/navidrome:rw
    environment:
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_MUSICFOLDER: "/music"
      ND_ENABLESHARING: "false"
    networks:
      - traefik_proxy_network
      - public_navidrome_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.navidrome-family.rule: "Host(`${NAVIDROME_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.navidrome-family.entrypoints: "${TRAEFIK_ENTRYPOINT_1}"
      traefik.http.routers.navidrome-family.tls: "true"
      traefik.http.routers.navidrome-family.service: "navidrome"
      traefik.http.routers.navidrome-family.middlewares: "hsts-headers@docker"
      traefik.http.routers.navidrome-guest.rule: "Host(`${NAVIDROME_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.navidrome-guest.entrypoints: "${TRAEFIK_ENTRYPOINT_2}"
      traefik.http.routers.navidrome-guest.tls: "true"
      traefik.http.routers.navidrome-guest.service: "navidrome"
      traefik.http.routers.navidrome-guest.middlewares: "hsts-headers@docker"
      traefik.http.services.navidrome.loadbalancer.server.port: "4533"
      traefik.http.routers.navidrome-private.rule: "Host(`${NAVIDROME_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.navidrome-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.navidrome-private.tls: "true"
      traefik.http.routers.navidrome-private.service: "navidrome-private"
      traefik.http.routers.navidrome-private.middlewares: "hsts-headers@docker"
      traefik.http.routers.navidrome-tailnet.rule: "Host(`${NAVIDROME_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.navidrome-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7:-tailnet-admin}"
      traefik.http.routers.navidrome-tailnet.tls: "true"
      traefik.http.routers.navidrome-tailnet.service: "navidrome-private"
      traefik.http.routers.navidrome-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.navidrome-private.loadbalancer.server.port: "4533"
      traefik.docker.network: "traefik-proxy"

networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
  # Backend network of the public Traefik; the traefik-public stack must be deployed first.
  public_navidrome_network:
    name: public-navidrome
    external: true
