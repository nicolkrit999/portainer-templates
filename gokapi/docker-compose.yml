services:
  gokapi-init:
    image: alpine
    container_name: gokapi-init
    restart: "no"
    user: "0"
    volumes:
      - ${VOLUME_CONFIG}/gokapi:/data
    # chmod after chown: the NAS volume's `ugacl` layer overrides POSIX mode
    # bits and is only reset by an explicit chmod on each object. Recursive
    # only on config/ (small); data/ holds the uploaded files, so only its
    # top-level directory is touched to keep a redeploy from walking them all.
    command: sh -c "mkdir -p /data/data /data/config && chown -R ${PUID}:${PGID} /data/config && chown ${PUID}:${PGID} /data /data/data && chmod -R 0700 /data/config && chmod 0700 /data /data/data"

  gokapi:
    image: f0rc3/gokapi:v2.2.4
    container_name: gokapi
    cpu_shares: 2048
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    depends_on:
      gokapi-init:
        condition: service_completed_successfully
    environment:
      TZ: "${TZ}"
      GOKAPI_LOG_STDOUT: "true"
      GOKAPI_USE_CLOUDFLARE: "true"
      GOKAPI_TRUSTED_PROXIES: "${GOKAPI_TRUSTED_PROXIES}"
      GOKAPI_MAX_FILESIZE: "10485760"
      GOKAPI_MAX_FILES_GUESTUPLOAD: "0"
      GOKAPI_MAX_SIZE_GUESTUPLOAD: "0"
      GOKAPI_CHUNK_SIZE_MB: "45"
      GOKAPI_MAX_PARALLEL_UPLOADS: "3"
      GOKAPI_MAX_MEMORY_UPLOAD: "50"
      GOKAPI_GUEST_UPLOAD_BY_DEFAULT: "true"
      GOKAPI_DISABLE_API_MENU: "true"
      GOKAPI_ENABLE_HOTLINK_VIDEOS: "true"
    volumes:
      - ${VOLUME_CONFIG}/gokapi/data:/app/data
      - ${VOLUME_CONFIG}/gokapi/config:/app/config
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:53842"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      # Deliberately absent from dnsmasq-tailnet's tailnet-admin DNS
      # override list: this is a multi-tier service, and listing it would
      # send family/friends tailnet devices to the admin-only entrypoint (403).
      #
      # GOKAPI_USE_CLOUDFLARE trusts CF-Connecting-IP unconditionally, so the
      # middleware below strips it on every Traefik-routed path. Real
      # Cloudflare traffic reaches the container directly via cloudflared and
      # never passes through Traefik, so it is unaffected.
      traefik.http.routers.gokapi.rule: "Host(`${GOKAPI_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.gokapi.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.gokapi.tls: "true"
      traefik.http.routers.gokapi.service: "gokapi"
      traefik.http.routers.gokapi.middlewares: "hsts-headers@docker,gokapi-strip-cf@docker"
      traefik.http.routers.gokapi-family.rule: "Host(`${GOKAPI_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.gokapi-family.entrypoints: "${TRAEFIK_ENTRYPOINT_1}"
      traefik.http.routers.gokapi-family.tls: "true"
      traefik.http.routers.gokapi-family.service: "gokapi"
      traefik.http.routers.gokapi-family.middlewares: "hsts-headers@docker,gokapi-strip-cf@docker"
      traefik.http.routers.gokapi-friends.rule: "Host(`${GOKAPI_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.gokapi-friends.entrypoints: "${TRAEFIK_ENTRYPOINT_4}"
      traefik.http.routers.gokapi-friends.tls: "true"
      traefik.http.routers.gokapi-friends.service: "gokapi"
      traefik.http.routers.gokapi-friends.middlewares: "hsts-headers@docker,gokapi-strip-cf@docker"
      traefik.http.routers.gokapi-tailnet.rule: "Host(`${GOKAPI_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.gokapi-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.gokapi-tailnet.tls: "true"
      traefik.http.routers.gokapi-tailnet.service: "gokapi"
      traefik.http.routers.gokapi-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker,gokapi-strip-cf@docker"
      traefik.http.middlewares.gokapi-strip-cf.headers.customrequestheaders.CF-Connecting-IP: ""
      traefik.http.services.gokapi.loadbalancer.server.port: "53842"
      traefik.docker.network: "traefik-proxy"

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
