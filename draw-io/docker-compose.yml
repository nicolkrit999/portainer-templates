services:
  drawio:
    container_name: draw-io
    image: jgraph/drawio
    mem_limit: 16g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.drawio.rule: "Host(`${DRAWIO_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.drawio.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.drawio.tls: "true"
      traefik.http.routers.drawio.tls.certresolver: "cf_dns"
      traefik.http.routers.drawio.service: "drawio"
      traefik.http.routers.drawio.middlewares: "hsts-headers@docker"
      traefik.http.services.drawio.loadbalancer.server.port: "8080"
      traefik.docker.network: "traefik-proxy"

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
