services:
  # STOPGAP: this container provides a single wildcard DNS override for the
  # household's LAN while no UniFi gateway is in place. Once a UniFi gateway
  # is installed, its built-in DNS Records feature should replace this
  # entirely - this is not meant to be a permanent piece of infrastructure.
  #
  # Deliberately NOT attached to cloudflare-web or traefik-proxy: this is a
  # raw DNS (port 53) service, not HTTP, and is not meant to be reachable
  # through either tunnel/proxy.
  #
  # Deliberately network_mode: host (not macvlan) so it binds directly to
  # the NAS's existing LAN IP and never goes stale the way a macvlan static
  # IP assignment did for a sibling service.
  #
  # Deliberately restart: "no" - this is started/stopped manually via
  # Portainer/docker start whenever actively testing, and must NOT come
  # back automatically after a host reboot or crash.
  dnsmasq:
    image: 4km3/dnsmasq:2.90-r3
    container_name: dnsmasq
    network_mode: host
    restart: "no"
    cap_add:
      - NET_ADMIN
    # ENTRYPOINT of this image is already ["/usr/sbin/dnsmasq", "--keep-in-foreground"];
    # command: here is appended as extra dnsmasq CLI args, not a replacement.
    command:
      - "--address=/${DNS_WILDCARD_DOMAIN}/${DNS_TARGET_IP}"
      # Per-hostname overrides for the private-tier Traefik entrypoint: these
      # are more specific than the general wildcard rule above, and dnsmasq's
      # own matching precedence prefers the most specific match automatically
      # (standard documented dnsmasq behavior - no extra flags needed). Any
      # hostname listed here resolves to DNS_PRIVATE_IP instead of the
      # general DNS_TARGET_IP used by everything else under the domain.
      - "--address=/adguard.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/affine.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/apprise-api.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/audiobookshelf.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/beszel.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/blender.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/bytestash.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/cardyo.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/mailpit.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/phpldapadmin.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/change-detection.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/convertx.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/coolify.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/datetime.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/dockpeek.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/draw-io.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/duplicati.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/excalidraw.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/filebrowser.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/fossflow.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/glance.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/glances.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/gocron.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/gotify.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/harborguard.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/holyclaude.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/home-assistant.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/it-tools.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/radarr.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/sonarr.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/kavita.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/lifeglance.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/linkwarden.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/moocup.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/n8n.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/opennotebook.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/openresume.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/paperlessngx.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/pocket-id.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/portainer.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/privatebin.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/qbit-torrent.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/snapotter.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/snappyemail.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/sosse.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/sparkyfitness.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/stirling-pdf.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/termix.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/tugtainer.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/upsnap.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/uptime-kuma.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/web-check.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/withoutbg.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/ytptube.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/traefik.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--log-facility=-"
      - "--listen-address=${DNS_TARGET_IP}"
      - "--bind-interfaces"
      # This resolver only ever answers for ${DNS_WILDCARD_DOMAIN} (queries reach
      # it only via the Tailscale restricted nameserver or manual LAN testing),
      # so filtering these record types globally is safe here. Without this,
      # AAAA/HTTPS/SVCB queries fall through to the real upstream and leak
      # Cloudflare's actual public edge (IPv6 address, ECH config, etc.) even
      # though the A record is correctly overridden - defeating the whole
      # point of this override for IPv6-preferring clients.
      - "--filter-AAAA"
      - "--filter-rr=HTTPS"
      - "--filter-rr=SVCB"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
