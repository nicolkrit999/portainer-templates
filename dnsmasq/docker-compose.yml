services:
  # PERMANENT INFRASTRUCTURE (confirmed 2026-08-22): provides the wildcard
  # DNS override for the household's LAN/tailnet split-DNS. UniFi's gateway
  # UI does not support wildcard DNS natively - the long-term plan is either
  # migrating this ruleset into the gateway's own internal dnsmasq, or
  # having UniFi's "Forward Domain" feature delegate nicolkrit.ch to this
  # container - either way, this container itself is not going away.
  #
  # Deliberately NOT attached to traefik-proxy: this is a raw DNS (port 53)
  # service, not HTTP, and is not meant to be reachable through the proxy.
  #
  # Deliberately network_mode: host (not macvlan) so it binds directly to
  # the NAS's existing LAN IP and never goes stale the way a macvlan static
  # IP assignment did for a sibling service.
  #
  # restart: always - split-DNS for the whole household now depends on this
  # container; it must come back automatically after a host reboot or crash.
  dnsmasq:
    image: 4km3/dnsmasq:2.90-r3
    container_name: dnsmasq
    cpu_shares: 4096
    network_mode: host
    restart: always
    cap_add:
      - NET_ADMIN
    # ENTRYPOINT of this image is already ["/usr/sbin/dnsmasq", "--keep-in-foreground"];
    # command: here is appended as extra dnsmasq CLI args, not a replacement.
    command:
      # Every hostname under the domain resolves to the private Traefik tier
      # (traefik-private-forwarder's macvlan LAN IP). DNS_TARGET_IP below is
      # only the address this resolver listens on.
      - "--address=/${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      # Git over SSH is not HTTP: Gitea publishes it on the NAS itself, so this one name
      # resolves to the NAS's LAN IP instead of the private-tier forwarder.
      - "--address=/gitea-ssh.${DNS_WILDCARD_DOMAIN}/${DNS_TARGET_IP}"
      - "--log-facility=-"
      - "--listen-address=${DNS_TARGET_IP}"
      # 2026-09-08: also bind the macvlan-host-shim IP directly - that
      # sibling stack's socat relay was removed (dnsmasq runs
      # network_mode: host, so it can bind this IP itself, no relay hop
      # needed at all). See
      # ../adguard/INCIDENT-2026-09-08-dns-relay-outage.md and
      # ../macvlan-host-shim/docker-compose.yml.
      - "--listen-address=${MACVLAN_SHIM_IP}"
      # --bind-dynamic (not --bind-interfaces): the macvlan-shim0 interface
      # this second listen-address depends on lives in a SEPARATE stack
      # (macvlan-host-shim) with no deploy-order guarantee relative to this
      # one - --bind-interfaces hard-fails at startup if a listed address
      # isn't already present; --bind-dynamic instead starts listening on
      # it whenever it appears. Still only binds the addresses explicitly
      # listed here (not a wildcard) - same accept scope as before, just
      # tolerant of startup ordering. --except-interface=lo is defensive:
      # this repo has a real prior incident of dnsmasq crash-looping from
      # a too-permissive bind colliding with systemd-resolved on
      # 127.0.0.1:53 (see git history/agent memory for
      # dnsmasq_service.md) - excluding loopback here costs nothing if
      # unneeded, and prevents that exact failure mode if it is.
      - "--bind-dynamic"
      - "--except-interface=lo"
      # This resolver only ever answers for ${DNS_WILDCARD_DOMAIN} (queries reach
      # it only via the Tailscale restricted nameserver or manual LAN testing),
      # so filtering these record types globally is safe here. Without this,
      # AAAA/HTTPS/SVCB queries fall through to the real upstream and leak
      # Cloudflare's actual public edge (IPv6 address, ECH config, etc.) even
      # though the A record is correctly overridden - defeating the whole
      # point of this override for IPv6-preferring clients.
      - "--filter-AAAA"
      - "--filter-rr=HTTPS"
      - "--filter-rr=SVCB"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
