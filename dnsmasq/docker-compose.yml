services:
  # STOPGAP: this container provides a single wildcard DNS override for the
  # household's LAN while no UniFi gateway is in place. Once a UniFi gateway
  # is installed, its built-in DNS Records feature should replace this
  # entirely - this is not meant to be a permanent piece of infrastructure.
  #
  # Deliberately NOT attached to cloudflare-web or traefik-proxy: this is a
  # raw DNS (port 53) service, not HTTP, and is not meant to be reachable
  # through either tunnel/proxy.
  #
  # Deliberately network_mode: host (not macvlan) so it binds directly to
  # the NAS's existing LAN IP and never goes stale the way a macvlan static
  # IP assignment did for a sibling service.
  #
  # Deliberately restart: "no" - this is started/stopped manually via
  # Portainer/docker start whenever actively testing, and must NOT come
  # back automatically after a host reboot or crash.
  dnsmasq:
    image: 4km3/dnsmasq:2.90-r3
    container_name: dnsmasq
    network_mode: host
    restart: "no"
    cap_add:
      - NET_ADMIN
    # ENTRYPOINT of this image is already ["/usr/sbin/dnsmasq", "--keep-in-foreground"];
    # command: here is appended as extra dnsmasq CLI args, not a replacement.
    command:
      - "--address=/${DNS_WILDCARD_DOMAIN}/${DNS_TARGET_IP}"
      - "--log-facility=-"
      - "--listen-address=${DNS_TARGET_IP}"
      - "--bind-interfaces"
      # This resolver only ever answers for ${DNS_WILDCARD_DOMAIN} (queries reach
      # it only via the Tailscale restricted nameserver or manual LAN testing),
      # so filtering these record types globally is safe here. Without this,
      # AAAA/HTTPS/SVCB queries fall through to the real upstream and leak
      # Cloudflare's actual public edge (IPv6 address, ECH config, etc.) even
      # though the A record is correctly overridden - defeating the whole
      # point of this override for IPv6-preferring clients.
      - "--filter-AAAA"
      - "--filter-rr=HTTPS"
      - "--filter-rr=SVCB"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
