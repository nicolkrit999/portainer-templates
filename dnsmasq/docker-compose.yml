      - "--address=/portainer.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/privatebin.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/promemoria.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/qbit-torrent.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/ricette.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/snapotter.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/snappyemail.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/soketi-coolify.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/sosse.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/sparkyfitness.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/stirling-pdf.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/termix.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/trek.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/tugtainer.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/upsnap.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/uptime-kuma.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/viaggi.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/web-check.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/withoutbg.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/ytptube.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      - "--address=/traefik.${DNS_WILDCARD_DOMAIN}/${DNS_PRIVATE_IP}"
      # Exceptions: hostnames that are deliberately Cloudflare-Tunnel-ONLY
      # and were never migrated to Traefik (Cloudflare Access SSH
      # applications, in this case) - the general wildcard rule above would
      # otherwise intercept them too and point LAN/tailnet clients straight
      # at this NAS instead of letting them resolve via real public DNS to
      # Cloudflare's edge, which is what these hostnames actually need.
      # Confirmed broken this way 2026-08-23: `cloudflared access ssh
      # --hostname gitea-ssh.nicolkrit.ch` was hitting Traefik directly
      # (which has no router/cert for this hostname, by design) instead of
      # Cloudflare Access, because local DNS answered with this NAS's own
      # IP. `--server=/domain/ip` forwards matching queries to the named
      # upstream instead of answering locally - more specific than the
      # wildcard `--address` rule above, so it wins for these exact labels
      # only (same precedence rule as the private-tier overrides above).
      # If another Cloudflare-only, non-Traefik application is added later
      # (check the Cloudflare Tunnel dashboard's public hostname list, not
      # this repo, since that config lives there), add its hostname here too.
      - "--server=/gitea-ssh.${DNS_WILDCARD_DOMAIN}/1.1.1.1"
      - "--server=/ssh.${DNS_WILDCARD_DOMAIN}/1.1.1.1"
      - "--log-facility=-"
      - "--listen-address=${DNS_TARGET_IP}"
      - "--bind-interfaces"
      # This resolver only ever answers for ${DNS_WILDCARD_DOMAIN} (queries reach
      # it only via the Tailscale restricted nameserver or manual LAN testing),
      # so filtering these record types globally is safe here. Without this,
      # AAAA/HTTPS/SVCB queries fall through to the real upstream and leak
      # Cloudflare's actual public edge (IPv6 address, ECH config, etc.) even
      # though the A record is correctly overridden - defeating the whole
      # point of this override for IPv6-preferring clients.
      - "--filter-AAAA"
      - "--filter-rr=HTTPS"
      - "--filter-rr=SVCB"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
