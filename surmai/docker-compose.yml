services:
  surmai:
    image: ghcr.io/rohitkumbhar/surmai:latest
    container_name: viaggi
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      - ${DOCKER_DATA_DIR}/surmai:/pb_data:rw
    environment:
      SURMAI_ADMIN_EMAIL: "${SURMAI_ADMIN_EMAIL}"
      SURMAI_ADMIN_PASSWORD: "${SURMAI_ADMIN_PASSWORD}"
      PB_DATA_DIRECTORY: /pb_data
    restart: unless-stopped
    networks:
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.surmai-private.rule: "Host(`${SURMAI_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.surmai-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.surmai-private.tls: "true"
      traefik.http.routers.surmai-private.service: "surmai-private"
      traefik.http.routers.surmai-private.middlewares: "hsts-headers@docker"
      traefik.http.services.surmai-private.loadbalancer.server.port: "8080"
      traefik.http.routers.surmai-tailnet.rule: "Host(`${SURMAI_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.surmai-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.surmai-tailnet.tls: "true"
      traefik.http.routers.surmai-tailnet.service: "surmai-private"
      traefik.http.routers.surmai-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.docker.network: "traefik-proxy"

networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
