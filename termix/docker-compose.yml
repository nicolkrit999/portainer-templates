services:
  termix:
    image: ghcr.io/lukegus/termix:latest
    container_name: termix
    restart: unless-stopped
    user: "0:0"
    privileged: true
    volumes:
      - ${DOCKER_CONFIG_DIR}/termix:/app/data:rw
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.termix.rule: "Host(`${TERMIX_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.termix.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.termix.tls: "true"
      traefik.http.routers.termix.tls.certresolver: "cf_dns"
      traefik.http.routers.termix.service: "termix"
      traefik.http.routers.termix.middlewares: "hsts-headers@docker"
      traefik.http.services.termix.loadbalancer.server.port: "8080"
      traefik.docker.network: "traefik-proxy"
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
