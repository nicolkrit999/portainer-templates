services:
  trek:
    image: mauriceboe/trek:5.1.0
    container_name: trek
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - KILL
    # The entrypoint chowns the data dirs and then drops to the node user with
    # gosu, so it has to start as root. KILL lets dumb-init signal node on stop.
    user: "0:0"
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
    volumes:
      - ${VOLUME_CONFIG:?VOLUME_CONFIG must be set}/trek/data:/app/data:rw
      - ${VOLUME_DATA:?VOLUME_DATA must be set}/trek/uploads:/app/uploads:rw
    environment:
      NODE_ENV: "production"
      ENCRYPTION_KEY: "${TREK_ENCRYPTION_KEY}"
      TZ: "${TZ}"
      ADMIN_EMAIL: "${TREK_ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${TREK_ADMIN_PASSWORD}"
      PORT: "3000"
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: "${TREK_APP_URL}"
      TRUST_PROXY: "1"
      APP_URL: "${TREK_APP_URL}"
      #OIDC_ISSUER: "${TREK_OIDC_ISSUER}"
      #OIDC_CLIENT_ID: "trek"
      #OIDC_CLIENT_SECRET: "${TREK_OIDC_CLIENT_SECRET}"
      #OIDC_DISPLAY_NAME: "SSO"
      #OIDC_ONLY: "false"
    networks:
      - traefik_proxy_network
      - public_trek_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.trek-private.rule: "Host(`${TREK_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.trek-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.trek-private.tls: "true"
      traefik.http.routers.trek-private.service: "trek-private"
      traefik.http.routers.trek-private.middlewares: "hsts-headers@docker"
      traefik.http.routers.trek-tailnet.rule: "Host(`${TREK_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.trek-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.trek-tailnet.tls: "true"
      traefik.http.routers.trek-tailnet.service: "trek-private"
      traefik.http.routers.trek-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.trek-private.loadbalancer.server.port: "3000"
      traefik.docker.network: "traefik-proxy"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
  # Backend network of the public Traefik; the traefik-public stack must be deployed first.
  public_trek_network:
    name: public-trek
    external: true
