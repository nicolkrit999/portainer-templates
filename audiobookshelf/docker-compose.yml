services:
  audiobookshelf:
    container_name: audiobookshelf
    image: advplyr/audiobookshelf
    mem_limit: 2g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    volumes:
      - ${DOCKER_CONFIG_DIR}/audiobookshelf:/config:rw
      - ${DOCKER_DATA_DIR}/audiobookshelf/audiobooks:/audiobooks:rw
      - ${DOCKER_DATA_DIR}/audiobookshelf/podcasts:/podcasts:rw
      - ${DOCKER_CONFIG_DIR}/audiobookshelf/metadata:/metadata:rw
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.audiobookshelf.rule: "Host(`${AUDIOBOOKSHELF_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.audiobookshelf.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.audiobookshelf.tls: "true"
      traefik.http.routers.audiobookshelf.service: "audiobookshelf"
      traefik.http.routers.audiobookshelf.middlewares: "hsts-headers@docker"
      traefik.http.routers.audiobookshelf-tailnet.rule: "Host(`${AUDIOBOOKSHELF_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.audiobookshelf-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.audiobookshelf-tailnet.tls: "true"
      traefik.http.routers.audiobookshelf-tailnet.service: "audiobookshelf"
      traefik.http.routers.audiobookshelf-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.audiobookshelf.loadbalancer.server.port: "80"
      traefik.docker.network: "traefik-proxy"

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
