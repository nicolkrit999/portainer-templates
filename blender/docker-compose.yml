services:
  blender:
    image: ghcr.io/linuxserver/blender:latest
    container_name: blender
    hostname: blender
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.000.0.1 8082 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      - ${DOCKER_CONFIG_DIR}/blender:/config:rw
      - ${DOCKER_DATA_DIR}/blender/projects:/projects:rw
    environment:
      TZ: "${TZ}"
      CUSTOM_USER: "${ADMIN_USER}"
      PASSWORD: "${PASSWORD}"
      PUID: "${PUID}"
      PGID: "${PGID}"
      TITLE: Blender
      FILE_MANAGER_PATH: /projects
      WEBPUI_PORT: 8082
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.blender.rule: "Host(`${BLENDER_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.blender.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.blender.tls: "true"
      traefik.http.routers.blender.service: "blender"
      traefik.http.routers.blender.middlewares: "hsts-headers@docker"
      traefik.http.services.blender.loadbalancer.server.port: "8082"
      traefik.docker.network: "traefik-proxy"

    networks:
      - cloudflare_web_network
      - traefik_proxy_network

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
