services:
  bytestash:
    image: ghcr.io/jordan-dalby/bytestash:1.6.1
    container_name: bytestash
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      - ${DOCKER_CONFIG_DIR}/bytestash:/data/snippets:rw
    environment:
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      TOKEN_EXPIRY: "24h"
      ALLOW_NEW_ACCOUNTS: "false"
      DEBUG: "false"
      TZ: "${TZ}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    labels:
      traefik.enable: "true"
      traefik.http.routers.bytestash.rule: "Host(`${BYTESTASH_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.bytestash.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.bytestash.tls: "true"
      traefik.http.routers.bytestash.service: "bytestash"
      traefik.http.routers.bytestash.middlewares: "hsts-headers@docker"
      traefik.http.routers.bytestash-tailnet.rule: "Host(`${BYTESTASH_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.bytestash-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.bytestash-tailnet.tls: "true"
      traefik.http.routers.bytestash-tailnet.service: "bytestash"
      traefik.http.routers.bytestash-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.bytestash.loadbalancer.server.port: "5000"
      traefik.docker.network: "traefik-proxy"
    networks:
      - traefik_proxy_network
      - public_bytestash_network

networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
  public_bytestash_network:
    name: public-bytestash
    external: true
