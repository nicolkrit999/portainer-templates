services:
  fix-permissions:
    image: alpine:latest
    container_name: Vikunja-DB-init
    user: root
    restart: "no"
    volumes:
      - ${DOCKER_CONFIG_DIR}/vikunja/db:/fix/db
    command: "chown -R 999:10 /fix/db && chmod 770 /fix/db && if [ -d /fix/db/18 ]; then chown -R 999:999 /fix/db/18 && chmod 700 /fix/db/18; fi && echo done"

  db:
    image: postgres:18
    container_name: Vikunja-DB
    hostname: vikunja-db
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      POSTGRES_DB: vikunja
      POSTGRES_USER: vikunjauser
      POSTGRES_PASSWORD: vikunjapass
    volumes:
      - ${DOCKER_CONFIG_DIR}/vikunja/db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d vikunja -U vikunjauser"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      fix-permissions:
        condition: service_completed_successfully

  vikunja:
    image: vikunja/vikunja:latest
    container_name: Vikunja
    hostname: vikunja
    security_opt:
      - no-new-privileges:true
    user: "${PUID}:${PGID}"
    restart: always
    ports:
      - 3456:3456
    environment:
      VIKUNJA_MAILER_ENABLED: "true"
      VIKUNJA_MAILER_HOST: "${VIKUNJA_MAILER_HOST}"
      VIKUNJA_MAILER_PORT: "${VIKUNJA_MAILER_PORT}"
      VIKUNJA_MAILER_SKIPTLSVERIFY: "false"
      VIKUNJA_MAILER_AUTHTYPE: login
      VIKUNJA_MAILER_USERNAME: ${VIKUNJA_MAILER_USERNAME}
      VIKUNJA_MAILER_PASSWORD: ${VIKUNJA_MAILER_PASSWORD}
      VIKUNJA_MAILER_FROMEMAIL: ${VIKUNJA_MAILER_FROMEMAIL}
      VIKUNJA_DATABASE_HOST: vikunja-db
      VIKUNJA_DATABASE_PASSWORD: vikunjapass
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_USER: vikunjauser
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_SERVICE_JWTSECRET: ${VIKUNJA_SERVICE_JWTSECRET}
      VIKUNJA_SERVICE_TIMEZONE: ${TZ}
      VIKUNJA_SERVICE_PUBLICURL: ${VIKUNJA_SERVICE_PUBLICURL}
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
      HOME: /app/vikunja/files
    volumes:
      - ${DOCKER_CONFIG_DIR}/vikunja/files:/app/vikunja/files:rw
    networks:
      - default
      - cloudflare_web_network
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.vikunja.rule: "Host(`${VIKUNJA_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.vikunja.entrypoints: "${TRAEFIK_ENTRYPOINT_1}"
      traefik.http.routers.vikunja.tls: "true"
      traefik.http.routers.vikunja.service: "vikunja"
      traefik.http.routers.vikunja.middlewares: "hsts-headers@docker"
      traefik.http.services.vikunja.loadbalancer.server.port: "3456"
      traefik.http.routers.vikunja-private.rule: "Host(`${VIKUNJA_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.vikunja-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.vikunja-private.tls: "true"
      traefik.http.routers.vikunja-private.tls.certresolver: "cf_dns"
      # SAN-bundle (group "household-travel", anchor router): this router is
      # the anchor for a single multi-SAN Let's Encrypt certificate covering
      # 10 household/travel services, to stay under LE's 50-certs/168h rate
      # limit that Traefik previously hit issuing near-one cert per router.
      # Mechanism is per-router tls.domains labels (the correct approach) -
      # NOT resolver-level CLI flags on Traefik's own container/config,
      # which crashed Traefik once already ("field not found, node:
      # domains") and was reverted. Once this router obtains the cert,
      # every other router below is covered automatically via the SAN
      # list - those routers need no label changes at all.
      # This anchor bundles: vikunja (this host, promemoria), grocy,
      # homebox, homehub (casa), mealie (ricette), sparkyfitness,
      # easy-appointments (appuntamenti + its phpmyadmin/swagger-ui/baikal
      # sub-services, added 2026-08-23 once those got their own Traefik
      # routers), home-assistant, surmai (viaggi), trek.
      traefik.http.routers.vikunja-private.tls.domains[0].main: "${VIKUNJA_SUBDOMAIN}.${DOMAIN}"
      traefik.http.routers.vikunja-private.tls.domains[0].sans: "${GROCY_SUBDOMAIN}.${DOMAIN},${HOMEBOX_SUBDOMAIN}.${DOMAIN},${HOMEHUB_SUBDOMAIN}.${DOMAIN},${MEALIE_SUBDOMAIN}.${DOMAIN},${SPARKYFITNESS_SUBDOMAIN}.${DOMAIN},${EASY_APPOINTMENTS_SUBDOMAIN}.${DOMAIN},${HOME_ASSISTANT_SUBDOMAIN}.${DOMAIN},${SURMAI_SUBDOMAIN}.${DOMAIN},${TREK_SUBDOMAIN}.${DOMAIN},${EASY_APPOINTMENTS_PMA_SUBDOMAIN}.${DOMAIN},${EASY_APPOINTMENTS_SWAGGER_SUBDOMAIN}.${DOMAIN},${EASY_APPOINTMENTS_BAIKAL_SUBDOMAIN}.${DOMAIN}"
      traefik.http.routers.vikunja-private.service: "vikunja-private"
      traefik.http.routers.vikunja-private.middlewares: "hsts-headers@docker"
      traefik.http.services.vikunja-private.loadbalancer.server.port: "3456"
      traefik.docker.network: "traefik-proxy"
    depends_on:
      - db

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
