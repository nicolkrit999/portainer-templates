services:
  privatebin:
    image: privatebin/nginx-fpm-alpine:2.1.0
    container_name: privatebin
    restart: unless-stopped
    user: "${PUID}:${PGID}"

    volumes:
      # Portainer runs compose inside its own container, so a relative ./conf.php resolves to a
      # path the Docker daemon does not have; Docker then creates an empty directory there and
      # PrivateBin answers 500. This is the git checkout's real host path.
      - "${DOCKER_CONFIG_DIR}/portainer/compose/${PORTAINER_STACK_ID:?set PORTAINER_STACK_ID}/privatebin/conf.php:/srv/cfg/conf.php:ro"

      - ${DOCKER_CONFIG_DIR}/privatebin/data:/srv/data

      # Scratch space for nginx request-body buffering and PHP temp files.
      - ${DOCKER_CONFIG_DIR}/privatebin/tmp:/tmp
      - ${DOCKER_CONFIG_DIR}/privatebin/tmp:/var/lib/nginx/tmp

    # The image copies its s6 service definitions into /run on every start and the copy merges
    # into whatever is already there, so /run must start empty: a persistent /run kept a removed
    # php-fpm service alive across an image upgrade. exec is required, s6 runs the scripts from here.
    tmpfs:
      - "/run:exec,uid=${PUID},gid=${PGID},mode=0755,size=16m"

    ports:
      - "127.0.0.1:${PRIVATEBIN_HOST_PORT}:8080"

    networks:
      - traefik_proxy_network
      - public_privatebin_network

    labels:
      traefik.enable: "true"
      traefik.http.routers.privatebin.rule: "Host(`${PRIVATEBIN_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.privatebin.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.privatebin.tls: "true"
      traefik.http.routers.privatebin.service: "privatebin"
      traefik.http.routers.privatebin.middlewares: "hsts-headers@docker"
      traefik.http.routers.privatebin-tailnet.rule: "Host(`${PRIVATEBIN_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.privatebin-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.privatebin-tailnet.tls: "true"
      traefik.http.routers.privatebin-tailnet.service: "privatebin"
      traefik.http.routers.privatebin-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.privatebin.loadbalancer.server.port: "8080"
      traefik.docker.network: "traefik-proxy"

networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
  # Backend network of the public Traefik; the traefik-public stack must be deployed first.
  public_privatebin_network:
    name: public-privatebin
    external: true
