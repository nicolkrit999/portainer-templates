services:
  privatebin:
    image: privatebin/nginx-fpm-alpine
    container_name: privatebin
    restart: unless-stopped
    user: "${PUID}:${PGID}"

    environment:
      - PHP_POST_MAX_SIZE=10G
      - PHP_UPLOAD_MAX_FILESIZE=10G

    volumes:
      - ${DOCKER_CONFIG_DIR}/privatebin/conf.php:/srv/cfg/conf.php:ro

      - ${DOCKER_CONFIG_DIR}/privatebin/data:/srv/data

      - ${DOCKER_CONFIG_DIR}/privatebin/tmp:/tmp
      - ${DOCKER_CONFIG_DIR}/privatebin/tmp:/var/lib/nginx/tmp
      - ${DOCKER_CONFIG_DIR}/privatebin/tmp:/run

    ports:
      - "127.0.0.1:${PRIVATEBIN_HOST_PORT}:8080"

    networks:
      - cloudflare_web_network
      - traefik_proxy_network

    labels:
      traefik.enable: "true"
      traefik.http.routers.privatebin.rule: "Host(`${PRIVATEBIN_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.privatebin.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.privatebin.tls: "true"
      traefik.http.routers.privatebin.service: "privatebin"
      traefik.http.routers.privatebin.middlewares: "hsts-headers@docker"
      traefik.http.routers.privatebin-tailnet.rule: "Host(`${PRIVATEBIN_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.privatebin-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.privatebin-tailnet.tls: "true"
      traefik.http.routers.privatebin-tailnet.service: "privatebin"
      traefik.http.routers.privatebin-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.privatebin.loadbalancer.server.port: "8080"
      traefik.docker.network: "traefik-proxy"

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
