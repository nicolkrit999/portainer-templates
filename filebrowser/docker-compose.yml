services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    user: "0:0"
    expose:
      - "80"
    volumes:
      - ${DOCKER_CONFIG_DIR}/filebrowser/database:/database
      - ${DOCKER_CONFIG_DIR}/filebrowser/config:/config
      - /:/srv
    command: --database /database/filebrowser.db --root /srv --port 80
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.filebrowser.rule: "Host(`${FILEBROWSER_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.filebrowser.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.filebrowser.tls: "true"
      traefik.http.routers.filebrowser.service: "filebrowser"
      traefik.http.routers.filebrowser.middlewares: "hsts-headers@docker"
      traefik.http.routers.filebrowser-tailnet.rule: "Host(`${FILEBROWSER_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.filebrowser-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.filebrowser-tailnet.tls: "true"
      traefik.http.routers.filebrowser-tailnet.service: "filebrowser"
      traefik.http.routers.filebrowser-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.filebrowser.loadbalancer.server.port: "80"
      traefik.docker.network: "traefik-proxy"

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
