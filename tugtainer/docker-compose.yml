services:
  app:
    container_name: tugtainer
    image: quenary/tugtainer:latest
    environment:
      - PGID=121 # docker id, needed to allow update
      - PUID=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_DIR}/tugtainer/app:/tugtainer
    restart: unless-stopped
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.tugtainer.rule: "Host(`${TUGTAINER_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.tugtainer.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.tugtainer.tls: "true"
      traefik.http.routers.tugtainer.tls.certresolver: "cf_dns"
      traefik.http.routers.tugtainer.service: "tugtainer"
      traefik.http.routers.tugtainer.middlewares: "hsts-headers@docker"
      traefik.http.services.tugtainer.loadbalancer.server.port: "80"
      traefik.docker.network: "traefik-proxy"

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
