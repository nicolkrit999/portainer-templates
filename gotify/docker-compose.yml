services:
  gotify-init:
    image: alpine:3.24
    container_name: gotify-init
    user: "0:0"
    command: sh -c "chown -R ${PUID}:${PGID} /app/data && chmod -R 750 /app/data"
    volumes:
      - ${DOCKER_DATA_DIR}/gotify/data:/app/data
    restart: "no"
    network_mode: none

  server:
    container_name: gotify
    image: gotify/server
    user: "${PUID}:${PGID}"
    restart: always
    environment:
      - TZ=${TZ}
      - GOTIFY_SERVER_PORT=80
      - GOTIFY_SERVER_LISTENADDR=0.0.0.0
    volumes:
      - ${DOCKER_DATA_DIR}/gotify/data:/app/data
    networks:
      - gotify_notify_network
      - traefik_proxy_network

    labels:
      traefik.enable: "true"
      traefik.http.routers.gotify.rule: "Host(`${GOTIFY_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.gotify.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.gotify.tls: "true"
      traefik.http.routers.gotify.service: "gotify"
      traefik.http.routers.gotify.middlewares: "hsts-headers@docker"
      traefik.http.routers.gotify-tailnet.rule: "Host(`${GOTIFY_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.gotify-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.gotify-tailnet.tls: "true"
      traefik.http.routers.gotify-tailnet.service: "gotify"
      traefik.http.routers.gotify-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.gotify.loadbalancer.server.port: "80"
      traefik.docker.network: "traefik-proxy"

    depends_on:
      gotify-init:
        condition: service_completed_successfully


networks:
  gotify_notify_network:
    name: gotify-notify
    ipam:
      config:
        - subnet: "${GOTIFY_NOTIFY_SUBNET:-172.16.101.0/28}"
          gateway: "${GOTIFY_NOTIFY_GATEWAY:-172.16.101.1}"
          ip_range: "${GOTIFY_NOTIFY_IP_RANGE:-172.16.101.8/29}"
  traefik_proxy_network:
    name: traefik-proxy
    external: true
