services:
  db:
    image: postgres:17
    container_name: Linkwarden-DB
    hostname: linkwarden-db
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "linkwarden", "-U", "linkwardenuser"]
      timeout: 45s
      interval: 10s
      retries: 10
    volumes:
      - ${DOCKER_CONFIG_DIR}/linkwarden/db:/var/lib/postgresql/data:rw
    environment:
      POSTGRES_DB: "linkwarden"
      POSTGRES_USER: "linkwardenuser"
      POSTGRES_PASSWORD: "${LINKWARDEN_DB_PASSWORD:-linkwardenpass}"
      TZ: "${TZ}"
    restart: unless-stopped
    networks:
      - linkwarden_backend_network
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:v2.16.3
    container_name: Linkwarden
    cpu_shares: 2048
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/3000' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    hostname: linkwarden
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${DOCKER_CONFIG_DIR}/linkwarden/data:/data/data:rw
    environment:
      DATABASE_URL: "postgres://linkwardenuser:${LINKWARDEN_DB_PASSWORD:-linkwardenpass}@linkwarden-db:5432/linkwarden"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}"
      NEXTAUTH_URL: "https://${LINKWARDEN_SUBDOMAIN}.${DOMAIN}/api/v1/auth"
      NEXT_PUBLIC_DISABLE_REGISTRATION: "true"
      DISABLE_NEW_SSO_USERS: "true"
      TZ: "${TZ}"
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      traefik.enable: "true"
      traefik.http.routers.linkwarden.rule: "Host(`${LINKWARDEN_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.linkwarden.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.linkwarden.tls: "true"
      traefik.http.routers.linkwarden.tls.certresolver: "cf_dns"
      # SAN-bundle (group "productivity-creative", anchor router): this router
      # is the anchor for a single multi-SAN Let's Encrypt certificate
      # covering 12 other low-traffic services, to stay under LE's 50-certs/168h
      # rate limit that Traefik previously hit issuing near-one cert per
      # router. Mechanism is per-router tls.domains labels (the correct
      # approach) - NOT resolver-level CLI flags on Traefik's own
      # container/config, which crashed Traefik once already
      # ("field not found, node: domains") and was reverted.
      # Once this router obtains the cert, every other router below is
      # covered automatically via the SAN list - those routers need no label
      # changes at all.
      # Bundled hostnames (this anchor + 12 others): linkwarden (this host),
      # affine, draw-io, excalidraw, fossflow, opennotebook + its own
      # opennotebook-api sub-service (added 2026-08-24, port 5055 on the
      # same container, previously had no Traefik router at all), paperlessngx
      # (rule label uses PAPERLESS_SUBDOMAIN), holyclaude (env var name is
      # HOLYCLAUDE_SUBDOMAIN, but the real live hostname is "claude", NOT
      # "holyclaude" - confirmed against the live Portainer env), blender,
      # lifeglance, ghost (rule label uses GHOST_SUBDOMAIN, default "blog"),
      # hi-events (rule label uses HI_EVENTS_SUBDOMAIN, default "eventi" -
      # NOT "hi-events", added 2026-08-24).
      traefik.http.routers.linkwarden.tls.domains[0].main: "${LINKWARDEN_SUBDOMAIN}.${DOMAIN}"
      traefik.http.routers.linkwarden.tls.domains[0].sans: "${AFFINE_SUBDOMAIN}.${DOMAIN},${DRAWIO_SUBDOMAIN}.${DOMAIN},${EXCALIDRAW_SUBDOMAIN}.${DOMAIN},${FOSSFLOW_SUBDOMAIN}.${DOMAIN},${OPENNOTEBOOK_SUBDOMAIN}.${DOMAIN},${OPENNOTEBOOK_API_SUBDOMAIN}.${DOMAIN},${PAPERLESS_SUBDOMAIN}.${DOMAIN},${HOLYCLAUDE_SUBDOMAIN}.${DOMAIN},${BLENDER_SUBDOMAIN}.${DOMAIN},${LIFEGLANCE_SUBDOMAIN}.${DOMAIN},${GHOST_SUBDOMAIN}.${DOMAIN},${HI_EVENTS_SUBDOMAIN}.${DOMAIN}"
      traefik.http.routers.linkwarden.service: "linkwarden"
      traefik.http.routers.linkwarden.middlewares: "hsts-headers@docker"
      traefik.http.routers.linkwarden-tailnet.rule: "Host(`${LINKWARDEN_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.linkwarden-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.linkwarden-tailnet.tls: "true"
      traefik.http.routers.linkwarden-tailnet.service: "linkwarden"
      traefik.http.routers.linkwarden-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.linkwarden.loadbalancer.server.port: "3000"
      traefik.docker.network: "traefik-proxy"
    networks:
      - traefik_proxy_network
      - public_linkwarden_network
      - linkwarden_backend_network
    depends_on:
      db:
        condition: service_healthy

networks:
  linkwarden_backend_network:
    name: linkwarden-backend
    internal: true
    ipam:
      config:
        - subnet: "${LINKWARDEN_BACKEND_SUBNET:-172.16.91.16/28}"
  traefik_proxy_network:
    name: traefik-proxy
    external: true
  public_linkwarden_network:
    name: public-linkwarden
    external: true
