services:
  grocy:
    image: lscr.io/linuxserver/grocy:latest
    container_name: grocy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_DIR}/grocy/config:/config
    restart: unless-stopped
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.grocy.rule: "Host(`${GROCY_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.grocy.entrypoints: "${TRAEFIK_ENTRYPOINT_1}"
      traefik.http.routers.grocy.tls: "true"
      traefik.http.routers.grocy.tls.certresolver: "cf_dns"
      traefik.http.routers.grocy.service: "grocy"
      traefik.http.routers.grocy.middlewares: "hsts-headers@docker"
      traefik.http.services.grocy.loadbalancer.server.port: "80"
      # --- SAN-bundled ACME certificate (group "household-travel") ---
      # Part of a 6-group SAN-bundle rollout to stay under Let's Encrypt's
      # weekly rate limit (50 certs/168h per domain), which this repo hit
      # from requesting a near-separate certificate per Traefik router
      # across ~77 hostnames. This is the CORRECT mechanism: per-router
      # `tls.domains` labels on one anchor router per group. Traefik's cert
      # store is keyed globally by hostname, so every other router whose
      # hostname is listed in `tls.domains[0].sans` below automatically
      # reuses this one cert once it's issued - those routers need zero
      # label changes. Do NOT use resolver-level CLI flags on Traefik's own
      # container/config (e.g. `--certificatesresolvers.cf_dns.acme.domains`)
      # - that syntax crashed Traefik once already on this instance
      # ("field not found, node: domains") and was reverted.
      # This anchor bundles: grocy (this host), homebox, homehub (casa),
      # mealie (ricette), sparkyfitness, vikunja (promemoria),
      # easy-appointments (appuntamenti), home-assistant, surmai (viaggi),
      # trek.
      traefik.http.routers.grocy.tls.domains[0].main: "${GROCY_SUBDOMAIN}.${DOMAIN}"
      traefik.http.routers.grocy.tls.domains[0].sans: "${HOMEBOX_SUBDOMAIN}.${DOMAIN},${HOMEHUB_SUBDOMAIN}.${DOMAIN},${MEALIE_SUBDOMAIN}.${DOMAIN},${SPARKYFITNESS_SUBDOMAIN}.${DOMAIN},${VIKUNJA_SUBDOMAIN}.${DOMAIN},${EASY_APPOINTMENTS_SUBDOMAIN}.${DOMAIN},${HOME_ASSISTANT_SUBDOMAIN}.${DOMAIN},${SURMAI_SUBDOMAIN}.${DOMAIN},${TREK_SUBDOMAIN}.${DOMAIN}"
      traefik.http.routers.grocy-private.rule: "Host(`${GROCY_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.grocy-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.grocy-private.tls: "true"
      traefik.http.routers.grocy-private.service: "grocy-private"
      traefik.http.routers.grocy-private.middlewares: "hsts-headers@docker"
      traefik.http.services.grocy-private.loadbalancer.server.port: "80"
      traefik.docker.network: "traefik-proxy"

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
