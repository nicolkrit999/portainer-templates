services:
  lifeglance:
    image: ghcr.io/krelltunez/lifeglance:latest
    container_name: lifeglance
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      TZ: "${TZ}"
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.lifeglance.rule: "Host(`${LIFEGLANCE_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.lifeglance.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.lifeglance.tls: "true"
      traefik.http.routers.lifeglance.tls.certresolver: "cf_dns"
      traefik.http.routers.lifeglance.service: "lifeglance"
      traefik.http.services.lifeglance.loadbalancer.server.port: "80"
      traefik.docker.network: "traefik-proxy"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
