          gateway: "${PUBLIC_EASY_APPOINTMENTS_GATEWAY:-172.16.88.1}"
          ip_range: "${PUBLIC_EASY_APPOINTMENTS_IP_RANGE:-172.16.88.8/29}"
  public_trek_network:
