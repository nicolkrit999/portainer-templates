# Internet-facing Traefik: UniFi forwards WAN TCP 443 to this container's own macvlan IP.
# Deliberately NOT attached to cloudflare-web and no cloudflared handoff: this stack exists
# to bypass the Cloudflare Tunnel. Do not add the usual Cloudflare network block.
# No `ports:` (macvlan has its own IP) and no labels (file provider only, no Docker provider).
services:
  # Writes dynamic.yml from this file's env on every deploy; never hand-edit it. The quoted
  # heredoc delimiter keeps the shell away from the backticks in the router rules. Root needs
  # DAC_OVERRIDE to write into a directory owned by another uid, FOWNER/CHOWN for acme.json.
  traefik-public-init:
    image: alpine:3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    container_name: traefik-public-init
    user: root
    restart: "no"
    network_mode: "none"
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    volumes:
      - "${VOLUME_CONFIG:?set VOLUME_CONFIG}/traefik-public:/target"
    command:
      - "sh"
      - "-c"
      - "set -eu\nmkdir -p /target/dynamic\ntouch /target/acme.json\nchmod 600 /target/acme.json\nchown 65532:65532 /target/acme.json\ncat > /target/.dynamic.yml.tmp << 'EOF'\n# Generated by traefik-public-init from docker-compose.yml on every deploy. Do not edit.\nhttp:\n  routers:\n    public-test:\n      rule: 'Host(`${PUBLIC_TEST_SUBDOMAIN:?set PUBLIC_TEST_SUBDOMAIN}.${DOMAIN:?set DOMAIN}`)'\n      entryPoints:\n        - websecure\n      middlewares:\n        - public-secure-headers\n      service: immich\n      tls:\n        certResolver: cf_dns_public\n    immich:\n      rule: 'Host(`${IMMICH_SUBDOMAIN:?set IMMICH_SUBDOMAIN}.${DOMAIN:?set DOMAIN}`)'\n      entryPoints:\n        - websecure\n      middlewares:\n        - public-secure-headers\n      service: immich\n      tls:\n        certResolver: cf_dns_public\n  services:\n    immich:\n      loadBalancer:\n        servers:\n          - url: 'http://immich_server:2283'\n  middlewares:\n    public-secure-headers:\n      headers:\n        stsSeconds: 31536000\n        stsIncludeSubdomains: true\n        stsPreload: true\n        forceSTSHeader: true\n        contentTypeNosniff: true\n        frameDeny: true\n        referrerPolicy: same-origin\ntls:\n  options:\n    default:\n      minVersion: VersionTLS12\n      sniStrict: true\n      cipherSuites:\n        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384\n        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384\n        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305\n        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305\n        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256\n        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256\nEOF\nchmod 644 /target/.dynamic.yml.tmp\nmv /target/.dynamic.yml.tmp /target/dynamic/dynamic.yml\ncat /target/dynamic/dynamic.yml"

  traefik-public:
    image: traefik:v3.7.17
    container_name: traefik-public
    restart: unless-stopped
    cpu_shares: 2048
    cpus: 2.0
    mem_limit: 512m
    pids_limit: 512
    oom_score_adj: 500
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Dedicated unprivileged identity (not PUID/PGID); must match the chown in the init
    # service. Port 443 binds without root or capabilities through the sysctl below.
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    # The LAN resolvers wildcard-override the whole domain to the NAS; ACME lookups must not see that.
    dns:
      - "1.1.1.1"
      - "9.9.9.9"
    command:
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
      # Strips request headers with aliasing names (X_Foo, X.Foo) that could spoof managed headers.
      - "--global.aliasHeadersStrategy=delete"
      - "--log.level=INFO"
      # Headers are dropped by default (no Authorization, Cookie or API key in the log), only
      # User-Agent is kept. Query strings are dropped. The path is kept on purpose and includes
      # Immich share keys (/share/<key>), so treat this log as sensitive.
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.fields.headers.defaultmode=drop"
      - "--accesslog.fields.headers.names.User-Agent=keep"
      - "--accesslog.fields.queryparameters.defaultmode=drop"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entryPoints.websecure.address=:443"
      # Finite on purpose: a stalled connection is bounded to this budget (0s removes the
      # bound). Not a per-source limit; see the README's planned hardening.
      - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=3600s"
      - "--entryPoints.websecure.transport.respondingTimeouts.writeTimeout=7200s"
      - "--entryPoints.websecure.transport.respondingTimeouts.idleTimeout=180s"
      - "--entryPoints.websecure.http.tls.certResolver=cf_dns_public"
      # Loopback only: macvlan exposes every listening port on the LAN IP.
      - "--ping=true"
      - "--ping.entryPoint=ping"
      - "--entryPoints.ping.address=127.0.0.1:8082"
      - "--certificatesResolvers.cf_dns_public.acme.email=${ACME_EMAIL:?set ACME_EMAIL}"
      - "--certificatesResolvers.cf_dns_public.acme.storage=/letsencrypt/acme.json"
      - "--certificatesResolvers.cf_dns_public.acme.keyType=EC256"
      - "--certificatesResolvers.cf_dns_public.acme.dnsChallenge.provider=cloudflare"
      - "--certificatesResolvers.cf_dns_public.acme.dnsChallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
    environment:
      TZ: "${TZ}"
      CF_DNS_API_TOKEN: "${CF_DNS_API_TOKEN_PUBLIC:?set CF_DNS_API_TOKEN_PUBLIC}"
    volumes:
      - "${VOLUME_CONFIG:?set VOLUME_CONFIG}/traefik-public/acme.json:/letsencrypt/acme.json"
      - "${VOLUME_CONFIG:?set VOLUME_CONFIG}/traefik-public/dynamic:/etc/traefik/dynamic:ro"
    networks:
      traefik_public_net:
        ipv4_address: "${TRAEFIK_PUBLIC_IP:?set TRAEFIK_PUBLIC_IP}"
      public_apps_network:
    depends_on:
      traefik-public-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entryPoint=ping", "--entryPoints.ping.address=127.0.0.1:8082"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # The one existing macvlan network, created by traefik-private-forwarder; never define a second.
  traefik_public_net:
    external: true
    name: traefik-private-forwarder_traefik_forwarder_net
  # internal: true removes this network's default route and egress, so the macvlan is the only way out.
  public_apps_network:
    name: public-apps
    internal: true
