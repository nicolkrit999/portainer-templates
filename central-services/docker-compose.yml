services:
  mailpit:
    image: 'axllent/mailpit:v1.7'
    hostname: mailpit
    ports:
      - "8025:8025"  # Mailpit UI
      - "1025:1025"  # Mailpit SMTP
    labels:
      traefik.enable: "true"
      traefik.http.routers.mailpit.rule: "Host(`${MAILPIT_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.mailpit.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.mailpit.tls: "true"
      # SAN-bundle group "infra-ops" member - NO certresolver here, this
      # router picks up the anchor's (glances) bundled cert automatically
      # via SNI. A stray certresolver here was found 2026-08-23 racing the
      # anchor's request - see .claude/rules/san-cert-groups.md rule 3.
      traefik.http.routers.mailpit.service: "mailpit"
      traefik.http.routers.mailpit.middlewares: "hsts-headers@docker"
      traefik.http.routers.mailpit-tailnet.rule: "Host(`${MAILPIT_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.mailpit-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.mailpit-tailnet.tls: "true"
      traefik.http.routers.mailpit-tailnet.service: "mailpit"
      traefik.http.routers.mailpit-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.mailpit.loadbalancer.server.port: "8025"
      traefik.docker.network: "traefik-proxy"
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8025/api/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  openldap:
    image: osixia/openldap:1.5.0
    hostname: openldap
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ${DOCKER_CONFIG_DIR}/central-services/openldap/certificates:/container/service/slapd/assets/certs
      - ${DOCKER_CONFIG_DIR}/central-services/openldap/slapd/database:/var/lib/ldap
      - ${DOCKER_CONFIG_DIR}/central-services/openldap/slapd/config:/etc/ldap/slapd.d
    environment:
      - LDAP_ORGANISATION=${LDAP_ORGANISATION}
      - LDAP_DOMAIN=${LDAP_DOMAIN}
      - LDAP_ADMIN_USERNAME=${LDAP_ADMIN_USERNAME}
      - LDAP_ADMIN_PASSWORD=${LDAP_ADMIN_PASSWORD}
      - LDAP_CONFIG_PASSWORD=${LDAP_CONFIG_PASSWORD}
      - LDAP_BASE_DN=${LDAP_BASE_DN}
      - LDAP_READONLY_USER=${LDAP_READONLY_USER_ENABLED}
      - LDAP_READONLY_USER_USERNAME=${LDAP_READONLY_USER_USERNAME}
      - LDAP_READONLY_USER_PASSWORD=${LDAP_READONLY_USER_PASSWORD}
    networks:
      - cloudflare_web_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b \"${LDAP_BASE_DN}\" -D \"cn=admin,${LDAP_BASE_DN}\" -w \"${LDAP_ADMIN_PASSWORD}\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: phpldapadmin
    hostname: phpldapadmin
    ports:
      - "8201:80"
    volumes:
      - ${DOCKER_CONFIG_DIR}/central-services/phpldapadmin:/var/www/phpldapadmin
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=openldap
      - PHPLDAPADMIN_HTTPS=false
    depends_on:
      - openldap
    labels:
      traefik.enable: "true"
      traefik.http.routers.phpldapadmin.rule: "Host(`${PHPLDAPADMIN_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.phpldapadmin.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.phpldapadmin.tls: "true"
      # SAN-bundle group "infra-ops" member - NO certresolver here, this
      # router picks up the anchor's (glances) bundled cert automatically
      # via SNI. A stray certresolver here was found 2026-08-23 racing the
      # anchor's request - see .claude/rules/san-cert-groups.md rule 3.
      traefik.http.routers.phpldapadmin.service: "phpldapadmin"
      traefik.http.routers.phpldapadmin.middlewares: "hsts-headers@docker"
      traefik.http.routers.phpldapadmin-tailnet.rule: "Host(`${PHPLDAPADMIN_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.phpldapadmin-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.phpldapadmin-tailnet.tls: "true"
      traefik.http.routers.phpldapadmin-tailnet.service: "phpldapadmin"
      traefik.http.routers.phpldapadmin-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.phpldapadmin.loadbalancer.server.port: "80"
      traefik.docker.network: "traefik-proxy"
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
