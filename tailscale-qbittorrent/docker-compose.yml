services:
  # Dedicated Tailscale identity for qbittorrent, routing all of its
  # torrent traffic through a Mullvad exit node. Replaces qbittorrent's
  # previous network_mode: host setup - qbittorrent now joins this
  # container's network namespace (network_mode: service:) instead, and
  # both the Traefik private/tailnet-admin routers and the Cloudflare
  # Tunnel reach it by this container's name. See
  # .claude/rules/core-infra-topology.md and ../tailscale-adguard/ for the
  # sibling dedicated-identity pattern this mirrors (structure only - no
  # DNS-relay machinery here, that was AdGuard-specific).
  tailscale-qbittorrent:
    image: tailscale/tailscale:latest
    container_name: tailscale-qbittorrent
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: "${TS_AUTHKEY_QBITTORRENT}"
      TS_STATE_DIR: "/var/lib/tailscale"
      TS_USERSPACE: "false"
      TS_HOSTNAME: "${TS_HOSTNAME_QBITTORRENT}"
      # Static Mullvad exit-node choice (Spain/Barcelona, deliberately not
      # Switzerland - traffic-correlation reasons) - no rotation.
      # MULLVAD_EXIT_NODE must be a Tailscale IP, not a .ts.net hostname -
      # on first boot, `tailscale up --exit-node=<hostname>` fails
      # (hostname resolution needs the tailnet connection it's still
      # establishing). See .env.example for the full explanation.
      # --accept-dns=true is Tailscale's own default already, but is kept
      # explicit here deliberately: no downside if it's redundant, and
      # it's already in place if a future tailnet-wide default ever
      # changes.
      # --exit-node-allow-lan-access=true is required because Traefik (a
      # different container on this same Docker host, on the
      # 172.27.0.0/16 / 192.168.48.0/20 private ranges) must still reach
      # this container over the local Docker network even while its own
      # outbound traffic exits via the Mullvad exit node - by default the
      # exit-node client firewall only allows loopback (127.0.0.0/8) and
      # silently drops all other local/LAN-range traffic, which would cut
      # Traefik off from qbittorrent's WebUI.
      TS_EXTRA_ARGS: "--exit-node=${MULLVAD_EXIT_NODE} --accept-dns=true --exit-node-allow-lan-access=true"
    volumes:
      - ${VOLUME_CONFIG}/tailscale-qbittorrent/state:/var/lib/tailscale
    networks:
      - traefik_proxy_network
      - cloudflare_web_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "status", "--json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  qbittorrent:
    container_name: qbit-torrent-tailscale
    image: ghcr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${WEBUI_PORT}/"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 16g
    cpus: 4.0
    # Reserves core 5 for the rest of the host's workload, keeping
    # qbittorrent's transcoding-adjacent torrent I/O from contending with
    # it under load.
    cpuset: "0-4"
    security_opt:
      - no-new-privileges:true
    network_mode: service:tailscale-qbittorrent
    depends_on:
      tailscale-qbittorrent:
        condition: service_healthy
    tty: true
    volumes:
      - "${VOLUME_CONFIG}/qbit-torrent-tailscale/config:/config:rw"
      - "${VOLUME_DATA}/qbit-torrent-tailscale/downloads:/downloads:rw"
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
      WEBUI_PORT: "${WEBUI_PORT}"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      traefik.enable: "true"
      traefik.http.routers.qbit-torrent-tailscale.rule: "Host(`${QBIT_TORRENT_TAILSCALE_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.qbit-torrent-tailscale.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.qbit-torrent-tailscale.tls: "true"
      traefik.http.routers.qbit-torrent-tailscale.service: "qbit-torrent-tailscale"
      traefik.http.routers.qbit-torrent-tailscale.middlewares: "hsts-headers@docker"
      traefik.http.routers.qbit-torrent-tailscale-tailnet.rule: "Host(`${QBIT_TORRENT_TAILSCALE_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.qbit-torrent-tailscale-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.qbit-torrent-tailscale-tailnet.tls: "true"
      traefik.http.routers.qbit-torrent-tailscale-tailnet.service: "qbit-torrent-tailscale"
      traefik.http.routers.qbit-torrent-tailscale-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.qbit-torrent-tailscale.loadbalancer.server.url: "http://tailscale-qbittorrent:${WEBUI_PORT}"

networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
  cloudflare_web_network:
    name: cloudflare-web
    external: true
