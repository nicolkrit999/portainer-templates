# Reference copy only: Portainer is not a git-tracked stack here (it runs as a standalone
# container created from UGOS's compose UI), so edits to this file do not reach it by themselves.
services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    environment:
      TZ: "${TZ}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${VOLUME_CONFIG}/portainer:/data
    ports:
      - "9000:9000"
      - "9444:9443"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      traefik.enable: "true"
      traefik.http.routers.portainer.rule: "Host(`${PORTAINER_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.portainer.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.portainer.tls: "true"
      traefik.http.routers.portainer.service: "portainer"
      traefik.http.routers.portainer.middlewares: "hsts-headers@docker"
      traefik.http.routers.portainer-tailnet.rule: "Host(`${PORTAINER_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.portainer-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.portainer-tailnet.tls: "true"
      traefik.http.routers.portainer-tailnet.service: "portainer"
      traefik.http.routers.portainer-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.portainer.loadbalancer.server.port: "9000"
      traefik.docker.network: "traefik-proxy"
    networks:
      - traefik_proxy_network

networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
