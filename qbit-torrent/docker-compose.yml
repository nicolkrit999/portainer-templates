# qBittorrent without a VPN (network_mode: host), hostname qbit-torrent.${DOMAIN}.
# The Mullvad-routed variant (tailscale-qbittorrent) was removed on 2026-11-04.
services:
  qbittorrent:
    container_name: qbit-torrent
    image: ghcr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${WEBUI_PORT}/"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 16g
    cpus: 4.0
    # Pinned away from core 5, leaving it reachable by AdGuard's DNS chain
    # under contention. See adguard/INCIDENT-2026-09-08-dns-relay-outage.md.
    cpuset: "0-4"
    security_opt:
      - no-new-privileges:true
    network_mode: host
    tty: true
    volumes:
      - "${VOLUME_CONFIG}/qbit-torrent/config:/config:rw"
      - "${VOLUME_DATA}/qbit-torrent/downloads:/downloads:rw"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${WEBUI_PORT}
    labels:
      traefik.enable: "true"
      traefik.http.routers.qbit-torrent.rule: "Host(`${QBIT_TORRENT_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.qbit-torrent.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.qbit-torrent.tls: "true"
      traefik.http.routers.qbit-torrent.service: "qbit-torrent"
      traefik.http.routers.qbit-torrent.middlewares: "hsts-headers@docker"
      traefik.http.routers.qbit-torrent-tailnet.rule: "Host(`${QBIT_TORRENT_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.qbit-torrent-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.qbit-torrent-tailnet.tls: "true"
      traefik.http.routers.qbit-torrent-tailnet.service: "qbit-torrent"
      traefik.http.routers.qbit-torrent-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.qbit-torrent.loadbalancer.server.url: "http://host.docker.internal:${WEBUI_PORT}"
