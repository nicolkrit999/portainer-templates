# ROLLBACK REFERENCE ONLY - not the live deployment. Restored 2026-09-24
# from the pre-migration commit (network_mode: host, no Mullvad routing)
# after qbittorrent was migrated to ../tailscale-qbittorrent/ (dedicated
# Tailscale sidecar + Mullvad exit-node routing - see that directory for
# the live version and .claude/agent-memory/docker-compose-architect/
# tailscale_qbittorrent_service.md for the full migration record).
#
# Kept here deliberately so a rollback is just "redeploy this stack,
# remove the other one" if the Mullvad setup ever needs to be abandoned -
# the corresponding pre-migration .env values are saved in Proton Pass.
# Do NOT deploy this alongside ../tailscale-qbittorrent/ at the same time -
# both define container_name: qbit-torrent and a Traefik router for the
# same hostname, which collide if both stacks are live simultaneously.
services:
  qbittorrent:
    container_name: qbit-torrent
    image: ghcr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${WEBUI_PORT}/"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 16g
    cpus: 4.0
    # Pinned away from core 5, leaving it reachable by AdGuard's DNS chain
    # under contention. See adguard/INCIDENT-2026-09-08-dns-relay-outage.md.
    cpuset: "0-4"
    security_opt:
      - no-new-privileges:true
    network_mode: host
    tty: true
    volumes:
      - "${DOCKER_CONFIG_DIR}/qbit-torrent/config:/config:rw"
      - "${DOCKER_DATA_DIR}/qbit-torrent/downloads:/downloads:rw"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${WEBUI_PORT}
    labels:
      traefik.enable: "true"
      traefik.http.routers.qbit-torrent.rule: "Host(`${QBIT_TORRENT_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.qbit-torrent.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.qbit-torrent.tls: "true"
      traefik.http.routers.qbit-torrent.service: "qbit-torrent"
      traefik.http.routers.qbit-torrent.middlewares: "hsts-headers@docker"
      traefik.http.routers.qbit-torrent-tailnet.rule: "Host(`${QBIT_TORRENT_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.qbit-torrent-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.qbit-torrent-tailnet.tls: "true"
      traefik.http.routers.qbit-torrent-tailnet.service: "qbit-torrent"
      traefik.http.routers.qbit-torrent-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.qbit-torrent.loadbalancer.server.url: "http://host.docker.internal:${WEBUI_PORT}"
