services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    container_name: opennotebook-surrealdb
    restart: unless-stopped
    user: root
    command: "start --log info --user ${SURREAL_USER} --pass ${SURREAL_PASSWORD} rocksdb:/mydata/mydatabase.db"
    volumes:
      - ${OPENNOTEBOOK_DB_ROOT}/surreal_data:/mydata
      - ${OPENNOTEBOOK_DB_ROOT}/data:/data
      - ${OPENNOTEBOOK_DB_ROOT}/logs:/logs
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--conn", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  open_notebook:
    image: lfnovo/open_notebook:v1-latest
    container_name: opennotebook
    restart: unless-stopped
    environment:
      OPEN_NOTEBOOK_ENCRYPTION_KEY: "${OPEN_NOTEBOOK_ENCRYPTION_KEY}"
      API_URL: "${OPENNOTEBOOK_PUBLIC_URL:-https://${OPENNOTEBOOK_SUBDOMAIN}.${DOMAIN}}"
      SURREAL_URL: "ws://surrealdb:8000/rpc"
      SURREAL_USER: "${SURREAL_USER}"
      SURREAL_PASSWORD: "${SURREAL_PASSWORD}"
      SURREAL_NAMESPACE: "open_notebook"
      SURREAL_DATABASE: "open_notebook"
      TZ: "${TZ:-Europe/Zurich}"
    volumes:
      - ${OPENNOTEBOOK_DATA_ROOT}/notebook_data:/app/data
    depends_on:
      surrealdb:
        condition: service_healthy
    networks:
      - default
      - cloudflare_web_network
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.open_notebook.rule: "Host(`${OPENNOTEBOOK_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.open_notebook.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.open_notebook.tls: "true"
      traefik.http.routers.open_notebook.service: "open_notebook"
      traefik.http.routers.open_notebook.middlewares: "hsts-headers@docker"
      traefik.http.routers.open_notebook-tailnet.rule: "Host(`${OPENNOTEBOOK_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.open_notebook-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.open_notebook-tailnet.tls: "true"
      traefik.http.routers.open_notebook-tailnet.service: "open_notebook"
      traefik.http.routers.open_notebook-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.open_notebook.loadbalancer.server.port: "8502"
      traefik.http.routers.open_notebook-api.rule: "Host(`${OPENNOTEBOOK_API_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.open_notebook-api.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.open_notebook-api.tls: "true"
      traefik.http.routers.open_notebook-api.service: "open_notebook-api"
      traefik.http.routers.open_notebook-api.middlewares: "hsts-headers@docker"
      traefik.http.routers.open_notebook-api-tailnet.rule: "Host(`${OPENNOTEBOOK_API_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.open_notebook-api-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.open_notebook-api-tailnet.tls: "true"
      traefik.http.routers.open_notebook-api-tailnet.service: "open_notebook-api"
      traefik.http.routers.open_notebook-api-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.open_notebook-api.loadbalancer.server.port: "5055"
      traefik.docker.network: "traefik-proxy"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    driver: bridge
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
