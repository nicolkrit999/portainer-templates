services:
  fix-permissions:
    image: alpine:latest
    container_name: Traefik-init
    user: root
    restart: "no"
    volumes:
      - ${VOLUME_CONFIG}/traefik/acme.json:/fix/acme.json
    command: "chown root:root /fix/acme.json && chmod 600 /fix/acme.json && echo done"

  traefik:
    image: traefik:v3.7.11
    container_name: traefik
    restart: always
    command:
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
      # Plain-HTTP entrypoint on the well-known port 80. Redirect-only, never
      # serves real app traffic - without this, Traefik has NO listener on
      # port 80 at all, so any client defaulting to http:// for a bare-typed
      # address (common iOS Safari/Firefox and general browser behavior) gets
      # connection-refused instead of a clean redirect to HTTPS. Confirmed
      # root cause of a "could not connect to server" report, 2026-08-22.
      # Port 80 must stay free for Traefik specifically - infra services
      # (Traefik, dnsmasq, Cloudflare) take precedence over app composes for
      # well-known ports; a conflicting app should move its own port instead
      # (done for easy-appointments' NGINX_PORT, moved to 8180, same day).
      - "--entryPoints.web.address=:80"
      - "--entryPoints.web.http.redirections.entryPoint.to=${TRAEFIK_ENTRYPOINT_1}"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_1}.address=:${TRAEFIK_PORT_1}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_1}.http.tls.certresolver=cf_dns"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_1}.http.tls.domains[0].main=${DOMAIN}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_1}.http.tls.domains[0].sans=*.${DOMAIN}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_2}.address=:${TRAEFIK_PORT_2}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_2}.http.tls.certresolver=cf_dns"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_2}.http.tls.domains[0].main=${DOMAIN}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_2}.http.tls.domains[0].sans=*.${DOMAIN}"
      # TRAEFIK_PORT_3's value (8444) stays a distinct internal-only port -
      # this entrypoint's wildcard bind would otherwise collide with the
      # family entrypoint's own wildcard :443 bind inside this container.
      # Clean, no-port external access to the private tier (443 on its own
      # dedicated IP) is handled entirely by the separate
      # `traefik-private-forwarder` service (a macvlan TCP-passthrough
      # sidecar forwarding to this container's :${TRAEFIK_PORT_3} over the
      # shared traefik-proxy network) - not by anything in this file. Do not
      # "simplify" this entrypoint's own address to 443.
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_3}.address=:${TRAEFIK_PORT_3}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_3}.asDefault=true"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_3}.http.tls.certresolver=cf_dns"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_3}.http.tls.domains[0].main=${DOMAIN}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_3}.http.tls.domains[0].sans=*.${DOMAIN}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_4}.address=:${TRAEFIK_PORT_4}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_4}.http.tls.certresolver=cf_dns"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_4}.http.tls.domains[0].main=${DOMAIN}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_4}.http.tls.domains[0].sans=*.${DOMAIN}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_5}.address=:${TRAEFIK_PORT_5}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_6}.address=:${TRAEFIK_PORT_6}"
      # Internal-only entrypoint dedicated to tailnet-sourced admin traffic,
      # reached exclusively via the traefik-tailnet-forwarder sidecar (see
      # ../traefik-tailnet-forwarder/docker-compose.yml) over the
      # traefik-proxy network at this container's static
      # ${TRAEFIK_INTERNAL_IP}. No `ports:` host publish - same internal-only
      # pattern as entrypoints 5 and 6.
      #
      # proxyProtocol.trustedIPs=${TAILSCALE_ADMIN_INTERNAL_IP}/32 trusts
      # PROXY-protocol headers only from the tailscale-admin sidecar's own
      # static IP on the traefik-proxy network (../tailscale-admin/docker-compose.yml).
      # The tailnet forwarder (../traefik-tailnet-forwarder) no longer runs
      # network_mode: host - that design was reverted after it conflicted
      # with Traefik's own wildcard bind on the family entrypoint in the
      # same host network namespace. It now runs as an ordinary
      # network_mode: container:tailscale-admin sidecar, so its outbound
      # connection to Traefik sources from tailscale-admin's own address on
      # traefik-proxy, not from the bridge gateway. Confirmed live via
      # `docker inspect` before this fix: tailscale-admin's Docker-assigned
      # IP was 172.27.0.49, a dynamic address - it is now pinned static (see
      # that compose file's own ipv4_address) precisely so this trustedIPs
      # value never silently goes stale on a container recreate. This is a
      # DIFFERENT, intentional, PROXY-protocol-verified trust boundary from
      # the original bug (docker-proxy silently rewriting real tailnet
      # client IPs to a Docker gateway address before Traefik ever saw
      # them, defeating the tailnet-admin-only ipallowlist). Here the real
      # client IP is never inferred from the raw TCP source at all - it
      # travels inside the PROXY protocol header injected by haproxy's
      # send-proxy-v2 directive, and Traefik only trusts that header when
      # it arrives from this one known, static sidecar address.
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_7}.address=:${TRAEFIK_PORT_7}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_7}.http.tls.certresolver=cf_dns"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_7}.http.tls.domains[0].main=${DOMAIN}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_7}.http.tls.domains[0].sans=*.${DOMAIN}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_7}.proxyProtocol.trustedIPs=${TAILSCALE_ADMIN_INTERNAL_IP}/32"
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--ping=true"
      - "--ping.entryPoint=${TRAEFIK_ENTRYPOINT_6}"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.watch=true"
      - "--certificatesresolvers.cf_dns.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.cf_dns.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.cf_dns.acme.dnschallenge=true"
      - "--certificatesresolvers.cf_dns.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cf_dns.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--log.level=INFO"
      - "--accesslog=false"
    environment:
      TZ: "${TZ}"
      CF_DNS_API_TOKEN: "${CF_DNS_API_TOKEN}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${VOLUME_CONFIG}/traefik/acme.json:/letsencrypt/acme.json
    ports:
      - "80:80"
      - "${TRAEFIK_PORT_1}:${TRAEFIK_PORT_1}"
      - "${TRAEFIK_PORT_2}:${TRAEFIK_PORT_2}"
      - "${TRAEFIK_PORT_3}:${TRAEFIK_PORT_3}"
      - "${TRAEFIK_PORT_4}:${TRAEFIK_PORT_4}"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      traefik.enable: "true"
      traefik.http.routers.traefik-dashboard.rule: "Host(`traefik.${DOMAIN}`)"
      traefik.http.routers.traefik-dashboard.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.traefik-dashboard.tls: "true"
      traefik.http.routers.traefik-dashboard.service: "api@internal"
      traefik.http.routers.traefik-dashboard.middlewares: "hsts-headers@docker,traefik-auth"
      traefik.http.middlewares.traefik-auth.basicauth.users: "${TRAEFIK_DASHBOARD_HTPASSWD}"
      traefik.http.middlewares.hsts-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.hsts-headers.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.hsts-headers.headers.stsPreload: "true"
      traefik.http.middlewares.hsts-headers.headers.forceSTSHeader: "true"
      # Shared IP-allowlist middleware restricting access to the household
      # admin's own known Tailscale device IPs only - NOT the full Tailscale
      # CGNAT range (100.64.0.0/10), which would let ANY future tailnet
      # identity (e.g. a family member's phone, once a family Tailscale
      # grant exists) through automatically. This specific device list must
      # be updated manually if a device is removed/re-added to the tailnet
      # or its node key is reset - a rare, deliberate event, not something
      # that happens silently. No ipStrategy override - matches the raw
      # direct TCP RemoteAddr only, never X-Forwarded-For. Used to gate
      # clean-URL tailnet access to private-tier-only services on the
      # family entrypoint without touching that entrypoint's own binding or
      # its existing routers at all.
      traefik.http.middlewares.tailnet-admin-only.ipallowlist.sourcerange: "${TAILNET_ADMIN_IPS}"
      traefik.http.routers.traefik-dashboard-cf.rule: "Host(`traefik.${DOMAIN}`)"
      traefik.http.routers.traefik-dashboard-cf.entrypoints: "${TRAEFIK_ENTRYPOINT_5}"
      traefik.http.routers.traefik-dashboard-cf.service: "api@internal"
      traefik.http.routers.traefik-dashboard-cf.middlewares: "hsts-headers@docker,traefik-auth"
      # Step 0 pilot: moved off ${TRAEFIK_ENTRYPOINT_1} (the shared family
      # entrypoint) onto the new dedicated ${TRAEFIK_ENTRYPOINT_7} tailnet
      # entrypoint, reachable only via the traefik-tailnet-forwarder sidecar
      # - this routes around the confirmed docker-proxy source-IP rewrite
      # bug that made tailnet-admin-only reject legitimate Tailscale clients
      # on every one of Traefik's published ports. Middleware chain and
      # ordering kept exactly as-is - hsts-headers@docker MUST stay first,
      # this repo has hit a middleware-ordering bug from reordering this
      # exact chain twice already.
      traefik.http.routers.traefik-dashboard-tailnet.rule: "Host(`traefik.${DOMAIN}`)"
      traefik.http.routers.traefik-dashboard-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.traefik-dashboard-tailnet.tls: "true"
      traefik.http.routers.traefik-dashboard-tailnet.service: "api@internal"
      traefik.http.routers.traefik-dashboard-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker,traefik-auth"
      traefik.docker.network: "traefik-proxy"
    networks:
      # Static IP required so the host-networked traefik-tailnet-forwarder
      # sidecar (network_mode: host is mutually exclusive with joining
      # traefik-proxy by name/DNS) has a fixed address to target. The
      # cloudflare_web_network entry stays a plain list entry, unchanged.
      traefik_proxy_network:
        ipv4_address: "${TRAEFIK_INTERNAL_IP}"
      cloudflare_web_network:
    depends_on:
      fix-permissions:
        condition: service_completed_successfully

networks:
  # Deliberately NO explicit `ipam:` block here, even though Traefik's own
  # service below requests a static ipv4_address on this network - adding
  # one caused a real incident (2026-08-22): Compose treats an added ipam
  # block as a network config change and tries to REMOVE + recreate the
  # network to apply it, even when the declared subnet exactly matches the
  # live one. Docker blocked the removal (network has ~55 other active
  # container endpoints) and the whole redeploy failed, leaving Traefik's
  # container removed with nothing to replace it - a real outage. This
  # network already exists live with subnet 172.27.0.0/16 (confirmed via
  # direct inspection) and is NOT external: true, so Compose reuses the
  # existing network as-is when the file's declared config doesn't diverge
  # from what's already there - Docker validates the ipv4_address below
  # against the network's REAL live IPAM at connect time, not against
  # anything declared in this file. Do not re-add an ipam block here.
  traefik_proxy_network:
    name: traefik-proxy
  cloudflare_web_network:
    name: cloudflare-web
    external: true
