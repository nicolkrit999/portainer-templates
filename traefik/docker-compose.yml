services:
  fix-permissions:
    image: alpine:latest
    container_name: Traefik-init
    user: root
    restart: "no"
    volumes:
      - ${VOLUME_CONFIG}/traefik/acme.json:/fix/acme.json
    command: "chown root:root /fix/acme.json && chmod 600 /fix/acme.json && echo done"

  traefik:
    image: traefik:v3.7.11
    container_name: traefik
    restart: always
    command:
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_1}.address=:${TRAEFIK_PORT_1}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_1}.http.tls.certresolver=cf_dns"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_1}.http.tls.domains[0].main=${DOMAIN}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_1}.http.tls.domains[0].sans=*.${DOMAIN}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_2}.address=:${TRAEFIK_PORT_2}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_2}.http.tls.certresolver=cf_dns"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_2}.http.tls.domains[0].main=${DOMAIN}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_2}.http.tls.domains[0].sans=*.${DOMAIN}"
      # TRAEFIK_PORT_3's value (8444) stays a distinct internal-only port -
      # this entrypoint's wildcard bind would otherwise collide with the
      # family entrypoint's own wildcard :443 bind inside this container.
      # Clean, no-port external access to the private tier (443 on its own
      # dedicated IP) is handled entirely by the separate
      # `traefik-private-forwarder` service (a macvlan TCP-passthrough
      # sidecar forwarding to this container's :${TRAEFIK_PORT_3} over the
      # shared traefik-proxy network) - not by anything in this file. Do not
      # "simplify" this entrypoint's own address to 443.
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_3}.address=:${TRAEFIK_PORT_3}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_3}.asDefault=true"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_3}.http.tls.certresolver=cf_dns"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_3}.http.tls.domains[0].main=${DOMAIN}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_3}.http.tls.domains[0].sans=*.${DOMAIN}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_4}.address=:${TRAEFIK_PORT_4}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_4}.http.tls.certresolver=cf_dns"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_4}.http.tls.domains[0].main=${DOMAIN}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_4}.http.tls.domains[0].sans=*.${DOMAIN}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_5}.address=:${TRAEFIK_PORT_5}"
      - "--entryPoints.${TRAEFIK_ENTRYPOINT_6}.address=:${TRAEFIK_PORT_6}"
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--ping=true"
      - "--ping.entryPoint=${TRAEFIK_ENTRYPOINT_6}"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.watch=true"
      - "--certificatesresolvers.cf_dns.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.cf_dns.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.cf_dns.acme.dnschallenge=true"
      - "--certificatesresolvers.cf_dns.acme.dnschallenge.provider=cloudflare"
      # SAN group 0 (budgeting, 4 names): budget.nicolkrit.ch, budget-ical.nicolkrit.ch, budget-api.nicolkrit.ch, budget-tap.nicolkrit.ch
      - "--certificatesresolvers.cf_dns.acme.domains[0].main=budget.${DOMAIN}"
      - "--certificatesresolvers.cf_dns.acme.domains[0].sans=budget-ical.${DOMAIN},budget-api.${DOMAIN},budget-tap.${DOMAIN}"
      # SAN group 1 (media, 10 names): foto.nicolkrit.ch, jellyfin.nicolkrit.ch, radarr.nicolkrit.ch, sonarr.nicolkrit.ch, plex.nicolkrit.ch, navidrome.nicolkrit.ch, kavita.nicolkrit.ch, audiobookshelf.nicolkrit.ch, ytptube.nicolkrit.ch, qbit-torrent.nicolkrit.ch
      - "--certificatesresolvers.cf_dns.acme.domains[1].main=foto.${DOMAIN}"
      - "--certificatesresolvers.cf_dns.acme.domains[1].sans=jellyfin.${DOMAIN},radarr.${DOMAIN},sonarr.${DOMAIN},plex.${DOMAIN},navidrome.${DOMAIN},kavita.${DOMAIN},audiobookshelf.${DOMAIN},ytptube.${DOMAIN},qbit-torrent.${DOMAIN}"
      # SAN group 2 (household-travel, 10 names): grocy.nicolkrit.ch, homebox.nicolkrit.ch, casa.nicolkrit.ch, ricette.nicolkrit.ch, sparkyfitness.nicolkrit.ch, promemoria.nicolkrit.ch, appuntamenti.nicolkrit.ch, home-assistant.nicolkrit.ch, viaggi.nicolkrit.ch, trek.nicolkrit.ch
      - "--certificatesresolvers.cf_dns.acme.domains[2].main=grocy.${DOMAIN}"
      - "--certificatesresolvers.cf_dns.acme.domains[2].sans=homebox.${DOMAIN},casa.${DOMAIN},ricette.${DOMAIN},sparkyfitness.${DOMAIN},promemoria.${DOMAIN},appuntamenti.${DOMAIN},home-assistant.${DOMAIN},viaggi.${DOMAIN},trek.${DOMAIN}"
      # SAN group 3 (infra-ops, 22 names): portainer.nicolkrit.ch, coolify.nicolkrit.ch, soketi-coolify.nicolkrit.ch, gitea.nicolkrit.ch, tugtainer.nicolkrit.ch, dockpeek.nicolkrit.ch, harborguard.nicolkrit.ch, beszel.nicolkrit.ch, uptime-kuma.nicolkrit.ch, glances.nicolkrit.ch, glance.nicolkrit.ch, gocron.nicolkrit.ch, n8n.nicolkrit.ch, pocket-id.nicolkrit.ch, adguard.nicolkrit.ch, upsnap.nicolkrit.ch, apprise-api.nicolkrit.ch, gotify.nicolkrit.ch, web-check.nicolkrit.ch, traefik.nicolkrit.ch, mailpit.nicolkrit.ch, phpldapadmin.nicolkrit.ch
      - "--certificatesresolvers.cf_dns.acme.domains[3].main=portainer.${DOMAIN}"
      - "--certificatesresolvers.cf_dns.acme.domains[3].sans=coolify.${DOMAIN},soketi-coolify.${DOMAIN},gitea.${DOMAIN},tugtainer.${DOMAIN},dockpeek.${DOMAIN},harborguard.${DOMAIN},beszel.${DOMAIN},uptime-kuma.${DOMAIN},glances.${DOMAIN},glance.${DOMAIN},gocron.${DOMAIN},n8n.${DOMAIN},pocket-id.${DOMAIN},adguard.${DOMAIN},upsnap.${DOMAIN},apprise-api.${DOMAIN},gotify.${DOMAIN},web-check.${DOMAIN},traefik.${DOMAIN},mailpit.${DOMAIN},phpldapadmin.${DOMAIN}"
      # SAN group 4 (utilities, 20 names): it-tools.nicolkrit.ch, omnitools.nicolkrit.ch, convertx.nicolkrit.ch, stirling-pdf.nicolkrit.ch, change-detection.nicolkrit.ch, filebrowser.nicolkrit.ch, duplicati.nicolkrit.ch, snapotter.nicolkrit.ch, moocup.nicolkrit.ch, withoutbg.nicolkrit.ch, cardyo.nicolkrit.ch, datetime.nicolkrit.ch, termix.nicolkrit.ch, snappyemail.nicolkrit.ch, owncloud.nicolkrit.ch, miniqr.nicolkrit.ch, privatebin.nicolkrit.ch, bytestash.nicolkrit.ch, openresume.nicolkrit.ch, sosse.nicolkrit.ch
      - "--certificatesresolvers.cf_dns.acme.domains[4].main=it-tools.${DOMAIN}"
      - "--certificatesresolvers.cf_dns.acme.domains[4].sans=omnitools.${DOMAIN},convertx.${DOMAIN},stirling-pdf.${DOMAIN},change-detection.${DOMAIN},filebrowser.${DOMAIN},duplicati.${DOMAIN},snapotter.${DOMAIN},moocup.${DOMAIN},withoutbg.${DOMAIN},cardyo.${DOMAIN},datetime.${DOMAIN},termix.${DOMAIN},snappyemail.${DOMAIN},owncloud.${DOMAIN},miniqr.${DOMAIN},privatebin.${DOMAIN},bytestash.${DOMAIN},openresume.${DOMAIN},sosse.${DOMAIN}"
      # SAN group 5 (productivity-creative, 11 names): affine.nicolkrit.ch, draw-io.nicolkrit.ch, excalidraw.nicolkrit.ch, fossflow.nicolkrit.ch, opennotebook.nicolkrit.ch, paperlessngx.nicolkrit.ch, linkwarden.nicolkrit.ch, claude.nicolkrit.ch, blender.nicolkrit.ch, lifeglance.nicolkrit.ch, blog.nicolkrit.ch
      - "--certificatesresolvers.cf_dns.acme.domains[5].main=affine.${DOMAIN}"
      - "--certificatesresolvers.cf_dns.acme.domains[5].sans=draw-io.${DOMAIN},excalidraw.${DOMAIN},fossflow.${DOMAIN},opennotebook.${DOMAIN},paperlessngx.${DOMAIN},linkwarden.${DOMAIN},claude.${DOMAIN},blender.${DOMAIN},lifeglance.${DOMAIN},blog.${DOMAIN}"
      - "--certificatesresolvers.cf_dns.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--log.level=INFO"
      - "--accesslog=false"
    environment:
      TZ: "${TZ}"
      CF_DNS_API_TOKEN: "${CF_DNS_API_TOKEN}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${VOLUME_CONFIG}/traefik/acme.json:/letsencrypt/acme.json
    ports:
      - "${TRAEFIK_PORT_1}:${TRAEFIK_PORT_1}"
      - "${TRAEFIK_PORT_2}:${TRAEFIK_PORT_2}"
      - "${TRAEFIK_PORT_3}:${TRAEFIK_PORT_3}"
      - "${TRAEFIK_PORT_4}:${TRAEFIK_PORT_4}"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      traefik.enable: "true"
      traefik.http.routers.traefik-dashboard.rule: "Host(`traefik.${DOMAIN}`)"
      traefik.http.routers.traefik-dashboard.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.traefik-dashboard.tls: "true"
      traefik.http.routers.traefik-dashboard.tls.certresolver: "cf_dns"
      traefik.http.routers.traefik-dashboard.service: "api@internal"
      traefik.http.routers.traefik-dashboard.middlewares: "hsts-headers@docker,traefik-auth"
      traefik.http.middlewares.traefik-auth.basicauth.users: "${TRAEFIK_DASHBOARD_HTPASSWD}"
      traefik.http.middlewares.hsts-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.hsts-headers.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.hsts-headers.headers.stsPreload: "true"
      traefik.http.middlewares.hsts-headers.headers.forceSTSHeader: "true"
      traefik.http.routers.traefik-dashboard-cf.rule: "Host(`traefik.${DOMAIN}`)"
      traefik.http.routers.traefik-dashboard-cf.entrypoints: "${TRAEFIK_ENTRYPOINT_5}"
      traefik.http.routers.traefik-dashboard-cf.service: "api@internal"
      traefik.http.routers.traefik-dashboard-cf.middlewares: "hsts-headers@docker,traefik-auth"
      traefik.docker.network: "traefik-proxy"
    networks:
      - traefik_proxy_network
      - cloudflare_web_network
    depends_on:
      fix-permissions:
        condition: service_completed_successfully

networks:
  traefik_proxy_network:
    name: traefik-proxy
  cloudflare_web_network:
    name: cloudflare-web
    external: true
