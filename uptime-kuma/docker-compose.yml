name: uptime-kuma

services:
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${DOCKER_CONFIG_DIR}/uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.uptime-kuma.rule: "Host(`${UPTIME_KUMA_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.uptime-kuma.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.uptime-kuma.tls: "true"
      traefik.http.routers.uptime-kuma.service: "uptime-kuma"
      traefik.http.routers.uptime-kuma.middlewares: "hsts-headers@docker"
      traefik.http.services.uptime-kuma.loadbalancer.server.port: "3001"
      traefik.docker.network: "traefik-proxy"
    healthcheck:
      test: ["CMD", "node", "/app/extra/healthcheck.js"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 180s


networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
