; Production settings for the public booking site.

; Mitigation recommended by the PHP project for CVE-2026-109619 (php2shell).
session.upload_progress.enabled = Off

expose_php = Off
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

memory_limit = 128M
max_execution_time = 30
upload_max_filesize = 10M
post_max_size = 10M
