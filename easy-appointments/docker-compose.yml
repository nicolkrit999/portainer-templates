services:
  permissions-init:
    image: alpine:3.24.3
    container_name: easy-appointments-permissions-init
    restart: "no"
    network_mode: none
    volumes:
      - '${DOCKER_CONFIG_DIR}/easyappointments-app:/app'
    command: ["sh", "-c", "chown -R 33:33 /app/storage && chmod -R u=rwX,g=rX,o= /app/storage && chown 0:33 /app/config.php /app/application/config/email.php && chmod 640 /app/config.php /app/application/config/email.php && echo permissions-init complete"]

  php-fpm:
    build: ./php-fpm
    image: easy-appointments-php-fpm:8.4.27
    pull_policy: build
    container_name: php-fpm
    restart: unless-stopped
    working_dir: /var/www/html
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    environment:
      TZ: "${TZ}"
      PROXY_IPS: "${EASY_APPOINTMENTS_PROXY_IPS:-172.16.88.0/28,172.27.0.0/16}"
    volumes:
      - '${DOCKER_CONFIG_DIR}/easyappointments-app:/var/www/html:ro'
      - '${DOCKER_CONFIG_DIR}/easyappointments-app/storage:/var/www/html/storage'
    networks:
      - easy_appointments_backend_network
      - default
    depends_on:
      permissions-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    build: ./nginx
    image: easy-appointments-nginx:1.30.6
    pull_policy: build
    container_name: easy-appointments-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    environment:
      TZ: "${TZ}"
      EASY_APPOINTMENTS_SUBDOMAIN: "${EASY_APPOINTMENTS_SUBDOMAIN:?}"
      DOMAIN: "${DOMAIN:?}"
    volumes:
      - '${DOCKER_CONFIG_DIR}/easyappointments-app/assets:/var/www/html/assets:ro'
    networks:
      - easy_appointments_backend_network
      - traefik_proxy_network
      - public_easy_appointments_network
    depends_on:
      php-fpm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header \"Host: $${EASY_APPOINTMENTS_SUBDOMAIN}.$${DOMAIN}\" http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      traefik.enable: "true"
      traefik.http.routers.easy-appointments-family.rule: "Host(`${EASY_APPOINTMENTS_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.easy-appointments-family.entrypoints: "${TRAEFIK_ENTRYPOINT_1}"
      traefik.http.routers.easy-appointments-family.tls: "true"
      traefik.http.routers.easy-appointments-family.service: "easy-appointments"
      traefik.http.routers.easy-appointments-family.middlewares: "hsts-headers@docker"
      traefik.http.routers.easy-appointments-guest.rule: "Host(`${EASY_APPOINTMENTS_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.easy-appointments-guest.entrypoints: "${TRAEFIK_ENTRYPOINT_2}"
      traefik.http.routers.easy-appointments-guest.tls: "true"
      traefik.http.routers.easy-appointments-guest.service: "easy-appointments"
      traefik.http.routers.easy-appointments-guest.middlewares: "hsts-headers@docker"
      traefik.http.services.easy-appointments.loadbalancer.server.port: "80"
      traefik.http.routers.easy-appointments-private.rule: "Host(`${EASY_APPOINTMENTS_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.easy-appointments-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.easy-appointments-private.tls: "true"
      traefik.http.routers.easy-appointments-private.service: "easy-appointments-private"
      traefik.http.routers.easy-appointments-private.middlewares: "hsts-headers@docker"
      traefik.http.services.easy-appointments-private.loadbalancer.server.port: "80"
      traefik.docker.network: "traefik-proxy"

  mysql:
    image: 'mysql:8.0.46'
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - '${DOCKER_CONFIG_DIR}/easyappointments/docker/mysql:/var/lib/mysql'
    networks:
      - easy_appointments_backend_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  phpmyadmin:
    image: 'phpmyadmin:5.2.3-apache'
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
      PMA_HOST: "mysql"
      UPLOAD_LIMIT: "${PMA_UPLOAD_LIMIT}"
    networks:
      - easy_appointments_backend_network
      - traefik_proxy_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      traefik.enable: "true"
      traefik.http.routers.easy-appointments-pma.rule: "Host(`${EASY_APPOINTMENTS_PMA_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.easy-appointments-pma.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.easy-appointments-pma.tls: "true"
      traefik.http.routers.easy-appointments-pma.service: "easy-appointments-pma"
      traefik.http.routers.easy-appointments-pma.middlewares: "hsts-headers@docker"
      traefik.http.routers.easy-appointments-pma-tailnet.rule: "Host(`${EASY_APPOINTMENTS_PMA_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.easy-appointments-pma-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.easy-appointments-pma-tailnet.tls: "true"
      traefik.http.routers.easy-appointments-pma-tailnet.service: "easy-appointments-pma"
      traefik.http.routers.easy-appointments-pma-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.easy-appointments-pma.loadbalancer.server.port: "80"
      traefik.docker.network: "traefik-proxy"

  swagger-ui:
    build: ./swagger-ui
    platform: linux/amd64
    image: easy-appointments-swagger-ui:5.34.1
    pull_policy: build
    restart: unless-stopped
    environment:
      API_URL: "openapi.yml"
    networks:
      - traefik_proxy_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.http.routers.easy-appointments-swagger.rule: "Host(`${EASY_APPOINTMENTS_SWAGGER_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.easy-appointments-swagger.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.easy-appointments-swagger.tls: "true"
      traefik.http.routers.easy-appointments-swagger.service: "easy-appointments-swagger"
      traefik.http.routers.easy-appointments-swagger.middlewares: "hsts-headers@docker"
      traefik.http.routers.easy-appointments-swagger-tailnet.rule: "Host(`${EASY_APPOINTMENTS_SWAGGER_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.easy-appointments-swagger-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.easy-appointments-swagger-tailnet.tls: "true"
      traefik.http.routers.easy-appointments-swagger-tailnet.service: "easy-appointments-swagger"
      traefik.http.routers.easy-appointments-swagger-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.easy-appointments-swagger.loadbalancer.server.port: "8080"
      traefik.docker.network: "traefik-proxy"

networks:
  easy_appointments_backend_network:
    name: easy-appointments-backend
    internal: true
    ipam:
      config:
        - subnet: "${EASY_APPOINTMENTS_BACKEND_SUBNET:-172.16.88.16/28}"
  traefik_proxy_network:
    name: traefik-proxy
    external: true
  public_easy_appointments_network:
    name: public-easy-appointments
    external: true
