services:
  # Third Tailscale identity in this repo, giving AdGuard its own tailnet
  # IP so it can be the tailnet's registered DNS nameserver - fixes the
  # exit-node DNS bypass. Not network_mode: host (would collide with
  # Traefik's wildcard bind); see adguard/README.md for the full design
  # and .claude/rules/core-infra-topology.md for why a second identity is
  # needed at all.
  tailscale-adguard:
    image: tailscale/tailscale:latest
    container_name: tailscale-adguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: "${TS_AUTHKEY_ADGUARD}"
      TS_STATE_DIR: "/var/lib/tailscale"
      TS_USERSPACE: "false"
      TS_HOSTNAME: "${TS_HOSTNAME_ADGUARD}"
    volumes:
      - ${VOLUME_CONFIG}/tailscale-adguard/state:/var/lib/tailscale
    # Static IP so `dns-relay` (network_mode: service:tailscale-adguard,
    # can't declare its own networks:) has a stable route to adguard.
    networks:
      traefik_proxy_network:
        ipv4_address: "${TAILSCALE_ADGUARD_INTERNAL_IP}"
    # Lets dns-relay (sharing this namespace) bind port 53 without root.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    # Relative CPU scheduling priority (cgroup v2 cpu.weight, no hard cap)
    # - part of AdGuard's DNS resolution chain, must not starve under
    # contention from bursty workloads like immich_machine_learning/
    # jellyfin transcodes. 4x Docker's default of 1024, not a reservation.
    cpu_shares: 4096
    restart: always
    healthcheck:
      test: ["CMD", "tailscale", "status", "--json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # Writes dnsdist's YAML config to a bind-mounted host path (idempotent -
  # only writes if missing, same pattern as
  # ../traefik-tailnet-forwarder/docker-compose.yml's haproxy-config-init)
  # so ${ADGUARD_INTERNAL_IP} gets substituted into the backend address at
  # generation time - dnsdist YAML files have no ${VAR} interpolation of
  # their own. CUTOVER (2026-09-08): this replaced `socat` as the live
  # relay on :53 after burst-test validation via a :5300 canary showed
  # zero failures at 100x+ the query rate that caused two real outages -
  # see ../adguard/INCIDENT-2026-09-08-dns-relay-outage.md for the full
  # incident, root cause, and validation results.
  dnsdist-config-init:
    image: alpine:latest
    container_name: tailscale-adguard-dnsdist-config-init
    restart: "no"
    environment:
      ADGUARD_INTERNAL_IP: "${ADGUARD_INTERNAL_IP}"
    volumes:
      - ${VOLUME_CONFIG}/tailscale-adguard:/target
    command:
      - "sh"
      - "-c"
      - "if [ -f /target/dnsdist.yml ]; then echo \"dnsdist.yml already exists, skipping\"; else mkdir -p /target && cat > /target/dnsdist.yml << EOF\n# See ../adguard/INCIDENT-2026-09-08-dns-relay-outage.md for why this\n# replaced socat (UDP-LISTEN,fork race, root cause of two real outages).\nconsole:\n  listen_address: \"127.0.0.1:5199\"\n\nacl:\n  - \"100.64.0.0/10\"\n\nbinds:\n  - listen_address: \"0.0.0.0:53\"\n    protocol: Do53\n\nbackends:\n  - address: \"$$ADGUARD_INTERNAL_IP:53\"\n    protocol: Do53\n    name: \"adguard\"\n# Deliberately NO packet_caches section - AdGuard already caches; caching\n# here would blind AdGuard's own query log (the tool that diagnosed the\n# 2026-09-08 incident) and delay blocklist changes. See the incident doc.\nEOF\nchmod 644 /target/dnsdist.yml; fi; cat /target/dnsdist.yml"

  # Relays DNS (UDP+TCP 53) from tailscale-adguard's tailnet IP to the real
  # adguard container. Shares tailscale-adguard's namespace (service:
  # form, same compose file only) rather than joining traefik-proxy
  # itself. Event-driven/bounded-concurrency (dnsdist), not fork-per-query
  # (socat) - see the incident doc for why that distinction is the whole
  # point of this change.
  dns-relay:
    image: powerdns/dnsdist-20:2.0.9
    container_name: tailscale-adguard-dns-relay
    network_mode: service:tailscale-adguard
    depends_on:
      tailscale-adguard:
        condition: service_healthy
      dnsdist-config-init:
        condition: service_completed_successfully
    volumes:
      - ${VOLUME_CONFIG}/tailscale-adguard/dnsdist.yml:/etc/dnsdist/dnsdist.yml:ro
    # dnsdist-startup (the image's own ENTRYPOINT wrapper) execs
    # `dnsdist --supervised --disable-syslog` plus whatever args are given
    # as this service's `command:` - no need to override entrypoint.
    command: ["-C", "/etc/dnsdist/dnsdist.yml"]
    # Relative CPU scheduling priority (cgroup v2 cpu.weight, no hard cap)
    # - part of AdGuard's DNS resolution chain, must not starve under
    # contention. 4x Docker's default of 1024, not a reservation. Note:
    # network_mode: service: does not share cgroups, so this needs its
    # own weight independent of tailscale-adguard's.
    cpu_shares: 4096
    restart: unless-stopped
    healthcheck:
      # dnsdist's own console/control-socket command, not a custom nc -z
      # check - queries the running instance directly via the console
      # bound above (127.0.0.1:5199, unauthenticated - local-only ACL).
      test: ["CMD", "dnsdist", "-e", "showVersion()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

# No Cloudflare/Traefik labels - Tailscale-only, no HTTP surface (like ../iperf3/).
networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
