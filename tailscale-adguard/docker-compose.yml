services:
  # Third Tailscale identity in this repo, giving AdGuard its own tailnet
  # IP so it can be the tailnet's registered DNS nameserver - fixes the
  # exit-node DNS bypass. Not network_mode: host (would collide with
  # Traefik's wildcard bind); see adguard/README.md for the full design
  # and .claude/rules/core-infra-topology.md for why a second identity is
  # needed at all.
  tailscale-adguard:
    image: tailscale/tailscale:latest
    container_name: tailscale-adguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: "${TS_AUTHKEY_ADGUARD}"
      TS_STATE_DIR: "/var/lib/tailscale"
      TS_USERSPACE: "false"
      TS_HOSTNAME: "${TS_HOSTNAME_ADGUARD}"
    volumes:
      - ${VOLUME_CONFIG}/tailscale-adguard/state:/var/lib/tailscale
    # Static IP so `dns-relay` (network_mode: service:tailscale-adguard,
    # can't declare its own networks:) has a stable route to adguard.
    networks:
      traefik_proxy_network:
        ipv4_address: "${TAILSCALE_ADGUARD_INTERNAL_IP}"
    # Lets dns-relay (sharing this namespace) bind port 53 without root.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    # Relative CPU scheduling priority (cgroup v2 cpu.weight, no hard cap)
    # - part of AdGuard's DNS resolution chain, must not starve under
    # contention from bursty workloads like immich_machine_learning/
    # jellyfin transcodes. 4x Docker's default of 1024, not a reservation.
    cpu_shares: 4096
    restart: always
    healthcheck:
      test: ["CMD", "tailscale", "status", "--json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # Writes dnsdist's YAML config to a bind-mounted host path. ALWAYS
  # regenerates (no "skip if exists" check, deliberately - the generated
  # file has no state of its own worth preserving, and an idempotency
  # guard here meant three separate manual "delete the stale file" steps
  # during this fix's own rollout every time the config needed to change;
  # since regeneration is deterministic and cheap, always-write means a
  # future config change just takes effect on next redeploy, no manual
  # deletion ever needed again). ${ADGUARD_INTERNAL_IP}/${DNSDIST_CONSOLE_KEY}
  # get substituted into the file at generation time - dnsdist YAML files
  # have no ${VAR} interpolation of their own. CUTOVER (2026-09-08): this
  # replaced `socat` as the live relay on :53 after burst-test validation
  # via a :5300 canary showed zero failures at 100x+ the query rate that
  # caused two real outages - see
  # ../adguard/INCIDENT-2026-09-08-dns-relay-outage.md for the full
  # incident, root cause, and validation results.
  dnsdist-config-init:
    image: alpine:latest
    container_name: tailscale-adguard-dnsdist-config-init
    restart: "no"
    environment:
      ADGUARD_INTERNAL_IP: "${ADGUARD_INTERNAL_IP}"
      DNSDIST_CONSOLE_KEY: "${DNSDIST_CONSOLE_KEY}"
    volumes:
      - ${VOLUME_CONFIG}/tailscale-adguard:/target
    command:
      - "sh"
      - "-c"
      - "mkdir -p /target && cat > /target/dnsdist.yml << EOF\n# See ../adguard/INCIDENT-2026-09-08-dns-relay-outage.md for why this\n# replaced socat (UDP-LISTEN,fork race, root cause of two real outages).\nconsole:\n  listen_address: \"127.0.0.1:5199\"\n  key: \"$$DNSDIST_CONSOLE_KEY\"\n\nacl:\n  - \"100.64.0.0/10\"\n\nbinds:\n  - listen_address: \"0.0.0.0:53\"\n    protocol: Do53\n\nbackends:\n  - address: \"$$ADGUARD_INTERNAL_IP:53\"\n    protocol: Do53\n    name: \"adguard\"\n# Deliberately NO packet_caches section - AdGuard already caches; caching\n# here would blind AdGuard's own query log (the tool that diagnosed the\n# 2026-09-08 incident) and delay blocklist changes. See the incident doc.\nEOF\nchmod 644 /target/dnsdist.yml; echo 'dnsdist.yml written (contents not echoed - contains the console key)'; grep -v 'key:' /target/dnsdist.yml"

  # Relays DNS (UDP+TCP 53) from tailscale-adguard's tailnet IP to the real
  # adguard container. Shares tailscale-adguard's namespace (service:
  # form, same compose file only) rather than joining traefik-proxy
  # itself. Event-driven/bounded-concurrency (dnsdist), not fork-per-query
  # (socat) - see the incident doc for why that distinction is the whole
  # point of this change.
  dns-relay:
    image: powerdns/dnsdist-20:2.0.9
    container_name: tailscale-adguard-dns-relay
    network_mode: service:tailscale-adguard
    depends_on:
      tailscale-adguard:
        condition: service_healthy
      dnsdist-config-init:
        condition: service_completed_successfully
    environment:
      # Only used by the healthcheck below (dnsdist -k) - the config file
      # itself already has the same key baked in via console.key at
      # generation time.
      DNSDIST_CONSOLE_KEY: "${DNSDIST_CONSOLE_KEY}"
    volumes:
      - ${VOLUME_CONFIG}/tailscale-adguard/dnsdist.yml:/etc/dnsdist/dnsdist.yml:ro
    # dnsdist-startup (the image's own ENTRYPOINT wrapper) execs
    # `dnsdist --supervised --disable-syslog` plus whatever args are given
    # as this service's `command:` - no need to override entrypoint.
    command: ["-C", "/etc/dnsdist/dnsdist.yml"]
    # dnsdist's own startup warning: its configuration can use more file
    # descriptors than Docker's default 1024 soft limit (confirmed via
    # `ulimit -n` inside the container after cutover) - raise it well
    # above dnsdist's own stated potential need (>10053 for this config)
    # so a large enough connection burst can't hit an artificial ceiling
    # this fix was specifically meant to eliminate. Standard fix per
    # dnsdist's own docs (equivalent of `ulimit -n`/systemd `LimitNOFILE`).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Relative CPU scheduling priority (cgroup v2 cpu.weight, no hard cap)
    # - part of AdGuard's DNS resolution chain, must not starve under
    # contention. 4x Docker's default of 1024, not a reservation. Note:
    # network_mode: service: does not share cgroups, so this needs its
    # own weight independent of tailscale-adguard's.
    cpu_shares: 4096
    restart: unless-stopped
    healthcheck:
      # dnsdist's own console/control-socket command, not a custom nc -z
      # check - queries the running instance directly via the console
      # bound above (127.0.0.1:5199). Must pass -k with the same key the
      # config sets via console.key, or every connection is silently
      # refused - dnsdist's CLI still exits 0 on that failure (confirmed
      # live), so an unauthenticated version of this check is a false
      # positive that would never catch a genuinely dead/hung dnsdist.
      # CMD-SHELL (not the CMD array form) is required here so the
      # container's own shell actually expands $DNSDIST_CONSOLE_KEY at
      # runtime - the array form passes each argument literally with no
      # expansion. Escaped as $$ (not a bare $VAR) so COMPOSE doesn't
      # interpolate this at file-parse time and bake the plaintext key
      # into the container's inspectable healthcheck config - the same
      # bare-$VAR trap this repo has hit repeatedly (see
      # macvlan-host-shim/README.md), caught here before deploy this time.
      test: ["CMD-SHELL", "dnsdist -e 'showVersion()' -k \"$$DNSDIST_CONSOLE_KEY\" -c 127.0.0.1:5199"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

# No Cloudflare/Traefik labels - Tailscale-only, no HTTP surface (like ../iperf3/).
networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
