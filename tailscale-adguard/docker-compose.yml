services:
  # THIRD, INDEPENDENT Tailscale identity in this repo (after the primary
  # node in ../tailscale/ and the admin-gateway node in ../tailscale-admin/).
  # Deliberately its own container/device, not a reuse of either - same two
  # structural reasons as ../tailscale-admin/docker-compose.yml explains in
  # full:
  #
  #   1. tailscale0 is a TUN device, not a real L2 NIC - it cannot be shared
  #      or split across multiple containers the way a physical interface
  #      can, so any additional tailnet-reachable identity needs its own
  #      Tailscale container.
  #   2. The primary node (../tailscale/) runs network_mode: host. Binding
  #      anything else directly into that same namespace risks colliding
  #      with Traefik's own wildcard bind, exactly as happened before with
  #      an early traefik-tailnet-forwarder attempt (see
  #      ../tailscale-admin/docker-compose.yml and
  #      .claude/rules/core-infra-topology.md for that history). Using
  #      ordinary (non-host) Docker networking instead avoids that
  #      collision entirely.
  #
  # PURPOSE: give AdGuard Home (../adguard/, container `adguard`) its own
  # tailnet IP so it can be registered as the tailnet's DNS server in the
  # Tailscale admin console. This fixes a confirmed bug: a device connected
  # via Tailscale with an active exit node bypasses AdGuard entirely,
  # because Tailscale's DNS override sends queries to whatever nameserver
  # IS registered in the tailnet's DNS settings - today nothing is, so
  # queries fall through to the exit node's own DNS instead. Once this
  # node's tailnet IP is registered as the tailnet nameserver (done
  # separately, in the Tailscale admin console - out of scope for this
  # compose file), Tailscale's DNS routing takes priority over the exit
  # node for every device, exit-node-active or not.
  #
  # This container ONLY holds the Tailscale identity/tunnel. It does not
  # itself speak DNS - port 53 traffic arriving on its tailnet IP is
  # relayed to the real `adguard` container by the `dns-relay` service
  # below, which shares this container's network namespace.
  #
  # Deliberately does NOT advertise any subnet routes (no
  # --advertise-routes) - this node is not a LAN gateway, it only needs to
  # be reachable at its own tailnet IP so devices can query it as a
  # nameserver.
  tailscale-adguard:
    image: tailscale/tailscale:latest
    container_name: tailscale-adguard
    # NOT network_mode: host - see comment block above. Ordinary bridge
    # networking (via traefik_proxy_network below) is what makes this a
    # genuinely separate, non-conflicting namespace, and is also how
    # `dns-relay` (sharing this namespace) reaches `adguard:53`.
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: "${TS_AUTHKEY_ADGUARD}"
      TS_STATE_DIR: "/var/lib/tailscale"
      TS_USERSPACE: "false"
      TS_HOSTNAME: "${TS_HOSTNAME_ADGUARD}"
    volumes:
      - ${VOLUME_CONFIG}/tailscale-adguard/state:/var/lib/tailscale
    # Only network attachment this container needs. traefik-proxy gives it:
    #   (a) a route to the real `adguard` container for `dns-relay`
    #       (sharing this namespace) to forward DNS queries to, and
    #   (b) normal outbound NAT/internet access to reach Tailscale's own
    #       coordination servers.
    # A container using network_mode: service:tailscale-adguard (dns-relay,
    # below) cannot declare its own networks: block, so this is also the
    # only place traefik-proxy attachment needs to be declared for this
    # pair.
    #
    # STATIC IP required (not left to Docker's dynamic assignment): this
    # node's whole purpose is to be registered by a fixed tailnet identity
    # as the tailnet nameserver - while what actually matters for that
    # registration is the Tailscale-assigned 100.x.x.x address (not this
    # Docker-internal one), a stable Docker-internal IP keeps this
    # container's identity on traefik-proxy predictable and consistent with
    # every other static-IP node on this network (../traefik/,
    # ../tailscale-admin/, ../traefik-private-forwarder/), rather than one
    # exception that silently gets a new address on every recreate.
    networks:
      traefik_proxy_network:
        ipv4_address: "${TAILSCALE_ADGUARD_INTERNAL_IP}"
    # Namespace-scoped fix (not host-wide, safe on a non-host-mode
    # container) letting a non-root process bound to THIS namespace -
    # i.e. `dns-relay` once it joins via network_mode: service:tailscale-adguard
    # below - bind port 53 (a privileged port) without cap_add:
    # NET_BIND_SERVICE or running as root. Same pattern and same reasoning
    # as ../tailscale-admin/docker-compose.yml's identical sysctl for its
    # own namespace-sharing forwarder.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    # Tightly coupled to AdGuard's DNS-filtering correctness, which the
    # household considers important - must come back after a host reboot
    # unconditionally, not just after a crash.
    restart: always
    healthcheck:
      test: ["CMD", "tailscale", "status", "--json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # Relays DNS (UDP + TCP port 53) arriving on tailscale-adguard's tailnet
  # IP to the real `adguard` container's DNS port. Joins tailscale-adguard's
  # network namespace directly (Compose same-project `service:` form is
  # correct here since both services live in this one compose file, unlike
  # the cross-stack `network_mode: container:tailscale-admin` used between
  # the separate ../tailscale-admin/ and ../traefik-tailnet-forwarder/
  # stacks) - this gives it tailscale-adguard's tailnet IP to bind to, and
  # (since tailscale-adguard is itself attached to traefik_proxy_network)
  # a route to `adguard:53` on that same network, with no networks: block
  # of its own.
  #
  # No NET_ADMIN or other host-networking capability needed - this is pure
  # userspace socat relaying inside a namespace it's sharing, not creating
  # interfaces or routes (unlike ../macvlan-host-shim/, which does need
  # NET_ADMIN for exactly that reason).
  dns-relay:
    image: alpine:latest
    container_name: tailscale-adguard-dns-relay
    network_mode: service:tailscale-adguard
    depends_on:
      tailscale-adguard:
        condition: service_healthy
    # Single-line, idempotent-safe command styled after
    # ../macvlan-host-shim/docker-compose.yml: install socat and
    # netcat-openbsd on first run (base alpine's busybox doesn't ship an
    # `nc` usable by the healthcheck below - harmless to repeat on every
    # restart), then background a UDP and a TCP relay (DNS needs both)
    # listening on port 53 - bound within this shared namespace, i.e. on
    # tailscale-adguard's tailnet IP - forwarding every query to the real
    # `adguard` container's DNS port over traefik-proxy, then block on
    # `wait` so the container stays up as long as both relays are alive.
    #
    # ⚠️ `-T5` on both socat invocations is NOT optional - confirmed live
    # incident, 2026-09-07: without an inactivity timeout, socat's `fork`
    # mode never terminates a forked child that handled a UDP query, since
    # UDP has no notion of "connection closed" the way TCP does - each
    # child just sits there indefinitely waiting for more traffic from
    # that same peer. Under this repo's real household DNS query volume,
    # this reliably grew to 2000+ leaked processes within about an hour of
    # normal use, which eventually exhausted the container and made NEW
    # connections (including legitimate ones) get refused - the exact
    # symptom the household hit ("internet stops working a few minutes
    # after enabling Tailscale, only clears by disabling it"). `-T5`
    # forces each forked child to exit after 5s of inactivity - verified
    # directly against the real `adguard` target over the real
    # traefik-proxy network (a throwaway test container, not this one):
    # 13 processes present immediately after a burst of queries, down to
    # 3 (just the listener) 7 seconds later. 5s is comfortably longer than
    # any real single DNS exchange takes, so this never disrupts a
    # legitimate in-flight query.
    command: "sh -c 'apk add --no-cache socat netcat-openbsd >/dev/null 2>&1; socat -T5 UDP-LISTEN:53,fork,reuseaddr UDP:adguard:53 & socat -T5 TCP-LISTEN:53,fork,reuseaddr TCP:adguard:53 & wait'"
    # Same criticality tier as tailscale-adguard itself - the relay is what
    # actually makes the tailnet IP useful as a nameserver.
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w2 127.0.0.1 53 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

# No Cloudflare Tunnel / Traefik router labels on either service - this is
# Tailscale-only DNS-relay infrastructure with no HTTP surface (same
# category as ../iperf3/), out of scope per the objective. Not a SAN-bundle
# member for the same reason - there is no router here to bundle.
networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
