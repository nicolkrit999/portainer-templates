services:
    fossflow:
        image: stnsmith/fossflow:latest
        container_name: fossflow
        healthcheck:
            test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 90s
        environment:
            NODE_ENV: production
            ENABLE_SERVER_STORAGE: true
            STORAGE_PATH: /data/diagrams
            ENABLE_GIT_BACKUP: false
        volumes:
            - ${DOCKER_CONFIG_DIR}/fossflow:/data/diagrams:rw
        restart: unless-stopped
        networks:
            - cloudflare_web_network
            - traefik_proxy_network
        labels:
            traefik.enable: "true"
            traefik.http.routers.fossflow.rule: "Host(`${FOSSFLOW_SUBDOMAIN}.${DOMAIN}`)"
            traefik.http.routers.fossflow.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
            traefik.http.routers.fossflow.tls: "true"
            traefik.http.routers.fossflow.service: "fossflow"
            traefik.http.routers.fossflow.middlewares: "hsts-headers@docker"
            traefik.http.routers.fossflow-tailnet.rule: "Host(`${FOSSFLOW_SUBDOMAIN}.${DOMAIN}`)"
            traefik.http.routers.fossflow-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
            traefik.http.routers.fossflow-tailnet.tls: "true"
            traefik.http.routers.fossflow-tailnet.service: "fossflow"
            traefik.http.routers.fossflow-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
            traefik.http.services.fossflow.loadbalancer.server.port: "80"
            traefik.docker.network: "traefik-proxy"

networks:
    cloudflare_web_network:
        name: cloudflare-web
        external: true
    traefik_proxy_network:
        name: traefik-proxy
        external: true
