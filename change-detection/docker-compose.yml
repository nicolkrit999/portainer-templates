services:
  changedetection:
    container_name: change-detection
    image: dgtlmoon/changedetection.io:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/5000' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ${DOCKER_CONFIG_DIR}/changedetection/datastore:/datastore:rw
    depends_on:
      sockpuppetbrowser:
        condition: service_started
    environment:
      - TZ=${TZ}
      - PLAYWRIGHT_DRIVER_URL=ws://sockpuppetbrowser:3000
      - LC_ALL=C.UTF-8
      - LANG=C.UTF-8
      - SOCKETIO_ASYNC_MODE=threading
    labels:
      traefik.enable: "true"
      traefik.http.routers.changedetection.rule: "Host(`${CHANGE_DETECTION_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.changedetection.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.changedetection.tls: "true"
      traefik.http.routers.changedetection.service: "changedetection"
      traefik.http.routers.changedetection.middlewares: "hsts-headers@docker"
      traefik.http.routers.changedetection-tailnet.rule: "Host(`${CHANGE_DETECTION_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.changedetection-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.changedetection-tailnet.tls: "true"
      traefik.http.routers.changedetection-tailnet.service: "changedetection"
      traefik.http.routers.changedetection-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.changedetection.loadbalancer.server.port: "5000"
      traefik.docker.network: "traefik-proxy"
    networks:
      - change_detection_backend_network
      - traefik_proxy_network

  sockpuppetbrowser:
    container_name: changedetection-sock
    image: dgtlmoon/sockpuppetbrowser:latest
    security_opt:
      - seccomp:unconfined
    shm_size: "2g"
    restart: unless-stopped
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
    healthcheck:
      test: [
        "CMD-SHELL",
        "python3 -c 'import socket; s = socket.socket(); s.settimeout(5); s.connect((\"127.0.0.1\", 3000))'"
      ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - change_detection_backend_network

networks:
  change_detection_backend_network:
    name: change-detection-backend
    ipam:
      config:
        - subnet: "${CHANGE_DETECTION_BACKEND_SUBNET:-172.16.99.0/28}"
          gateway: "${CHANGE_DETECTION_BACKEND_GATEWAY:-172.16.99.1}"
          ip_range: "${CHANGE_DETECTION_BACKEND_IP_RANGE:-172.16.99.8/29}"
  traefik_proxy_network:
    name: traefik-proxy
    external: true
