services:
  # Host-side macvlan shim interface + active DNS relay, working around
  # Docker macvlan's host<->macvlan-child unreachability. Load-bearing for
  # AdGuard's conditional-forward to dnsmasq - see adguard/README.md
  # "Why macvlan instead of a normal Docker network" for the full design,
  # the host-route requirement, and the operational .95-not-.98 rule.
  macvlan-host-shim:
    image: alpine:latest
    container_name: macvlan-host-shim
    network_mode: host
    cap_add:
      - NET_ADMIN
    # Idempotent: safe to re-run on every restart/reboot. `$ip` (the loop
    # variable) must stay $$-escaped - Compose interpolates bare $words
    # too, not just ${VAR} - and -T5 on both socat relays is required to
    # avoid a process leak. See README for both incidents.
    command: "sh -c 'apk add --no-cache iproute2 socat netcat-openbsd >/dev/null 2>&1; ip link show ${MACVLAN_SHIM_IFACE} >/dev/null 2>&1 || ip link add ${MACVLAN_SHIM_IFACE} link ${LAN_INTERFACE} type macvlan mode bridge; ip addr show dev ${MACVLAN_SHIM_IFACE} | grep -q \"${MACVLAN_SHIM_IP}/32\" || ip addr add ${MACVLAN_SHIM_IP}/32 dev ${MACVLAN_SHIM_IFACE}; ip link set ${MACVLAN_SHIM_IFACE} up; for ip in $(echo ${MACVLAN_ATTACHED_IPS} | tr \",\" \" \"); do ip route show \"$$ip/32\" | grep -q \"dev ${MACVLAN_SHIM_IFACE}\" || ip route add \"$$ip/32\" dev ${MACVLAN_SHIM_IFACE}; done; socat -T5 UDP-LISTEN:53,bind=${MACVLAN_SHIM_IP},fork,reuseaddr UDP:${NAS_IP}:53 & socat -T5 TCP-LISTEN:53,bind=${MACVLAN_SHIM_IP},fork,reuseaddr TCP:${NAS_IP}:53 & wait'"
    restart: always
    healthcheck:
      # Checks the interface, the relay, AND every route in
      # ${MACVLAN_ATTACHED_IPS} - not just the interface, which could pass
      # even with a crashed relay or a lost route.
      test: ["CMD-SHELL", "ip addr show dev ${MACVLAN_SHIM_IFACE} | grep -q \"${MACVLAN_SHIM_IP}/32\" && nc -z ${MACVLAN_SHIM_IP} 53 && for ip in $(echo ${MACVLAN_ATTACHED_IPS} | tr \",\" \" \"); do ip route show \"$$ip/32\" | grep -q \"dev ${MACVLAN_SHIM_IFACE}\" || exit 1; done"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

# network_mode: host is incompatible with attaching Docker networks - no
# Cloudflare/Traefik here, same as `tailscale`.
