services:
  # Host-side macvlan shim interface, working around Docker macvlan's
  # host<->macvlan-child unreachability. Load-bearing for AdGuard's
  # conditional-forward to dnsmasq - see adguard/README.md "Why macvlan
  # instead of a normal Docker network" for the full design, the
  # host-route requirement, and the operational .95-not-.98 rule.
  #
  # 2026-09-08: the socat DNS relay that used to run in this container is
  # GONE - dnsmasq now binds ${MACVLAN_SHIM_IP} directly (it runs
  # network_mode: host, so it can), removing a relay hop entirely rather
  # than just hardening it. This container's only remaining job is the
  # interface + host routes below - see
  # ../adguard/INCIDENT-2026-09-08-dns-relay-outage.md for why, and
  # ../dnsmasq/docker-compose.yml for the other half of this change.
  macvlan-host-shim:
    image: alpine:latest
    container_name: macvlan-host-shim
    network_mode: host
    cap_add:
      - NET_ADMIN
    # Idempotent: safe to re-run on every restart/reboot. `$ip` (the loop
    # variable) must stay $$-escaped - Compose interpolates bare $words
    # too, not just ${VAR}.
    command: "sh -c 'apk add --no-cache iproute2 >/dev/null 2>&1; ip link show ${MACVLAN_SHIM_IFACE} >/dev/null 2>&1 || ip link add ${MACVLAN_SHIM_IFACE} link ${LAN_INTERFACE} type macvlan mode bridge; ip addr show dev ${MACVLAN_SHIM_IFACE} | grep -q \"${MACVLAN_SHIM_IP}/32\" || ip addr add ${MACVLAN_SHIM_IP}/32 dev ${MACVLAN_SHIM_IFACE}; ip link set ${MACVLAN_SHIM_IFACE} up; for ip in $(echo ${MACVLAN_ATTACHED_IPS} | tr \",\" \" \"); do ip route show \"$$ip/32\" | grep -q \"dev ${MACVLAN_SHIM_IFACE}\" || ip route add \"$$ip/32\" dev ${MACVLAN_SHIM_IFACE}; done; while true; do sleep 3600; done'"
    # Relative CPU scheduling priority (cgroup v2 cpu.weight, no hard cap)
    # - still part of AdGuard's DNS resolution chain (the interface/routes
    # this sets up are still load-bearing), must not starve under
    # contention. 4x Docker's default of 1024, not a reservation.
    cpu_shares: 4096
    # Protects this container from being an early OOM-kill target - part
    # of AdGuard's DNS chain. See adguard/INCIDENT-2026-09-08-dns-relay-outage.md.
    oom_score_adj: -800
    restart: always
    healthcheck:
      # No relay/port to check anymore - this container's only job is the
      # interface and routes. Checks the interface AND every route in
      # ${MACVLAN_ATTACHED_IPS}, not just the interface (which could pass
      # even with a lost route).
      test: ["CMD-SHELL", "ip addr show dev ${MACVLAN_SHIM_IFACE} | grep -q \"${MACVLAN_SHIM_IP}/32\" && for ip in $(echo ${MACVLAN_ATTACHED_IPS} | tr \",\" \" \"); do ip route show \"$$ip/32\" | grep -q \"dev ${MACVLAN_SHIM_IFACE}\" || exit 1; done"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

# network_mode: host is incompatible with attaching Docker networks - no
# Cloudflare/Traefik here, same as `tailscale`.
