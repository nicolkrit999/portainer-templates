services:
  cardyo:
    image: ghcr.io/kyaustad/cardyo:latest
    container_name: cardyo
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.cardyo.rule: "Host(`${CARDYO_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.cardyo.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.cardyo.tls: "true"
      traefik.http.routers.cardyo.service: "cardyo"
      traefik.http.routers.cardyo.middlewares: "hsts-headers@docker"
      traefik.http.routers.cardyo-tailnet.rule: "Host(`${CARDYO_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.cardyo-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.cardyo-tailnet.tls: "true"
      traefik.http.routers.cardyo-tailnet.service: "cardyo"
      traefik.http.routers.cardyo-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.cardyo.loadbalancer.server.port: "3000"
      traefik.docker.network: "traefik-proxy"

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
