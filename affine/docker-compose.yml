services:
  affine:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      affine_migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/3010' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    volumes:
      - /volume2/docker/affine/config:/root/.affine/config:rw
      - /volume2/docker/affine/storage:/root/.affine/storage:rw
    environment:
      AFFINE_REVISION: "stable"
      AFFINE_INDEXER_ENABLED: "false"
      PORT: "3010"
      AFFINE_SERVER_HTTPS: "true"
      AFFINE_SERVER_EXTERNAL_URL: "${AFFINE_EXTERNAL_URL}"
      MAILER_HOST: "smtp.gmail.com"
      MAILER_PORT: "465"
      MAILER_USER: "${AFFINE_MAILER_USER}"
      MAILER_PASSWORD: "${AFFINE_MAILER_PASSWORD}"
      MAILER_SENDER: "Affine"
      REDIS_SERVER_HOST: "redis"
      DATABASE_URL: "${AFFINE_DATABASE_URL}"
      NODE_ENV: "production"
      AFFINE_ADMIN_EMAIL: "${AFFINE_ADMIN_EMAIL}"
      AFFINE_ADMIN_PASSWORD: "${AFFINE_ADMIN_PASSWORD}"
      TZ: "${TZ}"
    labels:
      traefik.enable: "true"
      traefik.http.routers.affine.rule: "Host(`${AFFINE_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.affine.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.affine.tls: "true"
      traefik.http.routers.affine.tls.certresolver: "cf_dns"
      # SAN-bundle (group "productivity-creative", anchor router): this router
      # is the anchor for a single multi-SAN Let's Encrypt certificate
      # covering 11 low-traffic services, to stay under LE's 50-certs/168h
      # rate limit that Traefik previously hit issuing near-one cert per
      # router. Mechanism is per-router tls.domains labels (the correct
      # approach) - NOT resolver-level CLI flags on Traefik's own
      # container/config, which crashed Traefik once already
      # ("field not found, node: domains") and was reverted.
      # Once this router obtains the cert, every other router below is
      # covered automatically via the SAN list - those routers need no label
      # changes at all.
      # Bundled hostnames (this anchor + 10 others): affine, draw-io,
      # excalidraw, fossflow, opennotebook, paperlessngx (rule label uses
      # PAPERLESS_SUBDOMAIN), linkwarden, holyclaude (currently deployed at
      # hostname "holyclaude", not "claude" - see note below), blender,
      # lifeglance, ghost (rule label uses GHOST_SUBDOMAIN, default "blog").
      traefik.http.routers.affine.tls.domains[0].main: "${AFFINE_SUBDOMAIN}.${DOMAIN}"
      traefik.http.routers.affine.tls.domains[0].sans: "${DRAWIO_SUBDOMAIN}.${DOMAIN},${EXCALIDRAW_SUBDOMAIN}.${DOMAIN},${FOSSFLOW_SUBDOMAIN}.${DOMAIN},${OPENNOTEBOOK_SUBDOMAIN}.${DOMAIN},${PAPERLESS_SUBDOMAIN}.${DOMAIN},${LINKWARDEN_SUBDOMAIN}.${DOMAIN},${HOLYCLAUDE_SUBDOMAIN}.${DOMAIN},${BLENDER_SUBDOMAIN}.${DOMAIN},${LIFEGLANCE_SUBDOMAIN}.${DOMAIN},${GHOST_SUBDOMAIN}.${DOMAIN}"
      traefik.http.routers.affine.service: "affine"
      traefik.http.routers.affine.middlewares: "hsts-headers@docker"
      traefik.http.routers.affine-tailnet.rule: "Host(`${AFFINE_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.affine-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.affine-tailnet.tls: "true"
      traefik.http.routers.affine-tailnet.service: "affine"
      traefik.http.routers.affine-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.affine.loadbalancer.server.port: "3010"
      traefik.docker.network: "traefik-proxy"
    networks:
      - default
      - cloudflare_web_network
      - traefik_proxy_network
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  affine_migration:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine_migration
    command: ["node", "./scripts/self-host-predeploy.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /volume2/docker/affine/config:/root/.affine/config:rw
      - /volume2/docker/affine/storage:/root/.affine/storage:rw
    environment:
      REDIS_SERVER_HOST: "redis"
      DATABASE_URL: "${AFFINE_DATABASE_URL}"
      AFFINE_INDEXER_ENABLED: "false"
      TZ: "${TZ}"
    networks:
      - default
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:latest
    container_name: affine_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - /volume2/docker/affine/redis:/data:rw
    environment:
      TZ: "${TZ}"
    networks:
      - default
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: pgvector/pgvector:pg17
    container_name: affine_postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${AFFINE_DB_NAME}", "-U", "${AFFINE_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - /volume1/Default-volume-1/0001_Docker/affine/db:/var/lib/postgresql/data:rw
    environment:
      POSTGRES_USER: "${AFFINE_DB_USER}"
      POSTGRES_PASSWORD: "${AFFINE_DB_PASSWORD}"
      POSTGRES_DB: "${AFFINE_DB_NAME}"
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: "${TZ}"
    networks:
      - default
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
