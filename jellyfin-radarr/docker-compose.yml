services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_DIR}/jellyfin-radarr/config:/config
      - ${DOCKER_DATA_DIR}/jellyfin/movies:/movies
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.radarr.rule: "Host(`${RADARR_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.radarr.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.radarr.tls: "true"
      traefik.http.routers.radarr.tls.certresolver: "cf_dns"
      traefik.http.routers.radarr.service: "radarr"
      traefik.http.services.radarr.loadbalancer.server.port: "7878"
      traefik.docker.network: "traefik-proxy"
    restart: unless-stopped

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
