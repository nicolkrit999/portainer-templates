services:
  server:
    image: docker.gitea.com/gitea:28.3.0
    container_name: gitea
    cpu_shares: 2048
    environment:
      USER_UID: "${PUID}"
      USER_GID: "${PGID}"
      GITEA__server__ROOT_URL: "${GITEA_ROOT_URL}"
      GITEA__server__DOMAIN: "${GITEA_DOMAIN}"
      GITEA__server__SSH_PORT: "22"
      GITEA__server__SSH_DOMAIN: "${GITEA_SSH_DOMAIN}"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__actions__ENABLED: "false"
      GITEA__security__REVERSE_PROXY_TRUSTED_PROXIES: "${GITEA_TRUSTED_PROXIES:-172.27.0.0/16,172.16.81.0/28}"
      GITEA__security__REVERSE_PROXY_LIMIT: "1"
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA_DIR}/gitea/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
      - public_gitea_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.gitea-family.rule: "Host(`${GITEA_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.gitea-family.entrypoints: "${TRAEFIK_ENTRYPOINT_1}"
      traefik.http.routers.gitea-family.tls: "true"
      traefik.http.routers.gitea-family.service: "gitea"
      traefik.http.routers.gitea-family.middlewares: "hsts-headers@docker"
      traefik.http.routers.gitea-guest.rule: "Host(`${GITEA_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.gitea-guest.entrypoints: "${TRAEFIK_ENTRYPOINT_2}"
      traefik.http.routers.gitea-guest.tls: "true"
      traefik.http.routers.gitea-guest.service: "gitea"
      traefik.http.routers.gitea-guest.middlewares: "hsts-headers@docker"
      traefik.http.routers.gitea-friends.rule: "Host(`${GITEA_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.gitea-friends.entrypoints: "${TRAEFIK_ENTRYPOINT_4}"
      traefik.http.routers.gitea-friends.tls: "true"
      traefik.http.routers.gitea-friends.service: "gitea"
      traefik.http.routers.gitea-friends.middlewares: "hsts-headers@docker"
      traefik.http.services.gitea.loadbalancer.server.port: "3000"
      traefik.http.routers.gitea-private.rule: "Host(`${GITEA_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.gitea-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.gitea-private.tls: "true"
      traefik.http.routers.gitea-private.service: "gitea-private"
      traefik.http.routers.gitea-private.middlewares: "hsts-headers@docker"
      traefik.http.services.gitea-private.loadbalancer.server.port: "3000"
      traefik.docker.network: "traefik-proxy"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
  # Backend network of the public Traefik; the traefik-public stack must be deployed first.
  public_gitea_network:
    name: public-gitea
    external: true
