services:
  server:
    image: docker.gitea.com/gitea:28.3.0
    container_name: gitea
    cpu_shares: 2048
    environment:
      USER_UID: "${PUID}"
      USER_GID: "${PGID}"
      GITEA__server__ROOT_URL: "${GITEA_ROOT_URL}"
      GITEA__server__DOMAIN: "${GITEA_DOMAIN}"
      # Explicit false: the image persists env settings into app.ini, so merely removing the
      # old DISABLE_SSH=true leaves SSH disabled.
      GITEA__server__DISABLE_SSH: "false"
      # Git over SSH is private only: published on the NAS as ${GITEA_SSH_HOST_PORT:-2222}
      # (port 22 is the NAS's own sshd), reached at gitea-ssh.${DOMAIN}, which the LAN and
      # tailnet resolvers point at the NAS. The UniFi gateway never forwards it to the internet.
      GITEA__server__SSH_DOMAIN: "gitea-ssh.${DOMAIN}"
      GITEA__server__SSH_PORT: "${GITEA_SSH_HOST_PORT:-2222}"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__actions__ENABLED: "true"
      GITEA__security__REVERSE_PROXY_TRUSTED_PROXIES: "${GITEA_TRUSTED_PROXIES:-172.27.0.0/16,172.16.81.0/28}"
      GITEA__security__REVERSE_PROXY_LIMIT: "1"
    restart: unless-stopped
    ports:
      - "${GITEA_SSH_HOST_PORT:-2222}:22"
    volumes:
      - ${DOCKER_DATA_DIR}/gitea/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - traefik_proxy_network
      - public_gitea_network
      - gitea_backend_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.gitea-private.rule: "Host(`${GITEA_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.gitea-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.gitea-private.tls: "true"
      traefik.http.routers.gitea-private.service: "gitea-private"
      traefik.http.routers.gitea-private.middlewares: "hsts-headers@docker"
      traefik.http.routers.gitea-tailnet.rule: "Host(`${GITEA_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.gitea-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.gitea-tailnet.tls: "true"
      traefik.http.routers.gitea-tailnet.service: "gitea-private"
      traefik.http.routers.gitea-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.gitea-private.loadbalancer.server.port: "3000"
      traefik.docker.network: "traefik-proxy"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  act_runner:
    image: gitea/act_runner:0.6.1
    container_name: gitea-act-runner
    cpus: 2.0
    environment:
      TZ: "${TZ}"
      # Internal address of the Gitea container, not through Traefik.
      GITEA_INSTANCE_URL: "http://gitea:3000"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${GITEA_RUNNER_REGISTRATION_TOKEN}"
      GITEA_RUNNER_NAME: "${GITEA_RUNNER_NAME:-nas-runner}"
      GITEA_RUNNER_LABELS: "ubuntu-latest:docker://gitea/runner-images:ubuntu-latest,ubuntu-22.04:docker://gitea/runner-images:ubuntu-22.04"
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ${DOCKER_DATA_DIR}/gitea/runner:/data
      # Gives workflow jobs control of the host Docker daemon (root-equivalent); only run trusted workflows.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gitea_backend_network
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f act_runner || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
  # Backend network of the public Traefik; the traefik-public stack must be deployed first.
  public_gitea_network:
    name: public-gitea
    external: true
  # Stack-private network for gitea and its runner (172.16.109.0/28 allocated for this stack).
  gitea_backend_network:
    name: gitea-backend
    ipam:
      config:
        - subnet: "${GITEA_BACKEND_SUBNET:-172.16.109.0/28}"
          gateway: "${GITEA_BACKEND_GATEWAY:-172.16.109.1}"
          ip_range: "${GITEA_BACKEND_IP_RANGE:-172.16.109.8/29}"
