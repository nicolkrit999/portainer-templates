services:
  unpoller:
    image: ghcr.io/unpoller/unpoller:v5.2.2
    container_name: unpoller
    cpus: 4.0
    restart: always
    # Internal-only backing service: no Cloudflare/Traefik network, no
    # public hostname, no labels. Reached only by prometheus over
    # monitoring_network. See .claude/rules/networking.md's internal-only
    # exception to Rule 2.
    environment:
      UP_UNIFI_CONTROLLER_0_URL: "${UNIFI_CONTROLLER_URL}"
      UP_UNIFI_CONTROLLER_0_USER: "${UNIFI_POLLER_USER}"
      UP_UNIFI_CONTROLLER_0_PASS: "${UNIFI_POLLER_PASSWORD}"
      UP_UNIFI_CONTROLLER_0_VERIFY_SSL: "false"
      # Controller-side Traffic Identification (Threat Management ->
      # Identification) being on is NOT enough on its own - unpoller has its
      # own separate poller-side flag to actually request/export DPI stats.
      # Without this, unpoller_site_dpi_* never appears even with a fully
      # DPI-capable controller. Confirmed real gap 2026-09-09 (empty DPI
      # metrics despite controller Identification already being on).
      UP_UNIFI_CONTROLLER_0_SAVE_DPI: "true"
      # InfluxDB output is on by default and nothing listens on 127.0.0.1:8086:
      # every write failed and the image's built-in healthcheck (`unpoller --health`
      # validates every enabled output) reported unhealthy for weeks. Only the
      # Prometheus output is used.
      UP_INFLUXDB_DISABLE: "true"
      UP_PROMETHEUS_HTTP_LISTEN: "0.0.0.0:9130"
      UP_PROMETHEUS_NAMESPACE: "unpoller"
      TZ: "${TZ}"
    # Healthcheck: the image ships its own (`/usr/bin/unpoller --health`, no shell
    # needed). It passes only while every enabled output is reachable, hence
    # UP_INFLUXDB_DISABLE above. Prometheus also scrapes http://unpoller:9130/metrics.
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring_network

networks:
  monitoring_network:
    name: monitoring-net
    external: true
