services:
  duplicati:
    image: duplicati/duplicati:canary
    container_name: duplicati
    restart: always
    ports:
      - "127.0.0.1:${DUPLICATI_HOST_PORT}:8200"
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    user: "0:0"
    privileged: true

    labels:
      traefik.enable: "true"
      traefik.http.routers.duplicati.rule: "Host(`${DUPLICATI_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.duplicati.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.duplicati.tls: "true"
      traefik.http.routers.duplicati.tls.certresolver: "cf_dns"
      # SAN-bundle (group "utilities", anchor router): this router is the
      # anchor for a single multi-SAN Let's Encrypt certificate covering 20
      # low-traffic utility services, to stay under LE's 50-certs/168h rate
      # limit that Traefik previously hit issuing near-one cert per router.
      # Mechanism is per-router tls.domains labels (the correct approach) -
      # NOT resolver-level CLI flags on Traefik's own container/config,
      # which crashed Traefik once already ("field not found, node:
      # domains") and was reverted. Once this router obtains the cert,
      # every other router below is covered automatically via the SAN
      # list - those routers need no label changes at all.
      # Bundled hostnames (this anchor + 19 others): duplicati (this host),
      # it-tools, omnitools, convertx, stirling-pdf, change-detection,
      # filebrowser, snapotter, moocup, withoutbg, cardyo, datetime,
      # termix, snappyemail, owncloud, miniqr, privatebin, bytestash,
      # openresume, sosse.
      traefik.http.routers.duplicati.tls.domains[0].main: "${DUPLICATI_SUBDOMAIN}.${DOMAIN}"
      traefik.http.routers.duplicati.tls.domains[0].sans: "${IT_TOOLS_SUBDOMAIN}.${DOMAIN},${OMNI_TOOLS_SUBDOMAIN}.${DOMAIN},${CONVERTX_SUBDOMAIN}.${DOMAIN},${STIRLING_PDF_SUBDOMAIN}.${DOMAIN},${CHANGE_DETECTION_SUBDOMAIN}.${DOMAIN},${FILEBROWSER_SUBDOMAIN}.${DOMAIN},${SNAPOTTER_SUBDOMAIN}.${DOMAIN},${MOOCUP_SUBDOMAIN}.${DOMAIN},${WITHOUTBG_SUBDOMAIN}.${DOMAIN},${CARDYO_SUBDOMAIN}.${DOMAIN},${DATETIME_SUBDOMAIN}.${DOMAIN},${TERMIX_SUBDOMAIN}.${DOMAIN},${SNAPPYEMAIL_SUBDOMAIN}.${DOMAIN},${OWNCLOUD_SUBDOMAIN}.${DOMAIN},${MINI_QR_SUBDOMAIN}.${DOMAIN},${PRIVATEBIN_SUBDOMAIN}.${DOMAIN},${BYTESTASH_SUBDOMAIN}.${DOMAIN},${OPENRESUME_SUBDOMAIN}.${DOMAIN},${SOSSE_SUBDOMAIN}.${DOMAIN}"
      traefik.http.routers.duplicati.service: "duplicati"
      traefik.http.routers.duplicati.middlewares: "hsts-headers@docker"
      traefik.http.services.duplicati.loadbalancer.server.port: "8200"
      traefik.docker.network: "traefik-proxy"

    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
      - SETTINGS_ENCRYPTION_KEY=${DUPLICATI_SETTINGS_ENCRYPTION_KEY}
      - DUPLICATI__WEBSERVICE_PASSWORD=${DUPLICATI_WEBSERVICE_PASSWORD}

      - DUPLICATI__WEBSERVICE_INTERFACE=0.0.0.0
      - DUPLICATI__WEBSERVICE_ALLOWED_HOSTNAMES=*

    volumes:
      - ${DOCKER_CONFIG_DIR}/duplicati/config:/data
      - ${DUPLICATI_HOME_SOURCE}:/home_ro:ro
      - ${DUPLICATI_SOURCE1}:/source1:ro
      - ${DUPLICATI_SOURCE2}:/source2:ro
      - ${DUPLICATI_RESTORE_TEMP}:/restore_temp:rw
      - /etc/localtime:/etc/localtime:ro

    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/8200' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
