services:
  openspeedtest:
    image: openspeedtest/latest:v2.0.6
    container_name: OpenSpeedTest
    restart: on-failure:5
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik_proxy_network

    labels:
      traefik.enable: "true"
      traefik.http.routers.openspeedtest.rule: "Host(`${OPENSPEEDTEST_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.openspeedtest.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.openspeedtest.tls: "true"
      traefik.http.routers.openspeedtest.service: "openspeedtest"
      traefik.http.routers.openspeedtest.middlewares: "hsts-headers@docker"




      traefik.http.routers.openspeedtest-tailnet.rule: "Host(`${OPENSPEEDTEST_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.openspeedtest-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.openspeedtest-tailnet.tls: "true"
      traefik.http.routers.openspeedtest-tailnet.service: "openspeedtest"
      traefik.http.routers.openspeedtest-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"

      traefik.http.services.openspeedtest.loadbalancer.server.port: "3000"
      traefik.docker.network: "traefik-proxy"

    environment:
      TZ: "${TZ}"
      SET_USER: "${PUID}"
      SET_SERVER_NAME: "${OPENSPEEDTEST_SERVER_NAME}"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
