services:
  # TAILNET-FACING SIBLING of ../dnsmasq/docker-compose.yml - same image, same
  # network_mode: host pattern. It answers DNS for devices on the tailnet.
  #
  # Every hostname under the domain resolves to the admin node's tailnet IP
  # (${TAILSCALE_ADMIN_IP}, the merged ../tailscale-admin_traefik-tailnet-forwarder/
  # stack), which fronts Traefik's tailnet-admin entrypoint (TRAEFIK_ENTRYPOINT_7)
  # behind the tailnet-admin-only allowlist. Traffic arrives directly on the
  # tailnet interface, so the NAS never has to hairpin back to its own LAN IP
  # (the original reason this separate instance exists). ${TAILNET_IP}, the
  # primary node's tailnet IP, is only the address this resolver listens on.
  #
  # Deliberately NOT attached to traefik-proxy: this is a raw DNS (port 53)
  # service, not HTTP, and is not meant to be reachable through the proxy.
  #
  # restart: always - the household's tailnet DNS depends on it; it must come
  # back automatically after a host reboot or crash.
  dnsmasq-tailnet:
    image: 4km3/dnsmasq:2.90-r3
    container_name: dnsmasq-tailnet
    cpu_shares: 4096
    network_mode: host
    restart: always
    cap_add:
      - NET_ADMIN
    # ENTRYPOINT of this image is already ["/usr/sbin/dnsmasq", "--keep-in-foreground"];
    # command: here is appended as extra dnsmasq CLI args, not a replacement.
    command:
      - "--address=/${DNS_WILDCARD_DOMAIN}/${TAILSCALE_ADMIN_IP}"
      # Git over SSH is not HTTP, so it bypasses the admin gateway: Gitea publishes it on
      # the NAS itself, so this one name resolves to the NAS's own tailnet IP.
      - "--address=/gitea-ssh.${DNS_WILDCARD_DOMAIN}/${TAILNET_IP}"
      - "--log-facility=-"
      # Per-query logging, added 2026-08-23 during the 2026-08 tailnet ACL
      # rollout (the family/friends tiers were retired 2026-11-03) to diagnose a remote tailnet client's DNS queries never
      # reaching this interface at all (tcpdump on tailscale0 showed zero
      # packets). Kept on permanently rather than toggled per-incident -
      # it's one line per query per tailnet client, acceptable at this
      # household's scale, and having it always available avoids a
      # redeploy-just-to-debug round trip next time something like this
      # comes up.
      - "--log-queries"
      # --listen-address + --bind-interfaces here binds specifically to the
      # NAS's tailnet IP instead of wildcard-binding port 53, which would
      # otherwise collide with the original dnsmasq's own bind to
      # DNS_TARGET_IP (the LAN IP) - the same non-collision pattern the
      # original already uses to avoid colliding with systemd-resolved's
      # loopback bind.
      - "--listen-address=${TAILNET_IP}"
      - "--bind-interfaces"
      # Same reasoning as the original: this resolver only ever answers for
      # ${DNS_WILDCARD_DOMAIN}, so filtering these record types globally is
      # safe here. Without this, AAAA/HTTPS/SVCB queries fall through to the
      # real upstream and leak Cloudflare's actual public edge (IPv6
      # address, ECH config, etc.) even though the A record is correctly
      # overridden - defeating the point of this override for
      # IPv6-preferring clients.
      - "--filter-AAAA"
      - "--filter-rr=HTTPS"
      - "--filter-rr=SVCB"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
