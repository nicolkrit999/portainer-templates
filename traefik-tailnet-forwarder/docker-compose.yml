services:
  # TAILNET-FACING SIBLING of ../traefik-private-forwarder/docker-compose.yml -
  # same overall purpose (a narrow TCP-passthrough sidecar so a client reaches
  # Traefik's private tier at a clean `hostname:443` URL without Traefik's own
  # container needing a second network bind), but this instance exists to
  # solve a DIFFERENT problem than the LAN macvlan sidecar: Tailscale's
  # `tailscale0` interface is a TUN device, not a real L2 NIC, so macvlan
  # (which requires attaching to a physical/bridge parent interface) cannot
  # be used here at all. This sidecar instead uses network_mode: host so it
  # can bind directly to the Tailscale node's own IP.
  #
  # Root cause this fixes (confirmed 2026-08-22): Traefik's tailnet-admin-only
  # ipallowlist middleware rejects legitimate Tailscale-sourced requests
  # because Docker's userland-proxy (docker-proxy) rewrites the connection's
  # source IP to a Docker bridge gateway address before Traefik ever sees it
  # - this affects every published port on Traefik's own container, including
  # the shared family entrypoint the admin-only tailnet routers currently sit
  # on. Routing tailnet traffic through this host-networked sidecar instead
  # means the real client IP never passes through docker-proxy's NAT at all;
  # it is preserved end-to-end via the PROXY protocol (see the send-proxy-v2
  # directive in haproxy.cfg, and the matching
  # --entryPoints.${TRAEFIK_ENTRYPOINT_7}.proxyProtocol.trustedIPs flag in
  # ../traefik/docker-compose.yml) instead of being inferred from the raw TCP
  # source.
  #
  # UPDATED 2026-08-22: this stack no longer uses network_mode: host at all.
  # host mode put this container in the SAME network namespace as the host
  # itself - which is also where Traefik's own docker-proxy already
  # wildcard-binds 0.0.0.0:443 for the family entrypoint - so a wildcard
  # bind and this sidecar's specific-IP bind collided on the same port in
  # that shared namespace (confirmed live). Host mode never gave real
  # isolation; it just happened to reach the Tailscale interface.
  #
  # The actual fix: ../tailscale-admin/docker-compose.yml is a SECOND,
  # independent Tailscale identity/node (not the primary one in
  # ../tailscale/) using ORDINARY (non-host) Docker networking. This
  # service now joins THAT container's network namespace via
  # `network_mode: service:tailscale-admin` instead of network_mode: host -
  # a real, isolated namespace, separate from both the host's and
  # Traefik's, with zero collision risk against Traefik's wildcard
  # listener. A service using network_mode: service:X cannot also declare
  # its own `networks:` block - traefik-proxy attachment lives on
  # tailscale-admin instead, and this service reaches Traefik's container
  # via the same STATIC IP as before (${TRAEFIK_INTERNAL_IP}, set on
  # Traefik's own container in ../traefik/docker-compose.yml) since it has
  # no DNS resolution of its own in a shared, non-default-bridge namespace.
  #
  # NOTE: the TAILSCALE_IP env var below now refers to tailscale-admin's
  # own tailnet IP (a NEW node, assigned once tailscale-admin is deployed
  # and approved in the admin console) - NOT the primary node's IP used
  # here previously. The haproxy.cfg file already on the NAS filesystem at
  # ${VOLUME_CONFIG}/traefik-tailnet-forwarder/haproxy.cfg was generated
  # with the OLD (primary node's) IP baked in, and haproxy-config-init only
  # writes that file if it's missing - it will NOT self-correct. Whoever
  # redeploys this stack next must either delete that stale file first (so
  # the init container regenerates it with the new TAILSCALE_IP) or hand-
  # edit it, once tailscale-admin's real IP is known.
  #
  # Unlike socat (used by the LAN sidecar), HAProxy cannot be driven by a
  # bare command: one-liner for this job - PROXY protocol injection needs a
  # real config file. haproxy.cfg (bind-mounted below) must contain:
  #
  #   global
  #       log stdout format raw local0
  #
  #   defaults
  #       mode tcp
  #       timeout connect 5s
  #       timeout client 30s
  #       timeout server 30s
  #       log global
  #
  #   frontend tailnet_admin_in
  #       bind ${TAILSCALE_IP}:443
  #       default_backend traefik_admin
  #
  #   backend traefik_admin
  #       server traefik ${TRAEFIK_INTERNAL_IP}:${TRAEFIK_PORT_7} send-proxy-v2
  #
  # HAProxy config files do NOT support ${VAR} shell-style interpolation at
  # runtime - the placeholders above are real, literal values. Substitution
  # is handled automatically by the haproxy-config-init service below (a
  # one-shot init container, same pattern as ../traefik/docker-compose.yml's
  # fix-permissions service), which writes haproxy.cfg to the host
  # filesystem at ${VOLUME_CONFIG}/traefik-tailnet-forwarder/haproxy.cfg the
  # first time it's missing (fresh deploy, wiped volume, etc.) and leaves it
  # untouched on every subsequent run so manual edits are never clobbered.
  #
  # Deliberately NOT attached to cloudflare-web (not tunnel-reachable - same
  # reasoning as traefik-private-forwarder) and has no Traefik router labels
  # of its own (pure infrastructure, not a routed application).
  haproxy-config-init:
    image: alpine:latest
    container_name: traefik-tailnet-forwarder-init
    restart: "no"
    environment:
      TAILSCALE_IP: "${TAILSCALE_IP}"
      TRAEFIK_INTERNAL_IP: "${TRAEFIK_INTERNAL_IP}"
      TRAEFIK_PORT_7: "${TRAEFIK_PORT_7}"
    volumes:
      - ${VOLUME_CONFIG}/traefik-tailnet-forwarder:/target
    command:
      - "sh"
      - "-c"
      - "if [ -f /target/haproxy.cfg ]; then echo \"haproxy.cfg already exists, skipping\"; else mkdir -p /target && cat > /target/haproxy.cfg << EOF\nglobal\n    log stdout format raw local0\n\ndefaults\n    mode tcp\n    timeout connect 5s\n    timeout client 30s\n    timeout server 30s\n    log global\n\nfrontend tailnet_admin_in\n    bind $TAILSCALE_IP:443\n    default_backend traefik_admin\n\nbackend traefik_admin\n    server traefik $TRAEFIK_INTERNAL_IP:$TRAEFIK_PORT_7 send-proxy-v2\nEOF\nchmod 644 /target/haproxy.cfg; fi; cat /target/haproxy.cfg"

  traefik-tailnet-forwarder:
    image: haproxy:alpine
    container_name: traefik-tailnet-forwarder
    # Joins tailscale-admin's network namespace (see the top-of-file comment
    # block for the full rationale) instead of binding to the host's own
    # namespace directly - tailscale0 is a TUN device, not a
    # macvlan-attachable L2 NIC, so the LAN sidecar's macvlan approach still
    # cannot be used here, but this now gets a genuinely isolated namespace
    # rather than sharing the host's. Uses the raw Docker `container:<name>`
    # form, NOT Compose's `service:<name>` sugar - `service:` only resolves
    # within the SAME compose project/file, and tailscale-admin is a
    # separate Portainer stack entirely; `container:<name>` references any
    # live container by its actual name regardless of which stack created
    # it, which is what's needed here. Depends on tailscale-admin's
    # container_name staying exactly "tailscale-admin" - if that's ever
    # renamed, this must be updated to match. A service using
    # network_mode: container:X cannot also declare a `networks:` block -
    # do not add traefik-proxy here (it lives on tailscale-admin instead).
    network_mode: "container:tailscale-admin"
    # user: "0:0" (running haproxy as root) is no longer needed: haproxy's
    # su-exec-based drop to a non-root user previously failed to bind port
    # 443 even with cap_add: NET_BIND_SERVICE (confirmed live - that
    # capability doesn't reliably survive haproxy:alpine's internal user
    # switch). Now that this container shares tailscale-admin's namespace,
    # which sets net.ipv4.ip_unprivileged_port_start=0 on that namespace,
    # any non-root process here can bind port 443 without elevated
    # privileges or capabilities - the clean fix instead of the workaround.
    volumes:
      - ${VOLUME_CONFIG}/traefik-tailnet-forwarder/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    # Critical-path for all tailnet admin access (same criticality tier as
    # Traefik itself, which also uses restart: always) - must come back
    # after a host reboot unconditionally, not just after a crash.
    restart: always
    # tailscale-admin (../tailscale-admin/docker-compose.yml) is a SEPARATE
    # Portainer stack/compose project - it CANNOT be listed under
    # depends_on here (Compose validates depends_on entries against
    # services declared in this SAME file and errors on an undefined
    # reference; this is a real deploy-blocking validation error, not just
    # an unenforced hint). The real runtime dependency still exists and
    # must be honored manually: deploy/redeploy tailscale-admin's stack
    # FIRST and confirm it's healthy (this container cannot start at all
    # otherwise - network_mode: container:tailscale-admin requires that
    # container to already exist) before deploying or redeploying this one.
    depends_on:
      haproxy-config-init:
        condition: service_completed_successfully
    healthcheck:
      # HAProxy alpine images don't reliably ship nc/curl, so this validates
      # config syntax only (`haproxy -c -f ...`) rather than live
      # connectivity - unlike the LAN sidecar's nc-based reachability check.
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
