services:
  omnitools:
    image: iib0011/omni-tools:latest
    container_name: omni-tools
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.omni-tools.rule: "Host(`${OMNI_TOOLS_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.omni-tools.entrypoints: "${TRAEFIK_ENTRYPOINT_1}"
      traefik.http.routers.omni-tools.tls: "true"
      traefik.http.routers.omni-tools.service: "omni-tools"
      traefik.http.routers.omni-tools.middlewares: "hsts-headers@docker"
      traefik.http.services.omni-tools.loadbalancer.server.port: "80"
      traefik.http.routers.omni-tools-private.rule: "Host(`${OMNI_TOOLS_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.omni-tools-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.omni-tools-private.tls: "true"
      traefik.http.routers.omni-tools-private.service: "omni-tools-private"
      traefik.http.routers.omni-tools-private.middlewares: "hsts-headers@docker"
      traefik.http.services.omni-tools-private.loadbalancer.server.port: "80"
      traefik.docker.network: "traefik-proxy"

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
