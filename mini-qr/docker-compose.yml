services:
  mini-qr:
    image: ghcr.io/lyqht/mini-qr:latest
    container_name: mini-qr
    restart: unless-stopped
    networks:
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.mini-qr-private.rule: "Host(`${MINI_QR_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.mini-qr-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.mini-qr-private.tls: "true"
      traefik.http.routers.mini-qr-private.service: "mini-qr"
      traefik.http.routers.mini-qr-private.middlewares: "hsts-headers@docker"
      traefik.http.services.mini-qr.loadbalancer.server.port: "8080"
      traefik.http.routers.mini-qr-tailnet.rule: "Host(`${MINI_QR_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.mini-qr-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.mini-qr-tailnet.tls: "true"
      traefik.http.routers.mini-qr-tailnet.service: "mini-qr"
      traefik.http.routers.mini-qr-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.docker.network: "traefik-proxy"

networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
