services:
  icorsi-notes:
    build: .
    image: icorsi-notes:local
    pull_policy: build
    container_name: icorsi-notes
    restart: unless-stopped

    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined

    # NOTE: ANTHROPIC_API_KEY is intentionally absent - see README
    environment:
      TZ: "${TZ}"
      OPENCLOUD_WEBDAV_URL: "${OPENCLOUD_WEBDAV_URL}"
      OPENCLOUD_USER: "${OPENCLOUD_USER}"
      OPENCLOUD_APP_PASSWORD: "${OPENCLOUD_APP_PASSWORD}"
      OPENCLOUD_HOST_HEADER: "${OPENCLOUD_HOST_HEADER:-}"
      OPENCLOUD_BASE_PATH: "${OPENCLOUD_BASE_PATH}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
      NOTES_INTERVAL_SECONDS: "${NOTES_INTERVAL_SECONDS:-21600}"
      LIMIT_BACKOFF_SECONDS: "${LIMIT_BACKOFF_SECONDS:-3600}"
      ACTIVE_HOURS: "${ACTIVE_HOURS:-00:00-03:00}"
      MIN_TASK_WINDOW_SECONDS: "${MIN_TASK_WINDOW_SECONDS:-1800}"
      WINDOW_GRACE_MINUTES: "${WINDOW_GRACE_MINUTES:-10}"
      RUN_ON_START: "${RUN_ON_START:-true}"
      DRY_RUN: "${DRY_RUN:-false}"
      COST_CIRCUIT_BREAKER: "${COST_CIRCUIT_BREAKER:-true}"
      CLAUDE_MODEL: "${CLAUDE_MODEL:-}"

    volumes:
      - "${DOCKER_CONFIG_DIR}/icorsi-notes/data:/data"
      - "${DOCKER_CONFIG_DIR}/icorsi-notes/claude:/root/.claude"

    networks:
      - cloudflare_web_network

    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
