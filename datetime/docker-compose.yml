services:
  datetime_app:
    container_name: datetime
    image: ghcr.io/airyland/datetime.app:latest
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.datetime_app.rule: "Host(`${DATETIME_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.datetime_app.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.datetime_app.tls: "true"
      traefik.http.routers.datetime_app.tls.certresolver: "cf_dns"
      traefik.http.routers.datetime_app.service: "datetime_app"
      traefik.http.routers.datetime_app.middlewares: "hsts-headers@docker"
      traefik.http.services.datetime_app.loadbalancer.server.port: "3000"
      traefik.docker.network: "traefik-proxy"
    networks:
      - cloudflare_web_network
      - traefik_proxy_network

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
