name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    cpu_shares: 2048
    user: "${PUID}:${PGID}"
    devices:
      - /dev/dri:/dev/dri
    group_add: ["105"]
    security_opt: ["no-new-privileges:true"]
    environment:
      - IMMICH_HOST=0.0.0.0
      - HOST=0.0.0.0
      - NODE_ENV=production
      - PUBLIC_IMMICH_SERVER_URL=${PUBLIC_IMMICH_SERVER_URL}

      - DB_HOSTNAME=database
      - DB_USERNAME=immich
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich_redis

    volumes:
      - "${UPLOAD_LOCATION}:/data"
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    networks:
      - traefik_proxy_network
      - public_apps_network
      - immich_backend_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.immich-private.rule: "Host(`${IMMICH_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.immich-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.immich-private.tls: "true"
      traefik.http.routers.immich-private.service: "immich-private"
      traefik.http.routers.immich-private.middlewares: "hsts-headers@docker"
      traefik.http.routers.immich-tailnet.rule: "Host(`${IMMICH_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.immich-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7:-tailnet-admin}"
      traefik.http.routers.immich-tailnet.tls: "true"
      traefik.http.routers.immich-tailnet.service: "immich-private"
      traefik.http.routers.immich-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.immich-private.loadbalancer.server.port: "2283"
      traefik.docker.network: "traefik-proxy"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2283/api/server/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 2m


  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-openvino
    cpus: 4.0
    # Pinned away from core 5, leaving it reachable by AdGuard's DNS chain
    # under contention - part of the 2026-09-08 DNS relay fix (repo-wide
    # cpuset sweep was rejected as too much blast radius; just the known
    # hogs instead). See adguard/INCIDENT-2026-09-08-dns-relay-outage.md.
    cpuset: "0-4"
    user: "${PUID}:${PGID}"
    devices:
      - /dev/dri:/dev/dri
    group_add: ["105"]
    environment:
      - DB_HOSTNAME=database
      - DB_USERNAME=immich
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich_redis
      - MPLCONFIGDIR=/cache/matplotlib
      - HF_HOME=/cache
    volumes:
      - ${DOCKER_DATA_DIR}/immich/model-cache:/cache
      - "${UPLOAD_LOCATION}:/data"
    restart: always
    networks:
      - immich_backend_network
      - immich_ml_egress_network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect(('127.0.0.1', 3003)); s.close()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 2m

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    volumes:
      - ${DOCKER_CONFIG_DIR}/immich/redis:/data
    restart: always
    networks:
      - immich_backend_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:c44be5f2871c59362966d71eab4268170eb6f5653c0e6170184e72b38ffdf107
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=immich
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    networks:
      - immich_backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1m

networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
  # Backend network of the public Traefik; the traefik-public stack must be deployed first.
  public_apps_network:
    name: public-apps
    external: true
  # Created by this stack. internal: true gives it no default route and no egress, so the
  # database, redis and machine-learning containers cannot reach the internet or other stacks.
  immich_backend_network:
    name: immich-backend
    internal: true
  # Created by this stack. Machine-learning downloads models from the internet; it gets its own
  # non-internal network instead of a shared one.
  immich_ml_egress_network:
    name: immich-ml-egress
