services:
  convertx:
    image: ghcr.io/c4illin/convertx:latest
    container_name: Convertx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: "${TZ}"
      JWT_SECRET: "${JWT_SECRET}"
      ACCOUNT_REGISTRATION: "false"
      HTTP_ALLOWED: "true"
      ALLOW_UNAUTHENTICATED: "false"
    ports:
      - "${CONVERTX_HOST_PORT}:3000"
    volumes:
      - ${DOCKER_DATA_DIR}/convertx:/app/data:rw
    labels:
      traefik.enable: "true"
      traefik.http.routers.convertx.rule: "Host(`${CONVERTX_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.convertx.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.convertx.tls: "true"
      traefik.http.routers.convertx.service: "convertx"
      traefik.http.routers.convertx.middlewares: "hsts-headers@docker"
      traefik.http.routers.convertx-tailnet.rule: "Host(`${CONVERTX_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.convertx-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.convertx-tailnet.tls: "true"
      traefik.http.routers.convertx-tailnet.service: "convertx"
      traefik.http.routers.convertx-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.convertx.loadbalancer.server.port: "3000"
      traefik.docker.network: "traefik-proxy"
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
