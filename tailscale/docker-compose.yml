services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    network_mode: host
    privileged: true
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.forwarding=1
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--advertise-routes=${TAILSCALE_ADVERTISE_ROUTES}
    volumes:
      - ${DOCKER_CONFIG_DIR}/tailscale/state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
