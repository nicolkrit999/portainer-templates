services:
  actual_server:
    image: actualbudget/actual-server:26.11.0
    container_name: ActualBudget
    restart: always
    environment:
      TZ: "${TZ}"
      ACTUAL_USER_CREATION_MODE: "manual"
      ACTUAL_OPENID_ENFORCE: "true"
      ACTUAL_TRUSTED_PROXIES: "${ACTUAL_TRUSTED_PROXIES:-172.16.93.2}"
    healthcheck:
      test: ["CMD", "node", "scripts/health-check.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ${DOCKER_CONFIG_DIR}/actual-budget/actual-data:/data
    networks:
      - traefik_proxy_network
      - public_budget_network
      - actual_backend_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.actual-budget-private.rule: "Host(`${ACTUAL_BUDGET_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.actual-budget-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.actual-budget-private.tls: "true"
      traefik.http.routers.actual-budget-private.service: "actual-budget-private"
      traefik.http.routers.actual-budget-private.middlewares: "hsts-headers@docker"
      traefik.http.routers.actual-budget-tailnet.rule: "Host(`${ACTUAL_BUDGET_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.actual-budget-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.actual-budget-tailnet.tls: "true"
      traefik.http.routers.actual-budget-tailnet.service: "actual-budget-private"
      traefik.http.routers.actual-budget-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.actual-budget-private.loadbalancer.server.port: "5006"
      traefik.docker.network: "traefik-proxy"

  actual_api_krit:
    image: jhonderson/actual-http-api:26.11.0
    container_name: ActualAPI-krit
    restart: always
    depends_on:
      actual_server:
        condition: service_healthy
    environment:
      PORT: "5007"
      ACTUAL_SERVER_URL: "http://ActualBudget:5006"
      ACTUAL_SERVER_PASSWORD: "${ACTUAL_SERVER_PASSWORD:?set ACTUAL_SERVER_PASSWORD}"
      API_KEY: "${ACTUAL_API_PASSWORD:?set ACTUAL_API_PASSWORD}"
      ALLOWED_BUDGET_SYNC_IDS: "${ACTUAL_API_ALLOWED_BUDGET_SYNC_IDS:-}"
      NODE_OPTIONS: "--max-old-space-size=4096"
      ACTUAL_DATA_DIR: "/data"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5007/v1/actualhttpapiversion || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ${DOCKER_CONFIG_DIR}/actual-budget/api-data:/data
    networks:
      - traefik_proxy_network
      - actual_backend_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.actual-api-krit-private.rule: "Host(`${ACTUAL_API_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.actual-api-krit-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.actual-api-krit-private.tls: "true"
      traefik.http.routers.actual-api-krit-private.service: "actual-api-krit-private"
      traefik.http.routers.actual-api-krit-private.middlewares: "hsts-headers@docker"
      traefik.http.services.actual-api-krit-private.loadbalancer.server.port: "5007"
      traefik.http.routers.actual-api-krit-tailnet.rule: "Host(`${ACTUAL_API_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.actual-api-krit-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.actual-api-krit-tailnet.tls: "true"
      traefik.http.routers.actual-api-krit-tailnet.service: "actual-api-krit-private"
      traefik.http.routers.actual-api-krit-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.docker.network: "traefik-proxy"

networks:
  actual_backend_network:
    name: actual-backend
    internal: true
    ipam:
      config:
        - subnet: "${ACTUAL_BACKEND_SUBNET:-172.16.93.16/28}"
          gateway: "${ACTUAL_BACKEND_GATEWAY:-172.16.93.17}"
          ip_range: "${ACTUAL_BACKEND_IP_RANGE:-172.16.93.24/29}"
  traefik_proxy_network:
    name: traefik-proxy
    external: true
  public_budget_network:
    name: public-budget
    external: true
