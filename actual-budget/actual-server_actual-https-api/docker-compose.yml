services:
  actual_server:
    image: actualbudget/actual-server:26.8.1
    container_name: ActualBudget
    restart: always
    environment:
      TZ: "${TZ}"
    volumes:
      - ${DOCKER_CONFIG_DIR}/actual-budget/actual-data:/data
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    ports:
      - "5006:5006"
    labels:
      traefik.enable: "true"
      # --- SAN-bundle cert (group "budgeting", 1 of 6 repo-wide groups) ---
      # Bundles this router's cert to also cover the other actual-budget
      # ecosystem hostnames (actual-ical, actual-tap, actual-api) as SANs on
      # ONE certificate, to stay under Let's Encrypt's 50-certs/168h rate
      # limit (this repo hit it requesting a near-separate cert per router
      # across ~77 hostnames). This is the CORRECT mechanism: per-router
      # `tls.domains[]` labels on a single anchor router. Do NOT reintroduce
      # resolver-level CLI flags on Traefik's own container
      # (`--certificatesresolvers.cf_dns.acme.domains[N].main=...`) - that
      # crashed Traefik outright with `field not found, node: domains` and
      # was reverted. Traefik's cert store is keyed globally by hostname, so
      # actual-ical/actual-tap/actual-api's own routers need ZERO label
      # changes to pick up this bundled cert - do not "clean up" this block
      # thinking it's redundant.
      traefik.http.routers.actual-budget.tls.domains[0].main: "${ACTUAL_BUDGET_SUBDOMAIN}.${DOMAIN}"
      traefik.http.routers.actual-budget.tls.domains[0].sans: "${ACTUAL_ICAL_SUBDOMAIN}.${DOMAIN},${ACTUAL_TAP_SUBDOMAIN}.${DOMAIN},${ACTUAL_API_SUBDOMAIN}.${DOMAIN}"
      traefik.http.routers.actual-budget.rule: "Host(`${ACTUAL_BUDGET_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.actual-budget.entrypoints: "${TRAEFIK_ENTRYPOINT_1}"
      traefik.http.routers.actual-budget.tls: "true"
      traefik.http.routers.actual-budget.tls.certresolver: "cf_dns"
      traefik.http.routers.actual-budget.service: "actual-budget"
      traefik.http.routers.actual-budget.middlewares: "hsts-headers@docker"
      traefik.http.services.actual-budget.loadbalancer.server.port: "5006"
      traefik.http.routers.actual-budget-private.rule: "Host(`${ACTUAL_BUDGET_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.actual-budget-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.actual-budget-private.tls: "true"
      traefik.http.routers.actual-budget-private.service: "actual-budget-private"
      traefik.http.routers.actual-budget-private.middlewares: "hsts-headers@docker"
      traefik.http.services.actual-budget-private.loadbalancer.server.port: "5006"
      traefik.docker.network: "traefik-proxy"

  actual_api:
    image: jhonderson/actual-http-api:26.8.1
    container_name: ActualAPI
    restart: always
    ports:
      - "5007:5007"
    environment:
      PORT: "5007"
      ACTUAL_SERVER_URL: "http://ActualBudget:5006"
      ACTUAL_SERVER_PASSWORD: "${ACTUAL_SERVER_PASSWORD}"
      API_KEY: "${ACTUAL_API_PASSWORD}"
      NODE_OPTIONS: "--max-old-space-size=4096"
      ACTUAL_DATA_DIR: "/data"
    volumes:
      - ${DOCKER_CONFIG_DIR}/actual-budget/api-data:/data
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.actual-api.rule: "Host(`${ACTUAL_API_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.actual-api.entrypoints: "${TRAEFIK_ENTRYPOINT_1}"
      traefik.http.routers.actual-api.tls: "true"
      traefik.http.routers.actual-api.service: "actual-api"
      traefik.http.routers.actual-api.middlewares: "hsts-headers@docker"
      traefik.http.services.actual-api.loadbalancer.server.port: "5007"
      traefik.http.routers.actual-api-private.rule: "Host(`${ACTUAL_API_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.actual-api-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.actual-api-private.tls: "true"
      traefik.http.routers.actual-api-private.service: "actual-api-private"
      traefik.http.routers.actual-api-private.middlewares: "hsts-headers@docker"
      traefik.http.services.actual-api-private.loadbalancer.server.port: "5007"
      traefik.docker.network: "traefik-proxy"

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
