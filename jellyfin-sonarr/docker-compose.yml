services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${DOCKER_CONFIG_DIR}/jellyfin-sonarr/config:/config
      - ${DOCKER_DATA_DIR}/jellyfin/tv-shows:/tv
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.sonarr.rule: "Host(`${SONARR_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.sonarr.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.sonarr.tls: "true"
      traefik.http.routers.sonarr.tls.certresolver: "cf_dns"
      traefik.http.routers.sonarr.service: "sonarr"
      traefik.http.routers.sonarr.middlewares: "hsts-headers@docker"
      traefik.http.services.sonarr.loadbalancer.server.port: "8989"
      traefik.docker.network: "traefik-proxy"
    restart: unless-stopped

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
