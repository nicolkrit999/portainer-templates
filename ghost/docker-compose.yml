services:
    ghost-db:
        image: mysql:8
        container_name: ghost-db
        restart: unless-stopped
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_DATABASE=${MYSQL_DATABASE}
            - MYSQL_USER=${MYSQL_USER}
            - MYSQL_PASSWORD=${MYSQL_PASSWORD}
            - TZ=${TZ}
        volumes:
            - "${DOCKER_DATA_DIR}/ghost/mysql:/var/lib/mysql"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
            interval: 20s
            timeout: 5s
            retries: 5
            start_period: 30s
        networks:
            - cloudflare-web

    ghost:
        image: ghost:6-alpine
        container_name: ghost
        restart: unless-stopped
        depends_on:
            ghost-db:
                condition: service_healthy
        environment:
            - url=${GHOST_URL}
            - database__client=mysql
            - database__connection__host=ghost-db
            - database__connection__user=${MYSQL_USER}
            - database__connection__password=${MYSQL_PASSWORD}
            - database__connection__database=${MYSQL_DATABASE}
            - mail__transport=SMTP
            - mail__options__service=SMTP
            - mail__from=${MAIL_FROM}
            - mail__options__host=${SMTP_HOST}
            - mail__options__port=${SMTP_PORT}
            - mail__options__secure=${SMTP_SECURE}
            - mail__options__auth__user=${SMTP_USER}
            - mail__options__auth__pass=${SMTP_PASS}
            - NODE_ENV=production
            - TZ=${TZ}
        volumes:
            - "${DOCKER_DATA_DIR}/ghost/content:/var/lib/ghost/content"
        networks:
            - cloudflare-web
            - traefik_proxy_network
        labels:
            traefik.enable: "true"
            traefik.http.routers.ghost-family.rule: "Host(`${GHOST_SUBDOMAIN}.${DOMAIN}`)"
            traefik.http.routers.ghost-family.entrypoints: "${TRAEFIK_ENTRYPOINT_1}"
            traefik.http.routers.ghost-family.tls: "true"
            traefik.http.routers.ghost-family.tls.certresolver: "cf_dns"
            traefik.http.routers.ghost-family.service: "ghost"
            traefik.http.routers.ghost-family.middlewares: "hsts-headers@docker"
            traefik.http.routers.ghost-guest.rule: "Host(`${GHOST_SUBDOMAIN}.${DOMAIN}`)"
            traefik.http.routers.ghost-guest.entrypoints: "${TRAEFIK_ENTRYPOINT_2}"
            traefik.http.routers.ghost-guest.tls: "true"
            traefik.http.routers.ghost-guest.tls.certresolver: "cf_dns"
            traefik.http.routers.ghost-guest.service: "ghost"
            traefik.http.routers.ghost-guest.middlewares: "hsts-headers@docker"
            traefik.http.services.ghost.loadbalancer.server.port: "2368"
            traefik.http.routers.ghost-private.rule: "Host(`${GHOST_SUBDOMAIN}.${DOMAIN}`)"
            traefik.http.routers.ghost-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
            traefik.http.routers.ghost-private.tls: "true"
            traefik.http.routers.ghost-private.tls.certresolver: "cf_dns"
            traefik.http.routers.ghost-private.service: "ghost-private"
            traefik.http.routers.ghost-private.middlewares: "hsts-headers@docker"
            traefik.http.services.ghost-private.loadbalancer.server.port: "2368"
            traefik.docker.network: "traefik-proxy"

networks:
    cloudflare-web:
        external: true
    traefik_proxy_network:
        name: traefik-proxy
        external: true
