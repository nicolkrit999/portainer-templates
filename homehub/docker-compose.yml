services:
  homehub:
    container_name: homehub
    image: ghcr.io/surajverma/homehub:latest
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
    restart: unless-stopped
    volumes:
      - ${DOCKER_DATA_DIR}/homehub/uploads:/app/uploads
      - ${DOCKER_DATA_DIR}/homehub/media:/app/media
      - ${DOCKER_DATA_DIR}/homehub/pdfs:/app/pdfs
      - ${DOCKER_CONFIG_DIR}/homehub/data:/app/data
      - ${DOCKER_CONFIG_DIR}/homehub/config.yml:/app/config.yml:ro
    networks:
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.homehub-private.rule: "Host(`${HOMEHUB_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.homehub-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.homehub-private.tls: "true"
      traefik.http.routers.homehub-private.service: "homehub-private"
      traefik.http.routers.homehub-private.middlewares: "hsts-headers@docker"
      traefik.http.services.homehub-private.loadbalancer.server.port: "5000"
      traefik.http.routers.homehub-tailnet.rule: "Host(`${HOMEHUB_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.homehub-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.homehub-tailnet.tls: "true"
      traefik.http.routers.homehub-tailnet.service: "homehub-private"
      traefik.http.routers.homehub-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.docker.network: "traefik-proxy"

networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
