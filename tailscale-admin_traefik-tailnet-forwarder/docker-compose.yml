services:
  # ============================================================================
  # MERGED STACK (2026-09-08) - was previously two independent top-level
  # directories / two independent Portainer git stacks: ../tailscale-admin/
  # and ../traefik-tailnet-forwarder/. Merged into one compose file/one
  # Portainer stack after a real production incident: the forwarder's
  # `network_mode: container:tailscale-admin` is a HARD runtime coupling
  # (Docker resolves and pins tailscale-admin's raw container ID at creation
  # time), but the two services' independent 5-minute git-auto-poll redeploy
  # timers could (and did) recreate tailscale-admin without simultaneously
  # recreating the forwarder. That left the forwarder bound inside a stale,
  # orphaned network namespace - its haproxy process looked "listening"
  # locally, but the live tailscaled (now in a fresh container/namespace) had
  # nothing listening on port 443 in ITS namespace, so real Tailscale-sourced
  # connections got an instant "Connection refused". Root cause: a repo-wide
  # commit touched both files' `cpu_shares` in one shot, and Portainer
  # redeployed each stack on its own independent timer.
  #
  # ⚠️ THIS MERGE ALONE IS NOT SUFFICIENT. Compose only recreates a service
  # whose OWN config changed - it does NOT recreate a service just because
  # another service in the same file (that it shares a network namespace
  # with via network_mode) got recreated. The full fix also requires this
  # Portainer STACK's `AutoUpdate.ForceUpdate` be set to `true`, so every
  # git-poll redeploy force-recreates BOTH services together regardless of
  # which one's own config actually changed. That is a Portainer stack
  # setting, not something expressible in this compose file - it must be
  # set directly in Portainer (see this incident's notes, 2026-09-08).
  # Without it, this exact stale-namespace bug can still recur even from a
  # single merged stack, just less often (only when something touches BOTH
  # services' config at once, instead of either one's independently).
  #
  # ADDED 2026-09-08 (SAME DAY, permanent fix for the residual gap): neither
  # the merge nor AutoUpdate.ForceUpdate protects against a NARROWER trigger
  # - any change that touches only tailscale-admin's own config (a
  # TS_AUTHKEY_ADMIN rotation, an image bump, a Portainer-UI-only env edit)
  # without also touching traefik-tailnet-forwarder's block in that same
  # deploy. Compose only recreates a service whose own config changed, and
  # there's no vanilla-Compose mechanism to cascade-recreate a
  # `network_mode: container:X` dependent when X gets recreated (see
  # `.claude/rules/core-infra-topology.md`'s "This pair's residual risk"
  # section for the full verified writeup). `tailscale-admin-watcher` below
  # closes this gap structurally: it watches `docker events` for tailscale-
  # admin restarts and force-recreates traefik-tailnet-forwarder in response
  # every time, so staleness can no longer depend on remembering to touch
  # both services' config by hand.
  # ============================================================================

  # --- from ../tailscale-admin/docker-compose.yml -----------------------------
  # SECOND, INDEPENDENT Tailscale identity - deliberately NOT a reuse of the
  # primary node in ../tailscale/docker-compose.yml. Two reasons this has to
  # be a separate container with its own tailnet device entry rather than
  # sharing the primary node:
  #
  #   1. tailscale0 is a TUN device, not a real L2 NIC - it cannot be
  #      macvlan'd or otherwise shared/split across multiple containers the
  #      way a physical interface can.
  #   2. The primary node (../tailscale/docker-compose.yml) runs
  #      network_mode: host. The traefik-tailnet-forwarder service below
  #      previously also used network_mode: host to bind directly to that
  #      same host network namespace, which put it in direct conflict with
  #      Traefik's own docker-proxy already wildcard-binding 0.0.0.0:443 for
  #      the family entrypoint in that same namespace (confirmed live -
  #      a wildcard bind and a specific-IP bind cannot coexist on the same
  #      port in one network namespace). That attempt was reverted.
  #
  # This container fixes it by using ORDINARY (non-host) Docker networking
  # instead, per Tailscale's own documented sidecar pattern
  # (https://tailscale.com/blog/docker-tailscale-guide). The
  # traefik-tailnet-forwarder service (haproxy) below joins THIS container's
  # network namespace via `network_mode: container:tailscale-admin` rather
  # than communicating with it over the network. That gives the forwarder a
  # real, isolated namespace of its own (separate from the host and separate
  # from Traefik's namespace), with zero risk of a bind collision against
  # Traefik's wildcard listener.
  #
  # This node will appear as its own distinct device in the Tailscale admin
  # console (its TS_HOSTNAME is set below for a clear name) and, depending
  # on tailnet device-approval settings, may require manual approval there
  # before it can communicate.
  #
  # Deliberately does NOT advertise any subnet routes (no TS_EXTRA_ARGS /
  # --advertise-routes here, unlike the primary node) - this node is not
  # acting as a LAN gateway, it only needs to be reachable at its own
  # tailnet IP directly so the forwarder sharing its namespace can bind
  # 100.x.x.x:443.
  tailscale-admin:
    image: tailscale/tailscale:latest
    container_name: tailscale-admin
    cpu_shares: 4096
    # NOT network_mode: host - see comment block above. Ordinary bridge
    # networking (via traefik_proxy_network below) is what makes this a
    # genuinely separate, non-conflicting namespace.
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: "${TS_AUTHKEY_ADMIN}"
      TS_STATE_DIR: "/var/lib/tailscale"
      TS_USERSPACE: "false"
      TS_HOSTNAME: "${TS_HOSTNAME_ADMIN}"
    volumes:
      - ${VOLUME_CONFIG}/tailscale-admin/state:/var/lib/tailscale
    # Only network attachment this container needs. traefik-proxy gives it:
    #   (a) a route to Traefik's static IP (${TRAEFIK_INTERNAL_IP}, assigned
    #       in ../traefik/docker-compose.yml) for the forwarder sharing this
    #       namespace to reach, and
    #   (b) normal outbound NAT/internet access to reach Tailscale's own
    #       coordination servers.
    # A container using network_mode: container:tailscale-admin (the
    # forwarder, below) cannot declare its own networks: block, so this is
    # also the only place traefik-proxy attachment needs to be declared for
    # this whole stack.
    #
    # STATIC IP required (not left to Docker's dynamic assignment): Traefik's
    # proxyProtocol.trustedIPs (../traefik/docker-compose.yml) trusts PROXY
    # protocol headers ONLY from this container's own IP - the forwarder
    # sharing this namespace is what actually sends them, sourced from this
    # container's address on traefik-proxy. A dynamically-assigned IP could
    # silently change on any container recreate, breaking that trust
    # boundary without warning (confirmed live: the address really did
    # differ from what was assumed before this was made static).
    networks:
      traefik_proxy_network:
        ipv4_address: "${TAILSCALE_ADMIN_INTERNAL_IP}"
    # SECURITY FIX for the forwarder's privileged-port bind, scoped to this
    # container's network namespace only (not host-wide, safe on a
    # non-host-mode container): lets a non-root process bound to THIS
    # namespace - i.e. the traefik-tailnet-forwarder HAProxy container below
    # once it joins via network_mode: container:tailscale-admin - bind port
    # 443 without needing cap_add: NET_BIND_SERVICE or running as root. Both
    # of those were tried previously on the forwarder itself and either
    # didn't work (the capability alone, confirmed live against
    # haproxy:alpine's su-exec user-drop behavior) or triggered a
    # security-review finding (running as root, user: "0:0"). This sysctl is
    # the documented, namespace-scoped Linux mechanism to fix that at the
    # root instead of working around it - it benefits the forwarder joining
    # this namespace, not this container itself, which doesn't bind any low
    # ports.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    # Critical-path for all tailnet admin access (same criticality tier as
    # Traefik itself and the forwarder that shares this namespace) - must
    # come back after a host reboot unconditionally, not just after a crash.
    restart: always
    healthcheck:
      test: ["CMD", "tailscale", "status", "--json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # --- from ../traefik-tailnet-forwarder/docker-compose.yml -------------------
  # TAILNET-FACING SIBLING of ../traefik-private-forwarder/docker-compose.yml -
  # same overall purpose (a narrow TCP-passthrough sidecar so a client reaches
  # Traefik's private tier at a clean `hostname:443` URL without Traefik's own
  # container needing a second network bind), but this instance exists to
  # solve a DIFFERENT problem than the LAN macvlan sidecar: Tailscale's
  # `tailscale0` interface is a TUN device, not a real L2 NIC, so macvlan
  # (which requires attaching to a physical/bridge parent interface) cannot
  # be used here at all. This sidecar instead uses network_mode: host so it
  # can bind directly to the Tailscale node's own IP.
  #
  # Root cause this fixes (confirmed 2026-08-22): Traefik's tailnet-admin-only
  # ipallowlist middleware rejects legitimate Tailscale-sourced requests
  # because Docker's userland-proxy (docker-proxy) rewrites the connection's
  # source IP to a Docker bridge gateway address before Traefik ever sees it
  # - this affects every published port on Traefik's own container, including
  # the shared family entrypoint the admin-only tailnet routers currently sit
  # on. Routing tailnet traffic through this host-networked sidecar instead
  # means the real client IP never passes through docker-proxy's NAT at all;
  # it is preserved end-to-end via the PROXY protocol (see the send-proxy-v2
  # directive in haproxy.cfg, and the matching
  # --entryPoints.${TRAEFIK_ENTRYPOINT_7}.proxyProtocol.trustedIPs flag in
  # ../traefik/docker-compose.yml) instead of being inferred from the raw TCP
  # source.
  #
  # UPDATED 2026-08-22: this stack no longer uses network_mode: host at all.
  # host mode put this container in the SAME network namespace as the host
  # itself - which is also where Traefik's own docker-proxy already
  # wildcard-binds 0.0.0.0:443 for the family entrypoint - so a wildcard
  # bind and this sidecar's specific-IP bind collided on the same port in
  # that shared namespace (confirmed live). Host mode never gave real
  # isolation; it just happened to reach the Tailscale interface.
  #
  # The actual fix: tailscale-admin (above) is a SECOND, independent
  # Tailscale identity/node (not the primary one in ../tailscale/) using
  # ORDINARY (non-host) Docker networking. This service now joins THAT
  # container's network namespace via `network_mode: container:tailscale-admin`
  # instead of network_mode: host - a real, isolated namespace, separate
  # from both the host's and Traefik's, with zero collision risk against
  # Traefik's wildcard listener. A service using network_mode: service:X
  # cannot also declare its own `networks:` block - traefik-proxy attachment
  # lives on tailscale-admin instead, and this service reaches Traefik's
  # container via the same STATIC IP as before (${TRAEFIK_INTERNAL_IP}, set
  # on Traefik's own container in ../traefik/docker-compose.yml) since it
  # has no DNS resolution of its own in a shared, non-default-bridge
  # namespace.
  #
  # NOTE: the TAILSCALE_IP env var below refers to tailscale-admin's own
  # tailnet IP (assigned once tailscale-admin is deployed and approved in
  # the admin console) - NOT the primary node's IP. The haproxy.cfg file
  # already on the NAS filesystem at
  # ${VOLUME_CONFIG}/traefik-tailnet-forwarder/haproxy.cfg was generated
  # with the OLD (primary node's) IP baked in at one point, and
  # haproxy-config-init only writes that file if it's missing - it will NOT
  # self-correct. Whoever redeploys this stack must either delete that stale
  # file first (so the init container regenerates it with the current
  # TAILSCALE_IP) or hand-edit it, once tailscale-admin's real IP is known.
  #
  # Unlike socat (used by the LAN sidecar), HAProxy cannot be driven by a
  # bare command: one-liner for this job - PROXY protocol injection needs a
  # real config file. haproxy.cfg (bind-mounted below) must contain:
  #
  #   global
  #       log stdout format raw local0
  #
  #   defaults
  #       mode tcp
  #       timeout connect 5s
  #       timeout client 30s
  #       timeout server 30s
  #       log global
  #
  #   frontend tailnet_admin_in
  #       bind ${TAILSCALE_IP}:443
  #       default_backend traefik_admin
  #
  #   backend traefik_admin
  #       server traefik ${TRAEFIK_INTERNAL_IP}:${TRAEFIK_PORT_7} send-proxy-v2
  #
  #   frontend tailnet_web_in
  #       bind ${TAILSCALE_IP}:80
  #       default_backend traefik_web
  #
  #   backend traefik_web
  #       server traefik ${TRAEFIK_INTERNAL_IP}:80
  #
  # BUG FIXED 2026-08-22 (confirmed live): this file originally had no
  # listener on port 80 at all, so `curl http://traefik.${DOMAIN}/` (which
  # now resolves to THIS forwarder's tailnet IP via the dnsmasq-tailnet split)
  # got connection-refused instead of the expected redirect to HTTPS - the
  # exact same bare-HTTP-request bug already fixed once earlier the same day
  # for the shared `web`/family entrypoint, just regressed for this one
  # hostname because it's now routed through this forwarder instead of
  # hitting Traefik's wildcard bind directly. The tailnet_web_in/traefik_web
  # pair above is a plain TCP passthrough (no send-proxy-v2) that forwards
  # straight to Traefik's own `web` entrypoint (../traefik/docker-compose.yml,
  # hardcoded `--entryPoints.web.address=:80`, not parameterized by port
  # number anywhere in this repo), which already does the bare-HTTP->HTTPS
  # redirect correctly for every other hostname. PROXY protocol is
  # unnecessary here for two reasons: (1) this hop is plain container-to-
  # container traffic on the traefik-proxy bridge network, which never goes
  # through Docker's host-port-publish/docker-proxy NAT path (that path is
  # what caused the ORIGINAL source-IP-rewrite bug this whole stack exists to
  # fix - it only affects HOST-published ports, not container-to-container
  # traffic), so there's no source-IP corruption risk to correct for; and
  # (2) the redirect itself isn't gated by the tailnet-admin-only
  # ipallowlist or any other check that needs the real client IP - it's just
  # an unconditional redirect to HTTPS.
  #
  # ⚠️ OPERATIONAL STEP REQUIRED: haproxy-config-init only writes haproxy.cfg
  # if it's missing (idempotent by design, see below) - it will NOT
  # regenerate the file to add this new frontend/backend pair on its own.
  # The stale haproxy.cfg already on the NAS filesystem at
  # ${VOLUME_CONFIG}/traefik-tailnet-forwarder/haproxy.cfg (missing this
  # fix) MUST be deleted manually before the next redeploy, or this fix will
  # not take effect - same manual step already performed once for a
  # different value change (see the TAILSCALE_IP note above).
  #
  # HAProxy config files do NOT support ${VAR} shell-style interpolation at
  # runtime - the placeholders above are real, literal values. Substitution
  # is handled automatically by the haproxy-config-init service below (a
  # one-shot init container, same pattern as ../traefik/docker-compose.yml's
  # fix-permissions service), which writes haproxy.cfg to the host
  # filesystem at ${VOLUME_CONFIG}/traefik-tailnet-forwarder/haproxy.cfg the
  # first time it's missing (fresh deploy, wiped volume, etc.) and leaves it
  # untouched on every subsequent run so manual edits are never clobbered.
  #
  # Deliberately NOT attached to cloudflare-web (not tunnel-reachable - same
  # reasoning as traefik-private-forwarder) and has no Traefik router labels
  # of its own (pure infrastructure, not a routed application).
  haproxy-config-init:
    image: alpine:latest
    container_name: traefik-tailnet-forwarder-init
    restart: "no"
    environment:
      TAILSCALE_IP: "${TAILSCALE_IP}"
      TRAEFIK_INTERNAL_IP: "${TRAEFIK_INTERNAL_IP}"
      TRAEFIK_PORT_7: "${TRAEFIK_PORT_7}"
    volumes:
      - ${VOLUME_CONFIG}/traefik-tailnet-forwarder:/target
    command:
      - "sh"
      - "-c"
      - "if [ -f /target/haproxy.cfg ]; then echo \"haproxy.cfg already exists, skipping\"; else mkdir -p /target && cat > /target/haproxy.cfg << EOF\nglobal\n    log stdout format raw local0\n\ndefaults\n    mode tcp\n    timeout connect 5s\n    timeout client 30s\n    timeout server 30s\n    log global\n\nfrontend tailnet_admin_in\n    bind $TAILSCALE_IP:443\n    default_backend traefik_admin\n\nbackend traefik_admin\n    server traefik $TRAEFIK_INTERNAL_IP:$TRAEFIK_PORT_7 send-proxy-v2\n\nfrontend tailnet_web_in\n    bind $TAILSCALE_IP:80\n    default_backend traefik_web\n\nbackend traefik_web\n    server traefik $TRAEFIK_INTERNAL_IP:80\nEOF\nchmod 644 /target/haproxy.cfg; fi; cat /target/haproxy.cfg"

  traefik-tailnet-forwarder:
    image: haproxy:alpine
    container_name: traefik-tailnet-forwarder
    cpu_shares: 4096
    # Joins tailscale-admin's network namespace (see the top-of-file comment
    # block for the full rationale) instead of binding to the host's own
    # namespace directly - tailscale0 is a TUN device, not a
    # macvlan-attachable L2 NIC, so the LAN sidecar's macvlan approach still
    # cannot be used here, but this gets a genuinely isolated namespace
    # rather than sharing the host's.
    #
    # PRESERVED AS-IS DURING THE 2026-09-08 MERGE: this still uses the raw
    # Docker `container:<name>` form (not Compose's `service:<name>` sugar),
    # even though tailscale-admin now lives in this SAME compose file/project
    # (it didn't when this line was first written - tailscale-admin was a
    # separate stack then, which is why `container:` was required over
    # `service:`). Deliberately left unchanged rather than switched to
    # `service:tailscale-admin` as part of this merge, per the explicit
    # scope of this change (a structural relocation, not a redesign) - both
    # forms resolve to the same container at runtime as long as
    # tailscale-admin's container_name stays exactly "tailscale-admin", so
    # behavior is identical either way. The actual fix for the
    # stale-namespace bug this merge addresses is the Portainer
    # AutoUpdate.ForceUpdate setting noted at the top of this file, not this
    # network_mode syntax choice.
    network_mode: "container:tailscale-admin"
    # user: "0:0" (running haproxy as root) is no longer needed: haproxy's
    # su-exec-based drop to a non-root user previously failed to bind port
    # 443 even with cap_add: NET_BIND_SERVICE (confirmed live - that
    # capability doesn't reliably survive haproxy:alpine's internal user
    # switch). Now that this container shares tailscale-admin's namespace,
    # which sets net.ipv4.ip_unprivileged_port_start=0 on that namespace,
    # any non-root process here can bind port 443 without elevated
    # privileges or capabilities - the clean fix instead of the workaround.
    volumes:
      - ${VOLUME_CONFIG}/traefik-tailnet-forwarder/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    # Critical-path for all tailnet admin access (same criticality tier as
    # Traefik itself, which also uses restart: always) - must come back
    # after a host reboot unconditionally, not just after a crash.
    restart: always
    # tailscale-admin is now declared in this SAME compose file (as of the
    # 2026-09-08 merge), so it COULD technically be added to depends_on here
    # (Compose only rejects depends_on references to services undeclared in
    # the same file - that restriction no longer applies post-merge).
    # Deliberately NOT added, to keep this merge a pure structural
    # relocation rather than a behavior change - see the top-of-file note on
    # why Compose depends_on wouldn't fully solve the underlying problem
    # anyway (it governs start ORDER, not forced recreation of an already-
    # running, unrelated-on-paper service). The real fix is the Portainer
    # AutoUpdate.ForceUpdate setting noted above. The original historical
    # constraint this comment used to describe (tailscale-admin as a
    # separate Portainer stack, making a depends_on reference a hard
    # Compose validation error) no longer applies now that both services
    # are in one file - kept here only as history, not as current fact.
    depends_on:
      haproxy-config-init:
        condition: service_completed_successfully
    healthcheck:
      # HAProxy alpine images don't reliably ship nc/curl, so this validates
      # config syntax only (`haproxy -c -f ...`) rather than live
      # connectivity - unlike the LAN sidecar's nc-based reachability check.
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # PERMANENT FIX for this pair's residual staleness risk (added 2026-09-08,
  # same day as the merge - see the top-of-file comment block and
  # `.claude/rules/core-infra-topology.md`'s "This pair's residual risk"
  # section). Two off-the-shelf watcher images were evaluated and rejected:
  # `buxxdev/containernetwork-autofix` (hard-requires Unraid plugin host
  # paths this NAS doesn't have) and `treyturner/whalewatcher` (no
  # verifiable public source repo - a supply-chain concern for an image that
  # needs read-write docker.sock access). Built instead as a custom
  # `command:` on an OFFICIAL Docker image, no Dockerfile/custom image - the
  # exact same pattern this file already uses for haproxy-config-init above
  # (official alpine:latest + a shell command, no custom build), consistent
  # with this repo's "no build steps" convention.
  #
  # Deliberately NOT added to any other service's depends_on and does not
  # depend on any service itself - it's an independent, parallel watcher
  # reacting to Docker events over time, not part of the startup ordering
  # chain.
  tailscale-admin-watcher:
    # Official Docker CLI image bundling the Compose v2 plugin (`docker
    # compose`, not the standalone `docker-compose` v1 binary) - needed
    # because this container issues `docker compose up --force-recreate`,
    # not just `docker` commands. NOTE: bundling of the compose plugin in
    # this exact tag should be confirmed with `docker compose version` on
    # first deploy - it cannot be 100% verified without a live check.
    image: docker:27-cli
    container_name: tailscale-admin-watcher
    restart: unless-stopped
    environment:
      # Seconds to wait after tailscale-admin reports a `start` event before
      # force-recreating traefik-tailnet-forwarder - gives the new Tailscale
      # identity time to actually establish its tailnet connection before
      # the forwarder tries to bind against its namespace.
      WATCHER_RESTART_WAIT_TIME: "${WATCHER_RESTART_WAIT_TIME}"
      # This exact stack's own Portainer-assigned numeric stack ID - see the
      # long comment on the compose-file volume mount below for why this is
      # required and why it is NOT a fixed constant.
      PORTAINER_STACK_ID: "${PORTAINER_STACK_ID}"
      # SECURITY-AUDIT FIX (2026-09-08): every one of this stack's own
      # ${VAR}s must ALSO be set here, on the watcher's own container. The
      # mounted docker-compose.yml below (read-only) has NO accompanying
      # .env file next to it - without these, `docker compose up` invoked
      # from inside this container would substitute every ${VAR} in the
      # mounted file as blank, silently deploying traefik-tailnet-forwarder
      # (and its haproxy-config-init dependency) with empty env on every
      # single recreate - i.e. this repo's own previously-documented
      # StackGitRedeploy env-wipe failure mode, except self-inflicted by the
      # very automation meant to fix staleness. The command below dumps
      # this container's own environment to a file and passes it back to
      # `docker compose` via --env-file, so the recreate always carries the
      # real, current values - the same ones Portainer already has set on
      # this stack.
      TAILSCALE_IP: "${TAILSCALE_IP}"
      TRAEFIK_INTERNAL_IP: "${TRAEFIK_INTERNAL_IP}"
      TRAEFIK_PORT_7: "${TRAEFIK_PORT_7}"
      TS_AUTHKEY_ADMIN: "${TS_AUTHKEY_ADMIN}"
      TS_HOSTNAME_ADMIN: "${TS_HOSTNAME_ADMIN}"
      TAILSCALE_ADMIN_INTERNAL_IP: "${TAILSCALE_ADMIN_INTERNAL_IP}"
      VOLUME_CONFIG: "${VOLUME_CONFIG}"
    volumes:
      # Read-write: this container issues `docker compose up`, not just
      # `docker events` reads. This repo already has an established,
      # accepted precedent for docker.sock-mounted services that actively
      # mutate containers, not just observe them (tugtainer, watchtower -
      # both can recreate/update any container on the host; this one is
      # narrower, ever only targeting one specific named service).
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only mount of THIS stack's own compose file, at the exact host
      # path Portainer stores git-stack files at:
      # <portainer-data-dir>/compose/<stack-id>/<stack-directory-name>/docker-compose.yml
      # - confirmed today (2026-09-08) via live container inspection that
      # Portainer's own /data maps to ${VOLUME_CONFIG}/portainer on this
      # host. Mounting the real file (rather than reconstructing the
      # `docker compose up` command by hand) means the recreate always
      # carries full fidelity - every env var, volume, and the
      # network_mode: container:tailscale-admin reference itself - with
      # zero risk of drifting from what's actually deployed. This mount
      # source is coupled to Portainer's current internal storage layout
      # (unversioned, could change in a future Portainer release) - if the
      # watcher container ever fails to start with a "no such file" error
      # on this path, check whether that layout has changed.
      - ${VOLUME_CONFIG}/portainer/compose/${PORTAINER_STACK_ID}/tailscale-admin_traefik-tailnet-forwarder/docker-compose.yml:/stack/docker-compose.yml:ro
    # Infinite reactive loop, not a one-shot check: `docker events` streams
    # and blocks by design, so piping it into `while read` means this loop
    # reacts to EVERY future tailscale-admin restart for the life of the
    # container, not just the first one. Filtered to `event=start` +
    # `container=tailscale-admin` server-side (via --filter) so the loop
    # only wakes up for the exact event it cares about, rather than parsing
    # every Docker event on the host.
    #
    # SECURITY-AUDIT FIX (2026-09-08), escaping: every `$name`/`${name}`
    # below that must be resolved by THIS CONTAINER's shell at runtime
    # (the `$line` loop variable, and both uses of
    # `$WATCHER_RESTART_WAIT_TIME`) is written as `$$name`/`$${name}` -
    # Compose's own variable-interpolation pass matches bare `$VAR` just as
    # much as `${VAR}` and runs BEFORE this container ever starts, so an
    # unescaped `$line` (a value Compose has never heard of) was silently
    # replaced with an empty string at deploy time, permanently breaking
    # the log line's content - confirmed by security audit, not
    # theoretical. `$$` is Compose's documented escape for "leave this
    # literal `$` alone, a shell at runtime should resolve it instead."
    command:
      - "sh"
      - "-c"
      - "echo \"[tailscale-admin-watcher] watching for tailscale-admin restarts...\"; printenv > /tmp/stack.env; docker events --filter 'event=start' --filter 'container=tailscale-admin' --format '{{.Time}} {{.Status}} {{.Actor.Attributes.name}}' | while read -r line; do echo \"[tailscale-admin-watcher] detected: $$line\"; echo \"[tailscale-admin-watcher] waiting $${WATCHER_RESTART_WAIT_TIME}s for tailscale-admin to establish its tailnet connection...\"; sleep \"$$WATCHER_RESTART_WAIT_TIME\"; echo \"[tailscale-admin-watcher] force-recreating traefik-tailnet-forwarder...\"; docker compose --env-file /tmp/stack.env -f /stack/docker-compose.yml -p tailscale-admin_traefik-tailnet-forwarder up -d --force-recreate traefik-tailnet-forwarder; echo \"[tailscale-admin-watcher] done, resuming watch\"; done"
    # No healthcheck: a background docker-events watcher loop has no
    # meaningful endpoint/command to probe beyond "is the process alive",
    # which restart:unless-stopped + `docker ps` already cover - a forced
    # healthcheck here would add ceremony without real actionable signal.
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
