services:
    ittols:
        container_name: it-tools
        image: corentinth/it-tools
        mem_limit: 2g
        cpu_shares: 768
        security_opt:
            - no-new-privileges:true
        restart: unless-stopped
        networks:
            - cloudflare_web_network
            - traefik_proxy_network
        labels:
            traefik.enable: "true"
            traefik.http.routers.it-tools.rule: "Host(`${IT_TOOLS_SUBDOMAIN}.${DOMAIN}`)"
            traefik.http.routers.it-tools.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
            traefik.http.routers.it-tools.tls: "true"
            traefik.http.routers.it-tools.tls.certresolver: "cf_dns"
            # SAN-bundle (group "utilities", anchor router): this router is the
            # anchor for a single multi-SAN Let's Encrypt certificate covering
            # 20 low-traffic utility services, to stay under LE's 50-certs/168h
            # rate limit that Traefik previously hit issuing near-one cert per
            # router. Mechanism is per-router tls.domains labels (the correct
            # approach) - NOT resolver-level CLI flags on Traefik's own
            # container/config, which crashed Traefik once already
            # ("field not found, node: domains") and was reverted.
            # Once this router obtains the cert, every other router below is
            # covered automatically via the SAN list - those routers need no
            # label changes at all.
            # Bundled hostnames (this anchor + 19 others): it-tools, omnitools,
            # convertx, stirling-pdf, change-detection, filebrowser, duplicati,
            # snapotter, moocup, withoutbg, cardyo, datetime, termix,
            # snappyemail, owncloud, miniqr, privatebin, bytestash, openresume,
            # sosse.
            traefik.http.routers.it-tools.tls.domains[0].main: "${IT_TOOLS_SUBDOMAIN}.${DOMAIN}"
            traefik.http.routers.it-tools.tls.domains[0].sans: "${OMNI_TOOLS_SUBDOMAIN}.${DOMAIN},${CONVERTX_SUBDOMAIN}.${DOMAIN},${STIRLING_PDF_SUBDOMAIN}.${DOMAIN},${CHANGE_DETECTION_SUBDOMAIN}.${DOMAIN},${FILEBROWSER_SUBDOMAIN}.${DOMAIN},${DUPLICATI_SUBDOMAIN}.${DOMAIN},${SNAPOTTER_SUBDOMAIN}.${DOMAIN},${MOOCUP_SUBDOMAIN}.${DOMAIN},${WITHOUTBG_SUBDOMAIN}.${DOMAIN},${CARDYO_SUBDOMAIN}.${DOMAIN},${DATETIME_SUBDOMAIN}.${DOMAIN},${TERMIX_SUBDOMAIN}.${DOMAIN},${SNAPPYEMAIL_SUBDOMAIN}.${DOMAIN},${OWNCLOUD_SUBDOMAIN}.${DOMAIN},${MINI_QR_SUBDOMAIN}.${DOMAIN},${PRIVATEBIN_SUBDOMAIN}.${DOMAIN},${BYTESTASH_SUBDOMAIN}.${DOMAIN},${OPENRESUME_SUBDOMAIN}.${DOMAIN},${SOSSE_SUBDOMAIN}.${DOMAIN}"
            traefik.http.routers.it-tools.service: "it-tools"
            traefik.http.routers.it-tools.middlewares: "hsts-headers@docker"
            traefik.http.services.it-tools.loadbalancer.server.port: "80"
            traefik.docker.network: "traefik-proxy"

networks:
    cloudflare_web_network:
        name: cloudflare-web
        external: true
    traefik_proxy_network:
        name: traefik-proxy
        external: true
