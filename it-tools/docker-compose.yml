services:
    ittols:
        container_name: it-tools
        image: corentinth/it-tools
        mem_limit: 2g
        cpu_shares: 768
        security_opt:
            - no-new-privileges:true
        restart: unless-stopped
        networks:
            - cloudflare_web_network
            - traefik_proxy_network
        labels:
            traefik.enable: "true"
            traefik.http.routers.it-tools.rule: "Host(`${IT_TOOLS_SUBDOMAIN}.${DOMAIN}`)"
            traefik.http.routers.it-tools.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
            traefik.http.routers.it-tools.tls: "true"
            traefik.http.routers.it-tools.service: "it-tools"
            traefik.http.routers.it-tools.middlewares: "hsts-headers@docker"
            traefik.http.routers.it-tools-tailnet.rule: "Host(`${IT_TOOLS_SUBDOMAIN}.${DOMAIN}`)"
            traefik.http.routers.it-tools-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
            traefik.http.routers.it-tools-tailnet.tls: "true"
            traefik.http.routers.it-tools-tailnet.service: "it-tools"
            traefik.http.routers.it-tools-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
            traefik.http.services.it-tools.loadbalancer.server.port: "80"
            traefik.docker.network: "traefik-proxy"

networks:
    cloudflare_web_network:
        name: cloudflare-web
        external: true
    traefik_proxy_network:
        name: traefik-proxy
        external: true
