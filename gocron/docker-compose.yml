services:
  gocron:
    image: ghcr.io/flohoss/gocron:latest
    container_name: gocron
    hostname: gocron
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
      PORT: 8156
    volumes:
      - ${DOCKER_CONFIG_DIR}/gocron/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.gocron.rule: "Host(`${GOCRON_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.gocron.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.gocron.tls: "true"
      traefik.http.routers.gocron.service: "gocron"
      traefik.http.routers.gocron.middlewares: "hsts-headers@docker"
      traefik.http.services.gocron.loadbalancer.server.port: "8156"
      traefik.docker.network: "traefik-proxy"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8156/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
