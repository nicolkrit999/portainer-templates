services:
  snapotter:
    image: snapotter/snapotter:latest
    container_name: SnapOtter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: "${TZ}"
      AUTH_ENABLED: "true"
      # Only needed on first setup to seed the admin account; safe to leave commented after first login.
      # DEFAULT_USERNAME: "krit"
      # DEFAULT_PASSWORD: "${SNAPOTTER_PASSWORD}"
      STORAGE_MODE: "local"
    volumes:
      - ${DOCKER_DATA_DIR}/snapotter:/data:rw
    labels:
      traefik.enable: "true"
      traefik.http.routers.snapotter.rule: "Host(`${SNAPOTTER_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.snapotter.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.snapotter.tls: "true"
      traefik.http.routers.snapotter.service: "snapotter"
      traefik.http.routers.snapotter.middlewares: "hsts-headers@docker"
      traefik.http.routers.snapotter-tailnet.rule: "Host(`${SNAPOTTER_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.snapotter-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.snapotter-tailnet.tls: "true"
      traefik.http.routers.snapotter-tailnet.service: "snapotter"
      traefik.http.routers.snapotter-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.snapotter.loadbalancer.server.port: "1349"
      traefik.docker.network: "traefik-proxy"
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
