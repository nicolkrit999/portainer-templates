services:
  jellyfin-init:
    image: "alpine:3.19"
    container_name: jellyfin-init
    restart: "no"
    volumes:
      - jellyfin_transcodes:/transcodes
    command: "chmod 1777 /transcodes"

  jellyfin:
    image: jellyfin/jellyfin:12.4.20261026-211555
    container_name: jellyfin
    cpu_shares: 2048
    cpus: 4.0
    # Pinned away from core 5, leaving it reachable by AdGuard's DNS chain
    # under contention. See adguard/INCIDENT-2026-09-08-dns-relay-outage.md.
    cpuset: "0-4"
    user: "${PUID}:${PGID}"
    group_add:
      - "105"
    volumes:
      - ${DOCKER_CONFIG_DIR}/jellyfin/config:/config
      - ${DOCKER_CONFIG_DIR}/jellyfin/cache:/cache
      - ${DOCKER_DATA_DIR}/jellyfin/movies:/media/movies
      - ${DOCKER_DATA_DIR}/jellyfin/tv-shows:/media/tvshows
      # RAM-backed, disposable HLS transcode/remux segment cache - keeps
      # on-the-fly MKV->HLS remuxing (needed for browser playback of
      # containers the HTML5 player can't handle) off the spinning media
      # HDD pool. Bounded at 8g so it can't grow unbounded and pressure
      # the host's 64GB RAM. Backed by the named tmpfs volume below
      # instead of an inline `type: tmpfs` mount with `mode: 1777`,
      # because Docker applies that YAML integer mode as a raw decimal
      # value instead of interpreting it as octal, producing an actual
      # runtime mode of octal 3361 (root-owned, non-root user denied
      # access) - confirmed live via docker exec/stat, and the root cause
      # of a startup crash loop. The jellyfin-init container chmods the
      # volume to the real 1777 (world-writable + sticky) before Jellyfin
      # starts, so the non-root ${PUID}:${PGID} container user can write
      # to it regardless of configured UID/GID. Contents never touch disk
      # and are wiped on container stop/recreate - used and deleted, not
      # persisted.
      # NOTE: this mount alone does not make Jellyfin use it - you must
      # also set Dashboard -> Playback -> "Transcoding temporary path" to
      # /transcodes in Jellyfin's own web UI after redeploying.
      - jellyfin_transcodes:/transcodes
    restart: 'always'
    environment:
      - TZ=${TZ}
    depends_on:
      jellyfin-init:
        condition: service_completed_successfully
    networks:
      - traefik_proxy_network
      - public_jellyfin_network
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
      - /dev/dri:/dev/dri
    labels:
      traefik.enable: "true"
      traefik.http.routers.jellyfin-private.rule: "Host(`${JELLYFIN_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.jellyfin-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.jellyfin-private.tls: "true"
      traefik.http.routers.jellyfin-private.service: "jellyfin-private"
      traefik.http.routers.jellyfin-private.middlewares: "hsts-headers@docker"
      traefik.http.routers.jellyfin-tailnet.rule: "Host(`${JELLYFIN_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.jellyfin-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.jellyfin-tailnet.tls: "true"
      traefik.http.routers.jellyfin-tailnet.service: "jellyfin-private"
      traefik.http.routers.jellyfin-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.jellyfin-private.loadbalancer.server.port: "8096"
      traefik.docker.network: "traefik-proxy"

volumes:
  jellyfin_transcodes:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=8g"

networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
  # Backend network of the public Traefik; the traefik-public stack must be deployed first.
  public_jellyfin_network:
    name: public-jellyfin
    external: true
