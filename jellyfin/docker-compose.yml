services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "${PUID}:${PGID}"
    volumes:
      - ${DOCKER_CONFIG_DIR}/jellyfin/config:/config
      - ${DOCKER_CONFIG_DIR}/jellyfin/cache:/cache
      - ${DOCKER_DATA_DIR}/jellyfin/movies:/media/movies
      - ${DOCKER_DATA_DIR}/jellyfin/tv-shows:/media/tvshows
    restart: 'unless-stopped'
    environment:
      - TZ=${TZ}
    ports:
      - "127.0.0.1:${JELLYFIN_HOST_PORT}:8096"
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
      - /dev/dri:/dev/dri
    labels:
      traefik.enable: "true"
      # --- SAN-bundle cert (group "media", 1 of 6 repo-wide groups) ---
      # Bundles this router's cert to also cover the other media-stack
      # hostnames (immich/foto, radarr, sonarr, plex, navidrome, kavita,
      # audiobookshelf, ytptube, qbit-torrent) as SANs on ONE certificate,
      # to stay under Let's Encrypt's 50-certs/168h rate limit (this repo
      # hit it requesting a near-separate cert per router across ~77
      # hostnames). This is the CORRECT mechanism: per-router
      # `tls.domains[]` labels on a single anchor router. Do NOT reintroduce
      # resolver-level CLI flags on Traefik's own container
      # (`--certificatesresolvers.cf_dns.acme.domains[N].main=...`) - that
      # crashed Traefik outright with `field not found, node: domains` and
      # was reverted. Traefik's cert store is keyed globally by hostname, so
      # every other bundled service's own router needs ZERO label changes to
      # pick up this bundled cert - do not "clean up" this block thinking
      # it's redundant.
      traefik.http.routers.jellyfin-family.tls.domains[0].main: "${JELLYFIN_SUBDOMAIN}.${DOMAIN}"
      traefik.http.routers.jellyfin-family.tls.domains[0].sans: "${IMMICH_SUBDOMAIN}.${DOMAIN},${RADARR_SUBDOMAIN}.${DOMAIN},${SONARR_SUBDOMAIN}.${DOMAIN},${PLEX_SUBDOMAIN}.${DOMAIN},${NAVIDROME_SUBDOMAIN}.${DOMAIN},${KAVITA_SUBDOMAIN}.${DOMAIN},${AUDIOBOOKSHELF_SUBDOMAIN}.${DOMAIN},${YTPTUBE_SUBDOMAIN}.${DOMAIN},${QBIT_TORRENT_SUBDOMAIN}.${DOMAIN}"
      traefik.http.routers.jellyfin-family.rule: "Host(`${JELLYFIN_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.jellyfin-family.entrypoints: "${TRAEFIK_ENTRYPOINT_1}"
      traefik.http.routers.jellyfin-family.tls: "true"
      traefik.http.routers.jellyfin-family.tls.certresolver: "cf_dns"
      traefik.http.routers.jellyfin-family.service: "jellyfin"
      traefik.http.routers.jellyfin-family.middlewares: "hsts-headers@docker"
      traefik.http.routers.jellyfin-guest.rule: "Host(`${JELLYFIN_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.jellyfin-guest.entrypoints: "${TRAEFIK_ENTRYPOINT_2}"
      traefik.http.routers.jellyfin-guest.tls: "true"
      traefik.http.routers.jellyfin-guest.tls.certresolver: "cf_dns"
      traefik.http.routers.jellyfin-guest.service: "jellyfin"
      traefik.http.routers.jellyfin-guest.middlewares: "hsts-headers@docker"
      traefik.http.routers.jellyfin-friends.rule: "Host(`${JELLYFIN_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.jellyfin-friends.entrypoints: "${TRAEFIK_ENTRYPOINT_4}"
      traefik.http.routers.jellyfin-friends.tls: "true"
      traefik.http.routers.jellyfin-friends.tls.certresolver: "cf_dns"
      traefik.http.routers.jellyfin-friends.service: "jellyfin"
      traefik.http.routers.jellyfin-friends.middlewares: "hsts-headers@docker"
      traefik.http.services.jellyfin.loadbalancer.server.port: "8096"
      traefik.http.routers.jellyfin-private.rule: "Host(`${JELLYFIN_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.jellyfin-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.jellyfin-private.tls: "true"
      traefik.http.routers.jellyfin-private.tls.certresolver: "cf_dns"
      traefik.http.routers.jellyfin-private.service: "jellyfin-private"
      traefik.http.routers.jellyfin-private.middlewares: "hsts-headers@docker"
      traefik.http.services.jellyfin-private.loadbalancer.server.port: "8096"
      traefik.docker.network: "traefik-proxy"

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
