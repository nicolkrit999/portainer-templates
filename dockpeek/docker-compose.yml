services:
  dockpeek:
    container_name: dockpeek
    image: ghcr.io/dockpeek/dockpeek:latest
    environment:
       SECRET_KEY: ${DOCKPEEK_SECRET_KEY}
       USERNAME: ${DOCKPEEK_USERNAME}
       PASSWORD: ${DOCKPEEK_PASSWORD}
       DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.dockpeek.rule: "Host(`${DOCKPEEK_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.dockpeek.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.dockpeek.tls: "true"
      traefik.http.routers.dockpeek.service: "dockpeek"
      traefik.http.routers.dockpeek.middlewares: "hsts-headers@docker"
      traefik.http.routers.dockpeek-tailnet.rule: "Host(`${DOCKPEEK_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.dockpeek-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.dockpeek-tailnet.tls: "true"
      traefik.http.routers.dockpeek-tailnet.service: "dockpeek"
      traefik.http.routers.dockpeek-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.dockpeek.loadbalancer.server.port: "8000"
      traefik.docker.network: "traefik-proxy"
    networks:
      - cloudflare_web_network
      - traefik_proxy_network

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
