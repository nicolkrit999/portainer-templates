services:
  owncloud:
    image: owncloud/server:latest
    container_name: "owncloud"
    restart: always
    privileged: true
    environment:
      - OWNCLOUD_DOMAIN=${APP_URL}
      - OWNCLOUD_DB_TYPE=mysql
      - OWNCLOUD_DB_NAME=owncloud
      - OWNCLOUD_DB_USERNAME=owncloud
      - OWNCLOUD_DB_PASSWORD=${DB_MARIADB_PASSWORD}
      - OWNCLOUD_DB_HOST=mariadb
      - OWNCLOUD_ADMIN_USERNAME=${APP_USER}
      - OWNCLOUD_ADMIN_PASSWORD=${APP_PASSWORD}
      - OWNCLOUD_MYSQL_UTF8MB4=true
      - OWNCLOUD_REDIS_ENABLED=true
      - OWNCLOUD_REDIS_HOST=owncloud-redis
      - OWNCLOUD_TRUSTED_PROXIES=*
    depends_on:
      mariadb:
        condition: service_started
      redis:
        condition: service_started
      fix-permissions:
        condition: service_completed_successfully
    volumes:
      - ${DOCKER_DATA_DIR}/owncloud/data:/mnt/data
    healthcheck:
      test: ["CMD", "/usr/bin/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
    labels:
      traefik.enable: "true"
      traefik.http.routers.owncloud.rule: "Host(`${OWNCLOUD_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.owncloud.entrypoints: "${TRAEFIK_ENTRYPOINT_2}"
      traefik.http.routers.owncloud.tls: "true"
      traefik.http.routers.owncloud.service: "owncloud"
      traefik.http.routers.owncloud.middlewares: "hsts-headers@docker"
      traefik.http.services.owncloud.loadbalancer.server.port: "8080"
      traefik.http.routers.owncloud-private.rule: "Host(`${OWNCLOUD_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.owncloud-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.owncloud-private.tls: "true"
      traefik.http.routers.owncloud-private.service: "owncloud-private"
      traefik.http.routers.owncloud-private.middlewares: "hsts-headers@docker"
      traefik.http.services.owncloud-private.loadbalancer.server.port: "8080"
      traefik.docker.network: "traefik-proxy"

  mariadb:
    image: mariadb:10.11
    container_name: owncloud-db
    restart: always
    command:
      - --max-allowed-packet=128M
      - --innodb-log-file-size=64M
    environment:
      - MYSQL_DATABASE=owncloud
      - MYSQL_USER=owncloud
      - MYSQL_PASSWORD=${DB_MARIADB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_MARIADB_PASSWORD}
    volumes:
      - ${DOCKER_CONFIG_DIR}/owncloud/mariadb:/var/lib/mysql
    depends_on:
      fix-permissions:
        condition: service_completed_successfully
    networks:
      - cloudflare_web_network

  redis:
    image: redis:6
    container_name: owncloud-redis
    restart: always

    command: ["redis-server", "--save", "", "--appendonly", "no", "--stop-writes-on-bgsave-error", "no"]
    volumes:
      - ${DOCKER_CONFIG_DIR}/owncloud/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      fix-permissions:
        condition: service_completed_successfully
    networks:
      - cloudflare_web_network

  fix-permissions:
    image: alpine:latest
    container_name: owncloud-init
    user: root
    command: >
      sh -c "
      echo 'Fixing Redis permissions to 777 (Open)...' &&
      chmod -R 777 /fix/redis &&

      echo 'Fixing MariaDB permissions (Strict)...' &&
      chown -R 999:999 /fix/mariadb &&
      find /fix/mariadb -type d -exec chmod 750 {} + &&
      find /fix/mariadb -type f -exec chmod 640 {} + &&

      echo 'Fixing ownCloud Data permissions (Strict)...' &&
      chown -R 33:33 /fix/data &&
      find /fix/data -type d -exec chmod 770 {} + &&
      find /fix/data -type f -exec chmod 660 {} + &&

      echo 'Permissions fixed. Exiting.'
      "
    volumes:
      - ${DOCKER_CONFIG_DIR}/owncloud/redis:/fix/redis
      - ${DOCKER_CONFIG_DIR}/owncloud/mariadb:/fix/mariadb
      - ${DOCKER_DATA_DIR}/owncloud/data:/fix/data
    networks:
      - cloudflare_web_network

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
