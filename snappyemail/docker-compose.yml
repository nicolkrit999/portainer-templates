services:
  snappymail:
    image: djmaze/snappymail:latest
    container_name: snappymail
    restart: unless-stopped
    volumes:
      - ${DOCKER_CONFIG_DIR}/snappymail:/var/lib/snappymail
    environment:
      - ALLOW_ADMIN_PANEL=1
    labels:
      traefik.enable: "true"
      traefik.http.routers.snappymail.rule: "Host(`${SNAPPYEMAIL_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.snappymail.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.snappymail.tls: "true"
      traefik.http.routers.snappymail.tls.certresolver: "cf_dns"
      traefik.http.routers.snappymail.service: "snappymail"
      traefik.http.routers.snappymail.middlewares: "hsts-headers@docker"
      traefik.http.services.snappymail.loadbalancer.server.port: "8888"
      traefik.docker.network: "traefik-proxy"
    networks:
      - cloudflare_web_network
      - traefik_proxy_network

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
