services:
  grafana-init:
    image: alpine
    container_name: grafana-init
    restart: "no"
    user: "0"
    volumes:
      - ${VOLUME_CONFIG}/grafana:/data
    command: chown -R 472:472 /data

  grafana:
    image: grafana/grafana-enterprise:13.2.1
    container_name: grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # No PUID/PGID: this image hardcodes UID 472 internally and ignores
    # those vars entirely. grafana-init (above) chowns the whole
    # ${VOLUME_CONFIG}/grafana tree to 472:472 on every deploy, so no
    # manual chown is needed before first deploy.
    depends_on:
      grafana-init:
        condition: service_completed_successfully
    environment:
      GF_SECURITY_ADMIN_USER: "${ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_SERVER_ROOT_URL: "https://grafana.${DOMAIN}/"
      GF_LOG_LEVEL: "info"
      TZ: "${TZ}"
    volumes:
      - ${VOLUME_CONFIG}/grafana/data:/var/lib/grafana
      - ${VOLUME_CONFIG}/grafana/provisioning:/etc/grafana/provisioning
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: "Host(`${GRAFANA_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.grafana.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.grafana.tls: "true"
      # SAN-bundle (group "infra-ops"): this router is a MEMBER, not the
      # anchor - no tls.certresolver/tls.domains here. The anchor is
      # glances/docker-compose.yml, which requests one bundled cert
      # covering this hostname alongside the rest of the infra-ops group.
      traefik.http.routers.grafana.service: "grafana"
      traefik.http.routers.grafana.middlewares: "hsts-headers@docker"
      traefik.http.routers.grafana-tailnet.rule: "Host(`${GRAFANA_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.grafana-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.grafana-tailnet.tls: "true"
      traefik.http.routers.grafana-tailnet.service: "grafana"
      traefik.http.routers.grafana-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
      traefik.docker.network: "traefik-proxy"
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
      - monitoring_network

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
  monitoring_network:
    name: monitoring-net
    external: true
