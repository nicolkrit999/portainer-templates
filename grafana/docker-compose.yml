services:
  grafana-init:
    image: alpine
    container_name: grafana-init
    restart: "no"
    user: "0"
    environment:
      DISCORD_ALERT_WEBHOOK_URL: "${DISCORD_ALERT_WEBHOOK_URL}"
    volumes:
      - ${VOLUME_CONFIG}/grafana:/data
    # chmod after chown: the NAS's btrfs volume is mounted with the `ugacl`
    # option (Synology-style Windows-ACL layer) which silently overrides
    # POSIX mode bits and is invisible to ls/getfacl/chown - an explicit
    # chmod resets that ACL layer so grafana can actually read provisioning/.
    # 0700 (owner-only) is sufficient: chown just above sets owner to
    # 472:472, and only this container (root, during init) and the grafana
    # container (uid 472) ever need access - no group/other bits needed.
    #
    # The sed step renders contactpoints.yml.template into the real
    # contactpoints.yml at startup - a workaround for Grafana's broken
    # alerting-provisioning env-var interpolation (grafana/grafana#54984,
    # #56437), see the template file's own comment for detail. The `>`
    # redirect creates that file as root (this container's user), so it
    # needs its own chown -R 472:472 pass, not just chmod - a chmod alone
    # left it root-owned and unreadable by grafana's uid 472 (confirmed
    # real bug the first time this ran).
    command: sh -c "chown -R 472:472 /data && chmod -R 0700 /data && sed 's|__DISCORD_ALERT_WEBHOOK_URL__|'\"$$DISCORD_ALERT_WEBHOOK_URL\"'|' /data/provisioning/alerting/contactpoints.yml.template > /data/provisioning/alerting/contactpoints.yml && chown 472:472 /data/provisioning/alerting/contactpoints.yml && chmod 0700 /data/provisioning/alerting/contactpoints.yml"

  grafana:
    image: grafana/grafana-enterprise:13.2.1
    container_name: grafana
    cpu_shares: 2048
    restart: always
    security_opt:
      - no-new-privileges:true
    # No PUID/PGID: this image hardcodes UID 472 internally and ignores
    # those vars entirely. grafana-init (above) chowns the whole
    # ${VOLUME_CONFIG}/grafana tree to 472:472 on every deploy, so no
    # manual chown is needed before first deploy.
    depends_on:
      grafana-init:
        condition: service_completed_successfully
    environment:
      GF_SECURITY_ADMIN_USER: "${ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_SERVER_ROOT_URL: "https://grafana.${DOMAIN}/"
      GF_LOG_LEVEL: "info"
      TZ: "${TZ}"
    volumes:
      - ${VOLUME_CONFIG}/grafana/data:/var/lib/grafana
      - ${VOLUME_CONFIG}/grafana/provisioning:/etc/grafana/provisioning
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: "Host(`${GRAFANA_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.grafana.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.grafana.tls: "true"
      # SAN-bundle (group "infra-ops"): this router is a MEMBER, not the
      # anchor - no tls.certresolver/tls.domains here. The anchor is
      # glances/docker-compose.yml, which requests one bundled cert
      # covering this hostname alongside the rest of the infra-ops group.
      traefik.http.routers.grafana.service: "grafana"
      traefik.http.routers.grafana.middlewares: "hsts-headers@docker"
      traefik.http.routers.grafana-tailnet.rule: "Host(`${GRAFANA_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.grafana-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7}"
      traefik.http.routers.grafana-tailnet.tls: "true"
      traefik.http.routers.grafana-tailnet.service: "grafana"
      traefik.http.routers.grafana-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
      traefik.docker.network: "traefik-proxy"
    networks:
      - cloudflare_web_network
      - traefik_proxy_network
      - monitoring_network

networks:
  cloudflare_web_network:
    name: cloudflare-web
    external: true
  traefik_proxy_network:
    name: traefik-proxy
    external: true
  monitoring_network:
    name: monitoring-net
    external: true
