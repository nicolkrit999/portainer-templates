apiVersion: 1

providers:
  - name: unpoller
    orgId: 1
    folder: "UniFi-unpoller"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Local JSON files only - vanilla Grafana file-provisioning cannot
      # fetch a dashboard by grafana.com ID directly. The three unpoller
      # community dashboards (11311, 11313, 11315) must be downloaded and
      # placed here manually before this provider will pick them up. See
      # the deployment README note / chat handoff for exact steps.
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false

  - name: actual-budget
    orgId: 1
    folder: "Actual Budget"
    type: file
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Separate directory from the unpoller provider's path above, so a file
      # here is not also picked up by the UniFi folder (providers read their
      # path recursively).
      path: /etc/grafana/provisioning/dashboards/actual-budget
      foldersFromFilesStructure: false
