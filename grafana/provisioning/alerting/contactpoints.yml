apiVersion: 1

# Grafana expands ${VAR} / $VAR against the container's own environment when
# reading provisioning files - no extra GF_ setting is required for this to
# work. This applies to contact point `settings`/`secure_settings` values;
# it does NOT apply to alert rule annotations, time ranges, or the rule
# query model (those need a different mechanism), which is one reason
# alert *rules* are deliberately not shipped in this repo yet - see rules.yml.
contactPoints:
  - orgId: 1
    name: discord-alerts
    receivers:
      - uid: discord-alerts-webhook
        type: discord
        settings:
          url: "${DISCORD_ALERT_WEBHOOK_URL}"
          use_discord_username: false
          message: |-
            {{ if eq .Status "firing" }}:rotating_light:{{ else }}:white_check_mark:{{ end }} **{{ .Status | toUpper }}** - {{ .CommonLabels.alertname }}
            {{ range .Alerts }}
            > {{ .Annotations.summary }}
            {{ end }}
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: discord-alerts
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
