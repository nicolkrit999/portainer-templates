apiVersion: 1

# Grafana's provisioning env-var interpolation ONLY supports bare $VAR, not
# ${VAR} with braces (confirmed against Grafana's own docs and
# github.com/grafana/grafana/issues/40148) - the braces form gets treated as
# an unrecognized/empty variable, so `url` silently ends up "" and Grafana
# fails alerting provisioning entirely with "could not find webhook url
# property in settings". `url` also belongs under plain `settings`, not
# `secure_settings` - per that same issue, Discord's url is a regular
# setting despite looking secret-shaped.
contactPoints:
  - orgId: 1
    name: discord-alerts
    receivers:
      - uid: discord-alerts-webhook
        type: discord
        settings:
          url: "$DISCORD_ALERT_WEBHOOK_URL"
          use_discord_username: false
          message: |-
            {{ if eq .Status "firing" }}:rotating_light:{{ else }}:white_check_mark:{{ end }} **{{ .Status | toUpper }}** - {{ .CommonLabels.alertname }}
            {{ range .Alerts }}
            > {{ .Annotations.summary }}
            {{ end }}
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: discord-alerts
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
