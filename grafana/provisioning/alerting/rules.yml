apiVersion: 1

# ============================================================================
# WAN-down and AP-offline rules (below) confirmed against a live unpoller
# scrape on 2026-09-07:
#   - unpoller_wan_interface_state{state=...} is 1 iff that WAN interface's
#     raw controller state is ACTIVE, 0 otherwise (state label carries the
#     raw value: ACTIVE/BACKUP/DISCONNECTED). Summing it per site and
#     alerting on 0 catches "no WAN interface is active" - i.e. real outage,
#     not just a failover to backup.
#   - unpoller_site_disconnected{subsystem="wlan"} is the controller-reported
#     count of disconnected WLAN devices (APs) at the site. Alerting on >0
#     catches an AP going offline without needing a guessed uptime-reset
#     heuristic.
# ============================================================================
#
# NOTE on datasourceUid below: grafana/provisioning/datasources/prometheus.yml
# does not currently pin an explicit `uid:` on the Prometheus datasource, so
# Grafana auto-assigns one - and that auto-assigned value is not guaranteed
# stable across container restarts (confirmed Grafana behavior when `uid` is
# omitted from a provisioned datasource). This rule assumes the datasource
# will be pinned to `uid: prometheus` in that file. That one-line addition
# to prometheus.yml was intentionally NOT made here per the instruction to
# leave the datasource file untouched - it needs to be applied (with the
# user's confirmation) before this rule will reliably resolve to the right
# datasource across restarts.

groups:
  - orgId: 1
    name: unifi-network-health
    folder: "UniFi / unpoller"
    interval: 1m
    rules:
      - uid: unpoller-high-port-error-rate
        title: High port error rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: "rate(unpoller_device_port_receive_errors_total[5m]) + rate(unpoller_device_port_transmit_errors_total[5m])"
              instant: true
              range: false
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.02
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 5m
        orgId: 1
        labels:
          severity: warning
        annotations:
          summary: "Combined rx+tx error rate exceeded 0.02/s on a UniFi switch/AP port for 5m or more."
          description: "A port's combined receive+transmit error rate (unpoller_device_port_receive_errors_total + unpoller_device_port_transmit_errors_total) has stayed above 0.02/s for at least 5 minutes. Check the Grafana alert instance labels for which device/port, and investigate for a bad cable, SFP, or duplex mismatch."

      - uid: unpoller-wan-down
        title: WAN link down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: "sum by (site_name) (unpoller_wan_interface_state)"
              instant: true
              range: false
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 2m
        orgId: 1
        labels:
          severity: critical
        annotations:
          summary: "No active WAN interface for at least 2m - internet is down."
          description: "sum(unpoller_wan_interface_state) by site has been 0 for at least 2 minutes, meaning no WAN interface currently reports ACTIVE (all are BACKUP or DISCONNECTED). This means real internet loss, not just a failover to a backup link. Check the gateway/UDM at the site named in the alert instance labels."

      - uid: unpoller-ap-offline
        title: Access point offline
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: 'unpoller_site_disconnected{subsystem="wlan"}'
              instant: true
              range: false
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 5m
        orgId: 1
        labels:
          severity: warning
        annotations:
          summary: "At least one UniFi access point has been disconnected for 5m or more."
          description: "unpoller_site_disconnected{subsystem=\"wlan\"} (controller-reported count of disconnected WLAN devices) has been above 0 for at least 5 minutes. Check the UniFi controller for which AP dropped - this covers real AP outages, not brief blips."
