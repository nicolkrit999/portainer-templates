services:
  homebox:
    container_name: homebox
    image: ghcr.io/sysadminsmedia/homebox:0.27.1
    mem_limit: 3g
    cpu_shares: 2048
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    volumes:
      - ${DOCKER_CONFIG_DIR}/homebox:/data:rw
    environment:
      HBOX_LOG_LEVEL: "info"
      HBOX_LOG_FORMAT: "text"
      HBOX_WEB_MAX_UPLOAD_SIZE: "5000"
      HBOX_WEB_READ_TIMEOUT: "24h"
      HBOX_WEB_WRITE_TIMEOUT: "24h"
      HBOX_WEB_IDLE_TIMEOUT: "180s"
      HBOX_OPTIONS_ALLOW_REGISTRATION: "false"
      HBOX_OPTIONS_TRUST_PROXY: "true"
      HBOX_AUTH_API_KEY_PEPPER: "${HBOX_AUTH_API_KEY_PEPPER}"
      TZ: "${TZ}"
    labels:
      traefik.enable: "true"
      traefik.http.routers.homebox.rule: "Host(`${HOMEBOX_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.homebox.entrypoints: "${TRAEFIK_ENTRYPOINT_1}"
      traefik.http.routers.homebox.tls: "true"
      traefik.http.routers.homebox.service: "homebox"
      traefik.http.routers.homebox.middlewares: "hsts-headers@docker"
      traefik.http.services.homebox.loadbalancer.server.port: "7745"
      traefik.http.routers.homebox-private.rule: "Host(`${HOMEBOX_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.homebox-private.entrypoints: "${TRAEFIK_ENTRYPOINT_3}"
      traefik.http.routers.homebox-private.tls: "true"
      traefik.http.routers.homebox-private.service: "homebox-private"
      traefik.http.routers.homebox-private.middlewares: "hsts-headers@docker"
      traefik.http.routers.homebox-tailnet.rule: "Host(`${HOMEBOX_SUBDOMAIN}.${DOMAIN}`)"
      traefik.http.routers.homebox-tailnet.entrypoints: "${TRAEFIK_ENTRYPOINT_7:-tailnet-admin}"
      traefik.http.routers.homebox-tailnet.tls: "true"
      traefik.http.routers.homebox-tailnet.service: "homebox-private"
      traefik.http.routers.homebox-tailnet.middlewares: "hsts-headers@docker,tailnet-admin-only@docker"
      traefik.http.services.homebox-private.loadbalancer.server.port: "7745"
      traefik.docker.network: "traefik-proxy"
    networks:
      - traefik_proxy_network
      - public_homebox_network

networks:
  traefik_proxy_network:
    name: traefik-proxy
    external: true
  # Backend network of the public Traefik; the traefik-public stack must be deployed first.
  public_homebox_network:
    name: public-homebox
    external: true
